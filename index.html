<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Steady State BCBA Prep</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Daily BCBA exam study plan, study guide, practice questions, flashcards, and two full-length mock exams.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one centered column on a faint graph-paper ground; a sticky header with tabs; cards only for interactive objects (questions, tasks, exams). */
:root {
  --paper: #F1F4F2;
  --surface: #FFFFFF;
  --sunk: #E7ECE9;
  --ink: #14232A;
  --muted: #586970;
  --rule: #D3DBD7;
  --accent: #0D6984;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEAEE;
  --ok: #1B7046;
  --ok-soft: #E0F0E6;
  --bad: #A93828;
  --bad-soft: #F6E2DD;
  --flag: #9C6210;
  --flag-soft: #F4E8D2;
  --grid: rgba(20, 35, 42, .055);
  --shadow: 0 1px 2px rgba(20, 35, 42, .06), 0 4px 14px rgba(20, 35, 42, .05);
  --f-display: "Bricolage Grotesque", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0D1416; --surface: #142024; --sunk: #1A282C; --ink: #E2EAEA; --muted: #93A3A7; --rule: #26363A;
    --accent: #5CB5D0; --accent-ink: #06171D; --accent-soft: #15333D;
    --ok: #5DC38C; --ok-soft: #12301F; --bad: #EE8B7D; --bad-soft: #3A1B17; --flag: #E2AD5B; --flag-soft: #33270F;
    --grid: rgba(226, 234, 234, .05); --shadow: 0 1px 2px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0D1416; --surface: #142024; --sunk: #1A282C; --ink: #E2EAEA; --muted: #93A3A7; --rule: #26363A;
  --accent: #5CB5D0; --accent-ink: #06171D; --accent-soft: #15333D;
  --ok: #5DC38C; --ok-soft: #12301F; --bad: #EE8B7D; --bad-soft: #3A1B17; --flag: #E2AD5B; --flag-soft: #33270F;
  --grid: rgba(226, 234, 234, .05); --shadow: 0 1px 2px rgba(0,0,0,.3);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 400 15px/1.55 var(--f-body);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
[hidden] { display: none !important; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.2; text-wrap: balance; margin: 0; letter-spacing: -.01em; }
h1 { font-size: 1.85rem; font-weight: 700; }
h2 { font-size: 1.35rem; font-weight: 700; }
h3 { font-size: 1.08rem; font-weight: 700; }
p { margin: 0; }
.wrap { width: 100%; max-width: 1000px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.eyebrow { font: 500 .72rem/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--rule); }
.topin { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px 4px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; }
.mark { width: 38px; height: 26px; color: var(--ink); flex: none; }
.bname { font: 700 1.15rem/1 var(--f-display); }
.bsub { font: 500 .7rem/1 var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 4px 6px; border: 1px solid var(--rule); border-radius: 4px; }
.count { font: 500 .8rem/1.2 var(--f-mono); color: var(--muted); text-align: right; }
.count b { color: var(--ink); font-weight: 500; }
.tabs { display: flex; flex-wrap: wrap; gap: 2px 4px; padding-block: 4px 0; }
.tabs a { color: var(--muted); text-decoration: none; font-weight: 500; font-size: .9rem; padding: 8px 10px 9px; border-bottom: 2px solid transparent; }
.tabs a:hover { color: var(--ink); }
.tabs a.on { color: var(--ink); border-bottom-color: var(--accent); }

main { padding-block: 24px 40px; display: flex; flex-direction: column; gap: 22px; outline: none; }
.foot { color: var(--muted); font-size: .78rem; padding-block: 0 32px; }

/* generic */
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.between { justify-content: space-between; }
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); min-width: 0; }
.sectionhead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.lead { color: var(--muted); max-width: 65ch; }

.btn { appearance: none; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); font: 600 .9rem/1 var(--f-body); padding: 10px 14px; border-radius: 8px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { filter: brightness(1.07); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.quiet { background: transparent; color: var(--ink); border-color: var(--rule); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.btn.sm { padding: 7px 10px; font-size: .82rem; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

.pill { display: inline-flex; align-items: center; gap: 6px; font: 500 .72rem/1 var(--f-mono); letter-spacing: .04em; padding: 5px 7px; border-radius: 5px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.pill.acc { background: var(--accent-soft); color: var(--accent); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.flag { background: var(--flag-soft); color: var(--flag); }

.seg { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.seg button { appearance: none; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); font: 500 .85rem/1 var(--f-body); padding: 9px 12px; border-radius: 7px; cursor: pointer; }
.seg button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.seg button .k { font-family: var(--f-mono); font-weight: 500; margin-right: 4px; }

/* tiles */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: 14px; }
.tile .v { font: 700 1.6rem/1.1 var(--f-display); font-variant-numeric: tabular-nums; margin-top: 6px; }
.tile .s { color: var(--muted); font-size: .8rem; margin-top: 2px; }
@media (max-width: 720px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* today */
.dayhead { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline; justify-content: space-between; }
.tasks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.task { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 11px 0; border-top: 1px solid var(--rule); }
.task:first-child { border-top: 0; }
.tick { width: 24px; height: 24px; border-radius: 6px; border: 1.5px solid var(--muted); background: transparent; color: transparent; cursor: pointer; display: grid; place-items: center; padding: 0; font: 700 14px/1 var(--f-body); }
.task.done .tick { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.task.done .ttext { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--rule); }
.ttext { min-width: 0; }
.ttext .note { display: block; color: var(--muted); font-size: .82rem; text-decoration: none; }
.progressbar { height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.progressbar > span { display: block; height: 100%; background: var(--accent); }

.twocol { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 820px) { .twocol { grid-template-columns: minmax(0, 1fr); } }

.chartbox { overflow-x: auto; }
.chartbox svg { display: block; width: 100%; min-width: 300px; height: auto; }
.chartbox text { font-family: var(--f-mono); font-size: 10.5px; fill: var(--muted); }
.dbars { display: flex; flex-direction: column; gap: 9px; }
.dbar { display: grid; grid-template-columns: 22px minmax(0, 1fr) 70px; gap: 8px; align-items: center; font-size: .82rem; }
.dbar .k { font-family: var(--f-mono); color: var(--muted); }
.dbar .track { height: 10px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.dbar .fill { height: 100%; background: var(--accent); }
.dbar .fill.low { background: var(--bad); }
.dbar .fill.mid { background: var(--flag); }
.dbar .val { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; color: var(--muted); }

/* plan */
.week { display: flex; flex-direction: column; gap: 8px; }
details.day { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); }
details.day > summary { list-style: none; cursor: pointer; padding: 12px 16px; display: grid; grid-template-columns: 86px minmax(0, 1fr) auto; gap: 12px; align-items: center; }
details.day > summary::-webkit-details-marker { display: none; }
details.day .dd { font: 500 .78rem/1.2 var(--f-mono); color: var(--muted); }
details.day .dt { font-weight: 600; min-width: 0; }
details.day .tasks { padding: 0 16px 8px; }
details.day.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
details.day.past .dt { color: var(--muted); }

/* guide */
.guide { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 24px; align-items: start; }
.gnav { position: sticky; top: calc(var(--hh, 96px) + 16px); display: flex; flex-direction: column; gap: 2px; }
.gnav button { appearance: none; background: none; border: 0; text-align: left; padding: 8px 10px; border-radius: 7px; color: var(--ink); font: 500 .88rem/1.3 var(--f-body); cursor: pointer; display: grid; grid-template-columns: 22px minmax(0, 1fr) 14px; gap: 6px; align-items: start; }
.gnav button .k { font-family: var(--f-mono); color: var(--muted); font-size: .8rem; padding-top: 1px; }
.gnav button.on { background: var(--accent-soft); color: var(--accent); }
.gnav button .rd { color: var(--ok); font-size: .8rem; }
.gselect { display: none; }
@media (max-width: 820px) { .guide { grid-template-columns: minmax(0, 1fr); } .gnav { display: none; } .gselect { display: block; } }
select, input[type="date"], input[type="number"], textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 9px 10px; max-width: 100%; }
textarea { width: 100%; min-height: 110px; font-family: var(--f-mono); font-size: .8rem; }
.prose { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: clamp(18px, 4vw, 34px); min-width: 0; }
.prose > * + * { margin-top: 14px; }
.prose h2 { font-size: 1.6rem; margin-bottom: 4px; }
.prose h3 { scroll-margin-top: calc(var(--hh, 96px) + 16px); margin-top: 26px; padding-top: 14px; border-top: 1px solid var(--rule); }
.prose h4 { margin-top: 18px; font-size: 1rem; }
.prose p, .prose li { max-width: 68ch; }
.prose ul, .prose ol { padding-left: 1.3em; margin-bottom: 0; }
.prose li + li { margin-top: 5px; }
.prose strong { font-weight: 600; }
.tbl { overflow-x: auto; border: 1px solid var(--rule); border-radius: 8px; }
.tbl table { border-collapse: collapse; width: 100%; font-size: .86rem; }
.tbl th { text-align: left; font: 600 .74rem/1.3 var(--f-body); text-transform: uppercase; letter-spacing: .04em; color: var(--muted); background: var(--sunk); padding: 9px 10px; }
.tbl td { padding: 9px 10px; border-top: 1px solid var(--rule); vertical-align: top; }
.tbl td:first-child { font-weight: 600; }
.gfoot { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; padding-top: 18px; border-top: 1px solid var(--rule); }

/* questions */
.qcard { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: clamp(16px, 3.5vw, 28px); display: flex; flex-direction: column; gap: 16px; box-shadow: var(--shadow); min-width: 0; }
.qmeta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.stem { font-size: 1.06rem; line-height: 1.6; max-width: 70ch; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { appearance: none; text-align: left; display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; padding: 11px 12px; border: 1px solid var(--rule); border-radius: 9px; background: var(--surface); color: var(--ink); font: 400 .95rem/1.45 var(--f-body); cursor: pointer; }
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt .let { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; font: 500 .82rem/1 var(--f-mono); background: var(--sunk); color: var(--muted); }
.opt .tag { font: 500 .7rem/1 var(--f-mono); text-transform: uppercase; letter-spacing: .05em; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .let { background: var(--accent); color: var(--accent-ink); }
.opt.ok { border-color: var(--ok); background: var(--ok-soft); }
.opt.ok .let { background: var(--ok); color: var(--surface); }
.opt.ok .tag { color: var(--ok); }
.opt.bad { border-color: var(--bad); background: var(--bad-soft); }
.opt.bad .let { background: var(--bad); color: var(--surface); }
.opt.bad .tag { color: var(--bad); }
.opt.dim { opacity: .62; }
.opt[disabled] { cursor: default; }
.fb { border-radius: 9px; padding: 14px 16px; border: 1px solid; display: flex; flex-direction: column; gap: 8px; }
.fb.ok { background: var(--ok-soft); border-color: var(--ok); }
.fb.bad { background: var(--bad-soft); border-color: var(--bad); }
.fb .fbh { font-weight: 600; }
.fb.ok .fbh { color: var(--ok); }
.fb.bad .fbh { color: var(--bad); }
.fb .why { color: var(--ink); max-width: 70ch; }
.fb .lbl { font: 500 .7rem/1 var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: block; margin-bottom: 4px; }
.qnav { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; }
.kbd { font: 500 .72rem/1 var(--f-mono); color: var(--muted); }

/* exam */
.exambar { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--hh, 96px) + 8px); z-index: 4; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; box-shadow: var(--shadow); }
.timer { font: 500 1rem/1 var(--f-mono); font-variant-numeric: tabular-nums; }
.timer.low { color: var(--bad); }
.qmap { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 5px; padding: 14px; }
.qmap button { appearance: none; border: 1px solid var(--rule); background: var(--surface); color: var(--muted); font: 500 .74rem/1 var(--f-mono); padding: 8px 0; border-radius: 5px; cursor: pointer; }
.qmap button.ans { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.qmap button.fl { box-shadow: inset 0 -3px 0 var(--flag); }
.qmap button.cur { border-color: var(--ink); color: var(--ink); }
.qmap button.r-ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.qmap button.r-bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
details.mapbox { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); }
details.mapbox > summary { cursor: pointer; padding: 12px 14px; font-weight: 600; }
.confirm { border: 1px solid var(--flag); background: var(--flag-soft); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.confirm.danger { border-color: var(--bad); background: var(--bad-soft); }

.mocks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 680px) { .mocks { grid-template-columns: minmax(0, 1fr); } }
.mock { display: flex; flex-direction: column; gap: 12px; }
.score { font: 700 2.8rem/1 var(--f-display); font-variant-numeric: tabular-nums; }
.review-item { display: flex; flex-direction: column; gap: 10px; padding: 18px 0; border-top: 1px solid var(--rule); }
.review-item:first-child { border-top: 0; padding-top: 0; }
.rlist { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: 18px; }
.ropt { font-size: .9rem; padding: 7px 10px; border-radius: 7px; display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; }
.ropt .let { font-family: var(--f-mono); color: var(--muted); }
.ropt.ok { background: var(--ok-soft); }
.ropt.bad { background: var(--bad-soft); }
.ropt .tag { font: 500 .68rem/1.4 var(--f-mono); text-transform: uppercase; letter-spacing: .05em; }
.ropt.ok .tag { color: var(--ok); }
.ropt.bad .tag { color: var(--bad); }

/* question bank coverage */
.covs { display: flex; flex-direction: column; gap: 9px; }
.cov { display: grid; grid-template-columns: 22px minmax(0, 15em) minmax(0, 1fr) 70px; gap: 10px; align-items: center; font-size: .82rem; }
.cov .k { font-family: var(--f-mono); color: var(--muted); }
.cov .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cov .track { display: flex; height: 10px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.cov .okf { background: var(--ok); }
.cov .missf { background: var(--bad); }
.cov .val { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; color: var(--muted); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin: 0 4px 0 10px; vertical-align: -1px; }
.dot.ok { background: var(--ok); }
.dot.bad { background: var(--bad); }
@media (max-width: 560px) { .cov { grid-template-columns: 22px minmax(0, 1fr) 70px; } .cov .nm { display: none; } }

/* flashcards */
.flash { perspective: 1200px; }
.fcard { appearance: none; width: 100%; min-height: 230px; border: 1px solid var(--rule); border-radius: 14px; background: var(--surface); color: var(--ink); padding: clamp(20px, 5vw, 40px); cursor: pointer; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 12px; text-align: center; box-shadow: var(--shadow); font: inherit; }
.fcard .front { font: 700 1.45rem/1.3 var(--f-display); max-width: 30ch; text-wrap: balance; }
.fcard .back { font-size: 1.02rem; line-height: 1.6; max-width: 60ch; }
.fcard.flipped { background: var(--accent-soft); border-color: var(--accent); }
.boxes { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.boxes div { background: var(--sunk); border-radius: 6px; padding: 8px; text-align: center; font-size: .75rem; color: var(--muted); }
.boxes b { display: block; font: 500 1.05rem/1.2 var(--f-mono); color: var(--ink); }

.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 600; font-size: .88rem; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 8px; font-size: .88rem; z-index: 20; max-width: calc(100% - 32px); }

@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
@media (prefers-reduced-motion: no-preference) {
  .opt, .btn, .seg button, .fcard { transition: background-color .15s, border-color .15s, filter .15s; }
}
@media (max-width: 520px) {
  h1 { font-size: 1.5rem; }
}

</style>
</head>
<body>
<header class="top">

{ id: 'A', q: 8, short: 'Philosophical foundations', title: 'Behaviorism and philosophical foundations', md: `
This domain asks you to recognize the worldview behind ABA. Questions usually describe a statement or practice and ask which assumption or dimension it reflects.

### Goals of the science (A.1)

The goals run in order of sophistication: **description** (what happens), **prediction** (what tends to happen together, a correlation), and **control** (changing one variable and seeing behavior change, a functional relation). Control is the highest level of understanding.

### Philosophical assumptions (A.2)

| Assumption | Plain meaning | Exam cue |
| --- | --- | --- |
| Determinism | Behavior is lawful, caused by variables, not random | "Behavior happens for a reason" |
| Empiricism | Knowledge comes from objective observation and measurement | "Let's collect data before deciding" |
| Experimentation | Manipulate variables to show functional relations | Testing, not just watching |
| Replication | Repeat effects to establish reliability | Same result across sessions or people |
| Parsimony | Rule out the simplest explanations first | Check the environment before hidden causes |
| Philosophic doubt | Stay skeptical, even of your own findings | Willing to revise conclusions |
| Selectionism | Behavior is selected by consequences, like natural selection | Phylogenic, ontogenic, cultural levels |
| Pragmatism | Truth is judged by usefulness and results | "Does it work for this client?" |

### Radical behaviorism (A.3)

Radical behaviorism is Skinner's philosophy. It includes private events (thoughts, feelings) as behavior governed by the same principles as public behavior. It rejects **mentalism**: explaining behavior with inner causes like "he hits because he's angry" or "she has low self-esteem." These are explanatory fictions and circular reasoning. The test: if the "cause" is only inferred from the behavior it supposedly explains, it is circular.

Methodological behaviorism, by contrast, acknowledges private events exist but excludes them from scientific study because they cannot be publicly observed.

### Four branches (A.4)

- **Behaviorism**: the philosophy of the science.
- **Experimental analysis of behavior (EAB)**: basic research, often lab and nonhuman, discovering principles.
- **Applied behavior analysis (ABA)**: research applying principles to socially significant behavior.
- **Professional practice**: delivering services guided by the science.

### Seven dimensions of ABA (A.5)

From Baer, Wolf, and Risley (1968). Mnemonic: **Get A Cookie** (Generality, Applied, Conceptually systematic, Analytic, Behavioral, Effective, Technological).

| Dimension | What it means | Exam cue |
| --- | --- | --- |
| Applied | Socially significant behavior for the person | Chosen because it matters in their life |
| Behavioral | Observable, measurable behavior of the actual person | Measures what was done, not what was said |
| Analytic | Shows a functional relation (experimental control) | Behavior changed when, and only when, the IV was applied |
| Technological | Procedures described clearly enough to replicate | "A stranger could implement it from the write-up" |
| Conceptually systematic | Procedures linked to basic principles | Described as "reinforcement," not a "cool trick" |
| Effective | Change is large enough to matter practically | Not just statistically detectable |
| Generality | Change lasts over time and across settings and behaviors | Maintenance and generalization |

Common trap: **technological** is about the written description; **conceptually systematic** is about linking to principles.

**Self-check:** A teacher says a student "acts out because of ADHD." Which concept does this violate? Answer: it is an explanatory fiction (mentalism); parsimony says look at environmental variables first.
` },

{ id: 'B', q: 24, short: 'Concepts and principles', title: 'Concepts and principles', md: `
This is the foundation for every other domain. If you can name what happened to a stimulus and what happened to future behavior, most B questions answer themselves.

### Basic units (B.1 to B.3)

- **Behavior** is the general activity; a **response** is one instance; a **response class** is a group of responses with the same effect (function), even if they look different. Screaming, hitting, and dropping to the floor can all be one response class if they all produce escape.
- A **stimulus class** is a set of stimuli sharing a feature (formal: look alike; temporal: occur at the same time; functional: same effect on behavior).
- **Respondent** behavior is elicited by preceding stimuli (reflexes, conditioned fear). Learning happens by pairing stimuli: a neutral stimulus paired with an unconditioned stimulus becomes a conditioned stimulus. **Operant** behavior is selected by its consequences.

### The contingency 2x2 (B.4, B.5)

Ask two questions. Was a stimulus **added** or **removed**? Did future behavior **increase** (reinforcement) or **decrease** (punishment)?

| | Behavior increases | Behavior decreases |
| --- | --- | --- |
| Stimulus added | Positive reinforcement | Positive punishment |
| Stimulus removed | Negative reinforcement | Negative punishment |

Positive and negative mean add and subtract, never good and bad. Negative reinforcement is **not** punishment. Escape removes something already present; avoidance prevents it from coming. Both are negative reinforcement. You can only label a consequence by its effect on future behavior; if behavior did not change, it was not reinforcement or punishment.

### Automatic vs socially mediated (B.6)

Socially mediated: another person delivers the consequence (attention, escape from a demand, a tangible). Automatic: the behavior produces the consequence itself (scratching an itch, vocal stereotypy that "sounds good"). Automatic reinforcement can be positive or negative.

### Reinforcers and punishers (B.7, B.8)

- **Unconditioned**: work without learning (food, water, pain, temperature).
- **Conditioned**: gained their power through pairing (praise, a grade, the word "no").
- **Generalized conditioned**: paired with many backup reinforcers, so less dependent on any one MO (money, tokens, attention). Resistant to satiation.

### Schedules of reinforcement (B.9, B.10)

| Schedule | Rule | Typical pattern |
| --- | --- | --- |
| FR (fixed ratio) | Every n responses | High rate, post-reinforcement pause |
| VR (variable ratio) | An average of n responses | High, steady rate; very resistant to extinction |
| FI (fixed interval) | First response after a fixed time | Scallop: slow after reinforcement, speeds up near the end |
| VI (variable interval) | First response after an average time | Moderate, steady rate |
| CRF | Every response (FR 1) | Fast acquisition, fast extinction |
| FT / VT | Delivery by time, no response needed | Noncontingent reinforcement |
| DRH / DRL | Reinforce high or low rates | Changes rate, not form |
| Limited hold | Reinforcer available only for a window after the interval | Raises rate on interval schedules |

Intermittent schedules produce more resistance to extinction than continuous ones. **Ratio strain** happens when you thin a ratio too fast and responding breaks down.

Compound schedules, the most-confused set:

| Schedule | Components run | Signaled with an SD? | Reinforcer |
| --- | --- | --- | --- |
| Concurrent | At the same time; the client chooses | Each has its own | Each option |
| Multiple | One after another, alternating | Yes | Each component |
| Mixed | One after another, alternating | No | Each component |
| Chained | Fixed sequence | Yes | Only at the end |
| Tandem | Fixed sequence | No | Only at the end |
| Alternative | Whichever requirement is met first | Not applicable | First one met |
| Conjunctive | Both requirements must be met | Not applicable | When both are met |

Memory trick: **M**ultiple and **ch**ained have signals; mi**x**ed and tandem do not. Multiple and mixed reinforce each component; chained and tandem reinforce only at the end.

### Extinction (B.11)

Operant extinction: stop delivering the reinforcer that maintained the behavior. The procedure must match function. Ignoring attention-maintained behavior is extinction; ignoring escape-maintained behavior is not, because the child still escapes. Expect an **extinction burst** (temporary increase in rate, intensity, or new topographies), possible **extinction-induced aggression**, and **spontaneous recovery** (the behavior briefly reappears later). Respondent extinction: present the CS repeatedly without the US until it no longer elicits the response.

Extinction as an **operation** is what you do (withhold reinforcement). As a **process** it is what happens to behavior (it decreases).

### Stimulus control (B.12 to B.15)

- **SD**: signals that reinforcement is available for a response. **S-delta**: signals that it is not. **SDp**: signals that punishment is likely.
- **Stimulus control**: behavior occurs more often in the presence of the SD than in its absence.
- **Discrimination**: responding differently to different stimuli (says "dog" to dogs, not cats).
- **Stimulus generalization**: the same response occurs to new, similar stimuli (says "dog" to an unfamiliar breed). Overgeneralization: says "dog" to a cat.
- **Response generalization**: new, untrained responses with the same function appear (learned to say "hi," also starts saying "hello").
- **Response maintenance**: behavior continues after the intervention is withdrawn.

### Motivating operations (B.16, B.17)

An MO changes (1) how effective a consequence is right now (value-altering effect) and (2) how often behavior that produced it occurs (behavior-altering effect).

- **EO** (establishing operation): increases value. Hungry, so food matters more.
- **AO** (abolishing operation): decreases value. Just ate, so food matters less.
- **UMO**: unlearned (deprivation, satiation, pain, temperature).
- **CMO-S** (surrogate): a stimulus paired with a UMO takes on its effect.
- **CMO-R** (reflexive): a stimulus that signals worsening or improvement makes its own removal reinforcing. Classic example: a demand signals work is coming, so escape from the demand becomes valuable.
- **CMO-T** (transitive): one stimulus makes another stimulus valuable. A locked door makes the key valuable.

**MO vs SD**: an SD signals that a reinforcer is **available**; an MO changes how much you **want** it. Test: if the reinforcer would be available even without the stimulus, and the stimulus only changes how much it is wanted, it is an MO.

### Rule-governed vs contingency-shaped (B.18)

Rule-governed behavior is controlled by a verbal description of a contingency ("Wear a seatbelt or you'll get a ticket"). It is useful when consequences are delayed, small, or improbable. Contingency-shaped behavior is learned by directly contacting the consequences.

### Verbal operants (B.19, B.20)

The trick: identify the **antecedent** and the **consequence**.

| Operant | Antecedent | Consequence | Point-to-point correspondence? | Example |
| --- | --- | --- | --- | --- |
| Mand | MO | Specific reinforcer (what was asked for) | No | Thirsty, says "water," gets water |
| Tact | Nonverbal stimulus | Generalized (praise) | No | Sees a dog, says "dog" |
| Echoic | Verbal, vocal | Generalized | Yes, same form | Hears "ball," says "ball" |
| Intraverbal | Verbal | Generalized | No | Hears "How are you?" says "Good" |
| Textual | Written words | Generalized | Yes, different form | Reads "cat" aloud |
| Transcription | Spoken words | Generalized | Yes, different form | Hears "cat," writes cat |
| Copying a text | Written words | Generalized | Yes, same form | Copies a written word |
| Autoclitic | Own verbal behavior | Generalized | Not applicable | "I **think** it's raining" |
| Listener responding | Verbal | Varies | Not applicable | Touches the cup when told "touch cup" |

The mand is the only operant that directly benefits the speaker and is controlled by an MO. **Multiple control**: convergent (one response controlled by several variables, such as saying "cookie" because you see one and want one) and divergent (one variable evokes several responses).

### Emergent relations (B.21)

Teach a few relations, get more for free. Stimulus equivalence requires three properties:

- **Reflexivity**: A = A (matching identical stimuli; generalized identity matching).
- **Symmetry**: taught A to B, then B to A emerges.
- **Transitivity**: taught A to B and B to C, then A to C emerges.
- **Equivalence test**: taught A to B and B to C, then C to A emerges (symmetry and transitivity combined).

Relational frame theory extends this to other relations (bigger than, opposite of). Recombinative generalization and matrix training are also generative.

### Behavioral momentum and matching law (B.22, B.23)

- **Behavioral momentum**: behavior reinforced at a high rate is more resistant to change. High-probability request sequence: give 3 to 5 easy requests the person reliably does, then the low-probability request.
- **Matching law**: the proportion of responding to an option matches the proportion of reinforcement it gets. If a child gets attention for problem behavior 80% of the time and for appropriate requests 20% of the time, expect most responding to go to problem behavior. Fix it by making the replacement behavior pay off more richly.

### Imitation vs observational learning (B.24)

Imitation: behavior that copies a model, occurs right after it, matches its form, and is controlled by the model. Observational learning: learning by watching others' behavior and its consequences; the behavior may show up later.

**Self-check:** A child bangs her head when a demand is presented, and the demand is removed. What is the contingency, and what kind of MO is the demand? Answer: negative reinforcement (escape); the demand functions as a CMO-R.
` },

{ id: 'C', q: 21, short: 'Measurement and data', title: 'Measurement, data display, and interpretation', md: `
Most C questions ask which measurement fits a behavior or what a graph shows. Match the measure to the dimension that matters for the client.

### Operational definitions (C.1)

A good definition is **objective** (observable), **clear** (readable by a stranger), and **complete** (includes examples and non-examples, and when an instance starts and stops). "Aggression" is not a definition; "hitting another person with an open or closed hand, from contact above the waist" is. Function-based definitions group responses by effect; topography-based definitions describe the form.

### Direct, indirect, product measures (C.2)

- **Direct**: observe the behavior as it happens.
- **Indirect**: interviews, rating scales, checklists (less reliable).
- **Permanent product**: measure the result after the fact (completed worksheets, items assembled). Useful when the behavior always leaves a product and you cannot watch.

### Dimensions and measures (C.3, C.4, C.7)

| Measure | What it captures | Use when |
| --- | --- | --- |
| Count | How many times | Observation length is constant |
| Rate or frequency | Count ÷ time | Observation lengths differ; the best general measure |
| Duration | How long it lasts | Tantrums, on-task time |
| Latency | Time from SD to start of response | Slow to follow instructions |
| Interresponse time (IRT) | Time between two responses | Eating too fast, DRL programs |
| Percentage | Proportion of opportunities | Trial-based work; hides the number of opportunities |
| Trials to criterion | How many trials to reach mastery | Comparing teaching efficiency |
| Celeration | Change in rate over time | Standard celeration charts (×2 means doubling per week) |
| Magnitude or intensity | Force or volume | Speaking volume, force of hits |

Repeatability = count; temporal extent = duration; temporal locus = latency and IRT.

### Continuous vs discontinuous (C.5, C.6)

Continuous measurement captures every instance (count, duration, latency). Discontinuous methods sample, so they estimate.

| Method | Score the interval if... | Bias | Best for |
| --- | --- | --- | --- |
| Whole interval | Behavior occurred the entire interval | **Underestimates** | Behaviors you want to increase (on-task) |
| Partial interval | Behavior occurred at any point | **Overestimates** | Behaviors you want to decrease (hitting) |
| Momentary time sampling | Behavior is occurring when the interval ends | Either direction | Long-duration or high-rate behavior; one observer, many clients |
| PLACHECK | How many in a group are doing it at that moment | Either | Group behavior |

Shorter intervals give more accurate estimates.

### Validity, accuracy, reliability (C.8)

- **Validity**: measuring what you mean to measure, the socially relevant dimension at the right times.
- **Accuracy**: values match the true values.
- **Reliability**: repeated measurement of the same events yields the same values.
- Threats: poor definitions, **observer drift** (gradually changing how the definition is applied), **observer reactivity** (observers change when they know they are checked), measurement bias, and poorly scheduled observations.

**Interobserver agreement (IOA)** formulas:

| Type | Formula |
| --- | --- |
| Total count | smaller count ÷ larger count × 100 |
| Mean count-per-interval | average of each interval's (smaller ÷ larger) × 100 |
| Exact count-per-interval | intervals with an exact match ÷ total intervals × 100 |
| Total duration | shorter duration ÷ longer duration × 100 |
| Mean duration-per-occurrence | average of each occurrence's (shorter ÷ longer) × 100 |
| Interval-by-interval | agreements ÷ (agreements + disagreements) × 100 |
| Scored-interval | only intervals where either observer scored; good for low-rate behavior |
| Unscored-interval | only intervals where either observer left it unscored; good for high-rate behavior |
| Trial-by-trial | trials agreed ÷ total trials × 100 |

A common benchmark is 80% or higher agreement, with IOA collected in at least 20 to 33% of sessions across conditions.

### Selecting measurement (C.9, C.12)

Pick the dimension that defines the problem. If a child takes 10 minutes to start work, latency matters, not count. If a teacher has 25 students and can only glance up, momentary time sampling is realistic. For **procedural integrity**, measure whether the plan was implemented as written: accuracy (steps done correctly) and dosage (how much of the intervention was delivered).

### Graphs and visual analysis (C.10, C.11)

- **Line graph** (equal-interval): the standard for behavior over time.
- **Bar graph**: comparing discrete conditions or summaries.
- **Cumulative record**: each response adds to the total, so the line never goes down. A steep slope means a high rate; a flat line means no responding. The Today page in this app is one.
- **Scatterplot**: shows when behavior happens across times of day.
- **Standard celeration chart**: semi-logarithmic; shows proportional change in rate.

Visual analysis looks within and across conditions at **level** (where the data sit), **trend** (direction), and **variability** (bounce). Across phases, check **immediacy** of effect, **overlap** of data points, and **consistency** across similar phases. Do not change conditions while data are highly variable or already trending in the therapeutic direction; wait for stability.

**Self-check:** You want to measure on-task behavior, and the observer can only look at the student intermittently. Which method, and what bias? Answer: momentary time sampling for feasibility; whole interval would underestimate if continuous watching were possible.
` },

{ id: 'D', q: 13, short: 'Experimental design', title: 'Experimental design', md: `
The exam wants you to pick the right design for a situation and to spot when a graph does or does not show experimental control.

### Core vocabulary (D.1 to D.3)

- **Independent variable (IV)**: what you manipulate (the intervention). **Dependent variable (DV)**: what you measure (the behavior).
- **Internal validity**: confidence that the IV, not something else, changed the DV. **External validity**: how well the result generalizes to other people, settings, and behaviors.
- **Threats to internal validity**: history (outside events), maturation (natural development over time), testing (repeated measurement changes behavior), instrumentation (measurement changes, including observer drift), regression to the mean, attrition, sequence or multiple-treatment interference, and placebo or expectancy effects.

### Single-case logic (D.4, D.5)

The person serves as their own control, with repeated measurement over time. The logic has three parts:

1. **Prediction**: a steady baseline lets you predict what would happen without change.
2. **Verification**: showing baseline would have stayed the same, by withdrawing the IV or by untreated tiers staying stable.
3. **Replication**: repeating the effect strengthens the case.

Single-case strengths: flexible, sensitive to individual change, no large samples needed, practical in clinics. Group design strengths: generalization to populations and statistical comparison, but averages can hide individual effects.

### The designs (D.7, D.9)

| Design | How it works | Best when | Watch out for |
| --- | --- | --- | --- |
| Reversal or withdrawal (A-B-A-B) | Introduce, withdraw, reintroduce the IV | Behavior is reversible and withdrawal is ethical | Not for dangerous behavior or skills that will not reverse (reading) |
| Multiple baseline | Stagger the IV across behaviors, settings, or people | Behavior will not reverse or withdrawal is unethical | Tiers must be independent yet functionally similar; long baselines for later tiers |
| Multiple probe | Multiple baseline with intermittent probes | Continuous baseline would be impractical or reactive | Fewer data points |
| Multielement or alternating treatments | Rapidly alternate two or more conditions | Comparing treatments quickly; no baseline required | Multiple-treatment interference; conditions must be discriminable |
| Changing criterion | Change the performance criterion in steps | Behavior changes gradually (exercise, cutting cigarettes) | Need stable responding at each step; vary step size and length |

In a multiple baseline, experimental control is shown when each tier changes only when the IV reaches it, while untreated tiers stay flat. An **A-B design** alone has no verification or replication, so it cannot demonstrate a functional relation.

### Types of analysis (D.8)

- **Comparative**: which of two treatments works better.
- **Component**: which parts of a treatment package are responsible (drop-out or add-in analysis).
- **Parametric**: which value or amount of the IV works best (2 vs 5 vs 10 minutes of break).

### Interpreting data (D.6)

Look for a clear change in level or trend that happens at the phase change, little overlap between phases, and replication. Be suspicious when baseline is already trending in the therapeutic direction, when variability swamps the effect, or when change starts before the IV was introduced.

**Self-check:** You want to test an intervention for self-injury and cannot ethically remove it once it works. Which design? Answer: multiple baseline, across settings or participants.
` },

{ id: 'E', q: 22, short: 'Ethics', title: 'Ethical and professional issues', md: `
Ethics questions are scenarios with several reasonable-sounding options. The right answer protects the client first, stays within your competence, documents, and uses the least drastic effective step before escalating. Read the [Ethics Code for Behavior Analysts](https://www.bacb.com/wp-content/ethics-code-for-behavior-analysts/) in full at least once before the exam; it is short and the exam follows its wording.

### The four core principles (E.1)

1. **Benefit others**: work to maximize benefit and do no harm.
2. **Treat others with compassion, dignity, and respect.**
3. **Behave with integrity**: honest, trustworthy, follow through on commitments.
4. **Ensure their competence**: practice only within your training and keep it current.

### The six sections of the Code

| Section | Covers | High-yield points |
| --- | --- | --- |
| 1. Responsibility as a professional | Integrity, competence, multiple relationships, gifts, bias, self-reporting | Avoid multiple relationships; small infrequent gifts only; self-report to the BACB within 30 days |
| 2. Responsibility in practice | Evidence-based services, consent, confidentiality, records, fees, collaboration | Least restrictive effective procedures; informed consent; keep records at least 7 years |
| 3. Responsibility to clients and stakeholders | Accepting clients, service agreements, third parties, discontinuation, transition | Do not abandon; plan transitions; client welfare over third-party wishes |
| 4. Responsibility to supervisees and trainees | Supervisory competence, volume, contracts, feedback, evaluation | Written supervision contract; manageable caseload; documented feedback |
| 5. Responsibility in public statements | Advertising, social media, testimonials, misrepresentation | No soliciting testimonials from current clients; no client information online without consent |
| 6. Responsibility in research | Review boards, informed consent, data integrity, credit | Research needs approval and consent even when it is also treatment |

### Numbers to memorize

| Rule | Timeframe |
| --- | --- |
| Keep client and supervision records | At least 7 years, or longer if law requires |
| Romantic or sexual relationship with a former client or stakeholder | Not for at least 2 years after the professional relationship ends |
| Self-report to the BACB (investigations, legal charges, and similar) | Within 30 days of becoming aware |
| Gifts | Only infrequent tokens of gratitude with no significant monetary value; check the Code's glossary for the dollar cap |

### Topics the exam loves

- **Competence (E.3)**: asked to treat something outside your training? Get training, supervision, or consultation, or refer out. Never just "read up and start."
- **Confidentiality (E.4)**: share only with consent and only what is needed. Limits include mandated reporting (suspected abuse), imminent danger, and legal requirements. Explain the limits at the start of services.
- **Public statements (E.5)**: no misrepresenting credentials (an RBT or student cannot claim or imply BCBA), no exaggerated outcome claims, no posting client images or details without consent.
- **Discontinuing services (E.6)**: valid reasons include goals met, no benefit, harm from continuing, funding ending, or an unsafe relationship. Always give notice, provide referrals, and make a transition plan. Never stop abruptly without planning.
- **Multiple relationships (E.7)**: avoid them when possible (treating a friend's child, hiring a client's parent). When unavoidable, such as in a small rural community, disclose, set boundaries, document, and seek consultation.
- **Professional relationships (E.8)**: listen actively, accept feedback without defensiveness, collaborate with other professionals such as SLPs and teachers.
- **Cultural humility, responsiveness, bias (E.9 to E.11)**: cultural humility is ongoing self-reflection and learning from clients, not claiming expertise in a culture. Include the family's values in goal selection. Identify your own biases and get supervision or training when they might affect services.
- **Legal and regulatory (E.12)**: follow state licensure laws, funding source rules, and BACB requirements. When law and the Code conflict, follow the law and take steps to resolve the conflict in line with the Code.

### When another professional acts unethically

First ask whether a client is at immediate risk. If so, act to protect them and report to the appropriate authorities. If not, and it is safe and appropriate, address it directly with the person first. If that does not resolve it, report to the relevant authority (employer, licensing board, BACB). Document each step.

**Self-check:** A parent offers you a $100 gift card at the end of treatment. What do you do? Answer: decline politely; the Code permits only small, infrequent tokens of gratitude, and you should have explained this policy at the start of services.
` },

{ id: 'F', q: 23, short: 'Behavior assessment', title: 'Behavior assessment', md: `
Assessment answers two questions: what should we teach, and why does problem behavior happen. Expect scenarios asking which assessment to do next or what a set of results means.

### Start of a case (F.1, F.2)

Review records first: medical (rule out pain, medication effects, sleep, sensory issues), educational (IEPs, prior evaluations), and the history of past interventions. Medical causes come before behavioral explanations. Gather cultural variables early: family values, language, routines, what the family considers a problem, and who should be involved in decisions.

### Skill assessments (F.3)

Criterion-referenced tools (VB-MAPP, ABLLS-R, AFLS) compare the learner to a skill sequence. Norm-referenced tools (Vineland) compare the learner to same-age peers. Also observe skills directly in natural settings. Choose goals from strengths and needs that matter to the client and family.

### Preference assessments (F.4)

| Method | How it works | Pros | Cons |
| --- | --- | --- | --- |
| Indirect (interview, survey) | Ask the client or caregivers | Quick | Least accurate |
| Free operant | Watch what the person engages with freely | No item removal, little problem behavior | Less precise ranking |
| Single stimulus | Present one item at a time | Works for learners who cannot choose between items | Weak at showing relative preference |
| Paired stimulus (forced choice) | Present items two at a time, every pair | Clear hierarchy | Time-consuming |
| MSW (with replacement) | Array; chosen item is replaced | Identifies top choices | May hide lower preferences |
| MSWO (without replacement) | Array; chosen item is removed each round | Fast, full hierarchy | Needs scanning and choice skills |

Preference is not proof of reinforcement. A **reinforcer assessment** tests whether the item actually increases behavior when made contingent. Preferences shift, so reassess often.

### Functional behavior assessment (F.5, F.6)

The four common functions: **attention**, **escape**, **tangible** (access to items or activities), and **automatic** (sensory). An FBA moves from least to most intrusive:

1. **Indirect**: interviews and rating scales (FAST, QABF, MAS). Quick but can be unreliable.
2. **Descriptive**: direct observation without manipulating anything. ABC narrative recording, ABC continuous recording, scatterplots. Shows correlations, not causation.
3. **Functional analysis (FA)**: systematically manipulate antecedents and consequences to test functions. Shows causation.

Standard FA conditions (based on Iwata and colleagues):

| Condition | Setup | Consequence for problem behavior | Tests for |
| --- | --- | --- | --- |
| Attention | Therapist busy, diverts attention | Brief attention (reprimand, concern) | Social positive (attention) |
| Demand (escape) | Therapist presents tasks | Task removed briefly | Social negative (escape) |
| Tangible | Preferred item removed | Item returned | Social positive (tangible) |
| Alone or no interaction | No materials, no people | None | Automatic |
| Play (control) | Free access to attention and items, no demands | None | Control; behavior should be low |

Reading FA results: behavior elevated in one condition compared with play indicates that function. High and similar across all conditions, including alone, suggests automatic reinforcement. Undifferentiated results may mean you need longer sessions, an extended alone condition, an individualized condition, or a different format.

Variations: **brief FA** (short sessions, often one per condition), **trial-based FA** (embedded in natural routines), **latency-based FA** (measures time to the first response, fewer instances of dangerous behavior), **precursor FA** (targets a safer behavior that reliably comes before the dangerous one), and **IISCA** (interview-informed synthesized contingency analysis, which combines the contingencies suggested by the interview).

FA risks: it may briefly strengthen problem behavior and expose the client to risk. Use safeguards and termination criteria, and get consent. For very dangerous behavior, consider precursor or latency formats.

### Interpreting results (F.7, F.8)

Refer out when the problem falls outside behavior analysis or your competence (medical issues, psychiatric concerns, speech or feeding needs you are not trained for). Prioritize goals by danger to self or others, social significance, access to new reinforcers (behavioral cusps) or other skills (pivotal behaviors), client and family priorities, and cultural fit.

**Self-check:** In an FA, problem behavior is high in the demand condition and low in all others. What function, and what intervention fits? Answer: escape; teach a functional communication response for breaks, use escape extinction, and modify task demands.
` },

{ id: 'G', q: 25, short: 'Behavior-change procedures', title: 'Behavior-change procedures', md: `
This is the largest domain. Questions describe a procedure and ask you to name it, or describe a goal and ask which procedure fits. Know each procedure's definition, when to use it, and its typical side effects.

### Reinforcement procedures (G.1)

Deliver reinforcement immediately, contingently, and at a magnitude that matches the effort. Vary reinforcers to avoid satiation. Use the MO: a reinforcer works best when the learner is somewhat deprived of it. Negative reinforcement procedures, such as letting a learner leave a task after completing a few items, are valid when designed deliberately.

### Differential reinforcement (G.2)

| Procedure | What gets reinforced | Use when | Example |
| --- | --- | --- | --- |
| DRA (alternative) | A specific replacement behavior | Teaching a functional substitute | Reinforce "break please" instead of screaming |
| DRI (incompatible) | A behavior that physically cannot co-occur | Another action can block the topography | Reinforce hands in lap instead of hand-flapping |
| DRO (other) | Absence of the target behavior for an interval | Reduce behavior quickly; no replacement specified | Reinforce every 5 minutes without hitting |
| DRL (low rate) | Responding at or below a limit | Behavior is acceptable but happens too often | Raising a hand 2 or fewer times per class |
| DRH (high rate) | Responding at or above a criterion | Behavior happens too rarely | Answering 10 or more questions in a session |
| DRD (diminishing rates) | Fewer responses than a limit, lowered gradually | Gradual reduction | Fewer than 5, then 4, then 3 call-outs |

DRO variations: whole interval vs momentary; fixed vs variable intervals; resetting (the timer restarts after the behavior). DRO's weakness is that it may reinforce some other problem behavior happening at that moment.

DRL types: full-session (fewer than X in a session), interval (no more than X per interval), and spaced-responding (a minimum IRT between responses).

Differential reinforcement works best **with extinction** of the problem behavior. Without extinction, the replacement must be more efficient than the problem behavior: less effort, faster, and richer reinforcement.

### Functional communication training

FCT is a form of DRA: teach a communicative response that produces the same reinforcer as the problem behavior. Make the response easier than the problem behavior. Later, thin with delays, multiple schedules (signals for when reinforcement is and is not available), or chained schedules.

### Time-based schedules (G.3)

**Noncontingent reinforcement (NCR)** delivers the maintaining reinforcer on a fixed-time (FT) or variable-time (VT) schedule regardless of behavior. It works as an abolishing operation, reducing the motivation for problem behavior. Start dense (based on the baseline IRT), then thin. It reduces problem behavior quickly with less of an extinction burst.

### Conditioned reinforcers and token economies (G.4)

Create conditioned reinforcers by pairing a neutral stimulus with existing reinforcers (stimulus-stimulus pairing). A token economy has three parts: target behaviors, tokens, and backup reinforcers with an exchange rate. Start with frequent exchanges and fade toward natural reinforcers. Tokens can also be removed (response cost) if planned.

### Antecedent strategies (G.5)

Manipulate MOs (offer choices, reduce effort, give breaks, NCR, high-probability requests) and establish clear SDs. Antecedent interventions prevent problem behavior; on their own they do not teach a replacement.

### Discrimination training (G.6)

Simple discrimination: respond to one SD and not others (point to the red card). Conditional discrimination: the correct response depends on another stimulus (match-to-sample, where the sample "cat" makes the cat picture correct). Use differential reinforcement: reinforce responses in the presence of the SD and withhold reinforcement in the presence of the S-delta.

### Prompting and fading (G.7, G.8)

- **Response prompts** act on the learner's behavior: verbal, gestural, modeling, physical (partial or full).
- **Stimulus prompts** change the stimulus itself: within-stimulus (making the correct card bigger) or extra-stimulus (adding an arrow). Within-stimulus prompts usually fade more easily.

| Fading strategy | How it works | Best for |
| --- | --- | --- |
| Most-to-least | Start with full help and fade to less | New skills, errorless learning, learners who make many errors |
| Least-to-most | Start with the least help and add prompts as needed | Learners with some skill; risks errors |
| Graduated guidance | Physical prompts adjusted moment to moment, shadowing | Motor tasks |
| Constant time delay | 0-second delay first, then a fixed delay (4 seconds) | Transferring control to the SD |
| Progressive time delay | The delay increases gradually | Same goal, slower fade |
| Stimulus fading | Gradually remove the exaggerated feature of a stimulus | Stimulus prompts |
| Stimulus shaping | Gradually change the stimulus topography itself | Moving from picture to word |

**Errorless learning** arranges prompts so the learner rarely errs, reducing frustration and preventing error patterns. Watch for **prompt dependence**: fade prompts systematically and reinforce independent responses more than prompted ones.

### Modeling, instructions, rules (G.9, G.10)

Modeling works best when the model is similar to the learner, competent, and seen receiving reinforcement. Video modeling and video self-modeling are common forms. Instructions and rules work when the learner has a history of following them and when they describe the contingency clearly.

### Shaping (G.11)

Shaping reinforces **successive approximations** of a target behavior while withholding reinforcement for earlier approximations (differential reinforcement plus extinction). It creates **new behavior**. Across-topography shaping changes the form (sounds to words); within-topography shaping changes a dimension (duration, force, rate). Moving too fast makes behavior break down; moving too slowly lets it get stuck.

Shaping vs prompting: shaping creates a new response; prompting gets an existing response to occur under the right conditions.

### Chaining (G.12)

First do a **task analysis**: break the skill into steps by watching a competent person, asking experts, or doing it yourself.

| Chain type | How it works | Best for |
| --- | --- | --- |
| Forward | Teach step 1, then 1 and 2, and so on | Learner can do early steps; long chains |
| Backward | Trainer does all but the last step; the learner does the last step and gets the reinforcer | Learner contacts the terminal reinforcer at once; low skill |
| Total task | Learner does every step every trial, prompted as needed | Learner already has some steps; shorter chains |
| Backward chaining with leaps ahead | Skip steps the learner already knows | Speeds up backward chaining |

Each step in a chain serves as a conditioned reinforcer for the step before and an SD for the step after.

### Trial-based vs free-operant (G.13)

**Discrete trial teaching (DTT)**: SD, response, consequence, intertrial interval. Highly structured, many learning opportunities, adult-led. **Naturalistic and free-operant** methods (incidental teaching, natural environment teaching, pivotal response training) follow the learner's motivation in natural settings, which tends to help generalization.

### Group contingencies (G.14)

- **Independent**: the same contingency for everyone; each person earns individually.
- **Dependent**: the group's reinforcement depends on one person or a few (the "hero" procedure).
- **Interdependent**: everyone must meet the criterion for anyone to earn (the Good Behavior Game). Watch for peer pressure.

### Generalization and maintenance (G.15, G.16)

Stokes and Baer (1977) strategies include teaching sufficient examples (multiple exemplars), programming common stimuli, training loosely, using indiscriminable contingencies (intermittent, unpredictable), teaching behavior that will contact natural communities of reinforcement (behavior traps), and mediating generalization (self-management). **General case analysis** selects teaching examples that cover the range of variations.

For maintenance: thin the schedule gradually (from continuous to intermittent), shift to naturally occurring reinforcers, and teach caregivers to keep the contingencies in place.

### Punishment (G.17)

| Procedure | Type | Description |
| --- | --- | --- |
| Reprimand | Positive punishment | A brief verbal "no" or correction |
| Response blocking | Positive punishment, or extinction depending on function | Physically prevent the response |
| Restitutional overcorrection | Positive punishment | Fix the damage and then some (clean the wall plus the whole room) |
| Positive practice overcorrection | Positive punishment | Repeatedly practice the correct behavior |
| Contingent exercise | Positive punishment | Physical activity unrelated to the behavior |
| Response cost | Negative punishment | Lose a reinforcer already earned (tokens) |
| Nonexclusionary time-out | Negative punishment | Stays in the setting, loses access to reinforcement (planned ignoring, time-out ribbon) |
| Exclusionary time-out | Negative punishment | Removed from the setting |

Time-out works only if the "time-in" environment is reinforcing. If the setting is aversive, time-out becomes negative reinforcement (escape). Use punishment only when reinforcement-based procedures have not worked or risk is high, with consent, monitoring, and a reinforcement component.

### Emotional and elicited effects (G.18)

Punishment and extinction can produce emotional responding, aggression, escape and avoidance, and behavioral contrast (behavior increases in another setting). Respondent effects can pair the therapist or setting with aversive stimulation. Plan for these and monitor them.

### Emergent relations in practice (G.19)

Use equivalence-based instruction: teach A to B and B to C, then test for emergent relations (B to A, A to C, C to A). Matrix training teaches some combinations of items and actions, then tests for untrained combinations. Both save teaching time.

**Self-check:** A learner with very limited skills needs to learn to zip a jacket, and you want the learner to contact the terminal reinforcer (being ready to go outside) from the first trial. Which chaining method? Answer: backward chaining.
` },

{ id: 'H', q: 20, short: 'Selecting interventions', title: 'Selecting and implementing interventions', md: `
This domain is about clinical judgment: picking the right intervention, then using data to decide what to do next. When torn between options, choose the one that is function-based, least restrictive, data-driven, and involves the family.

### Writing goals (H.1)

A measurable goal names the **learner**, the **behavior** (observable), the **conditions** (when, where, with what), and the **criterion** (how well, how often, for how long). Example: "Given a peer request to play, Jordan will respond with a related sentence in 4 of 5 opportunities across 3 consecutive sessions." Avoid words like "understand," "appreciate," or "be appropriate."

### Choosing interventions (H.2)

Weigh four things together: assessment results (function), scientific evidence, client and family preferences, and **contextual fit** (who will implement it, their skills, resources, setting, cultural values). A perfect procedure that caregivers will not or cannot implement will fail. **Social validity** asks whether goals, procedures, and outcomes are acceptable and important to the client and stakeholders.

### Replacement behaviors (H.3)

When reducing a behavior, always teach something that meets the same function. The replacement should be socially acceptable, efficient (less effort and faster reinforcement than the problem behavior), and likely to be reinforced in the natural environment. Apply the **dead-man test**: if a dead man can do it ("sit still," "not hit"), it is not a behavior goal.

### Unwanted effects (H.4)

| Procedure | Possible side effects | Plan |
| --- | --- | --- |
| Reinforcement | Satiation, dependence on artificial reinforcers, behavioral contrast | Vary reinforcers, thin, transfer to natural reinforcers |
| Extinction | Burst, aggression, spontaneous recovery, emotional responding | Combine with DRA or NCR; make sure caregivers can stay consistent through the burst |
| Punishment | Aggression, escape and avoidance, modeling of punishment, overuse by implementers | Pair with reinforcement, monitor closely, set fade-out criteria |

### Relapse (H.5)

**Resurgence**: a previously reduced behavior returns when the replacement behavior is put on extinction or its reinforcement drops (a child's request goes unanswered, so screaming comes back). **Renewal**: the behavior returns in a new context or the original one. **Reinstatement**: the behavior returns after the reinforcer is delivered again noncontingently. Prevent relapse with gradual schedule thinning, training across contexts, and caregiver training for consistency.

### Procedural integrity (H.6)

If an intervention is not working, first check whether it is being implemented as written. Low integrity calls for retraining the implementer (behavioral skills training), simplifying the plan, or changing the plan to fit the implementer. Only then conclude the intervention itself does not work.

### Data-based decisions (H.7)

| Data pattern | Likely decision |
| --- | --- |
| Steady improvement toward the goal | Continue |
| Goal met and stable | Move to maintenance, thin, generalize |
| No change after enough sessions | Check integrity, reassess function or reinforcers, modify |
| Getting worse | Check integrity and for new variables (illness, changes at home), modify quickly |
| Highly variable | Look for uncontrolled variables before deciding |

### Collaboration (H.8)

Work with teachers, SLPs, OTs, physicians, and families. Share data in plain language, respect their expertise, and coordinate goals so the client gets consistent support. Get consent before sharing information.

**Self-check:** A child's tantrums dropped with FCT, but at a new school a staff member stops honoring break requests and tantrums come back. What is that called? Answer: resurgence, possibly combined with renewal from the context change.

{ id: 'I', q: 19, short: 'Supervision and management', title: 'Personnel supervision and management', md: `
Supervision applies the same principles to staff that you apply to clients: define the behavior, find out why it is not happening, train, measure, and reinforce. Answers that blame the staff person ("they're lazy") are almost always wrong.

### Why supervision matters (I.1)

Good behavior-analytic supervision improves client outcomes, staff performance, and staff retention, and protects the profession by producing competent new practitioners.

### Building the relationship (I.2, I.3)

- Use a **written supervision contract**: roles, expectations, meeting schedule, how feedback works, how conflicts are resolved, and how the relationship can end.
- Give clear expectations from day one, deliver feedback often, and ask for feedback on your own supervision.
- **Equity** means giving every supervisee fair access to opportunities, feedback, and support, and checking your own practices for bias (who gets the good cases, who gets more of your time).

### Setting supervision goals (I.4)

Assess the supervisee's current skills (observation, competency checklists), consider their cultural background and work environment, then set specific, measurable goals.

### Behavioral skills training (I.5)

BST is the go-to training method. The four steps, in order:

1. **Instructions**: describe the skill and why it matters.
2. **Modeling**: show the skill, live or on video.
3. **Rehearsal**: the supervisee practices.
4. **Feedback**: praise correct parts, correct errors, then rehearse again until mastery.

Other performance management tools: task clarification (checklists, job aids), goal setting, prompts, performance feedback (immediate and specific works best; graphed feedback works too), reinforcement for correct performance, and reducing response effort (make the right way the easy way).

### Performance diagnostics (I.6)

Before choosing a fix, find out why the performance problem exists. The **Performance Diagnostic Checklist (PDC)** and its human-services version, the **PDC-HS**, look at four areas:

| Area | Question | If this is the problem, try |
| --- | --- | --- |
| Training | Does the staff person know how to do it? | BST |
| Task clarification and prompting | Do they know what is expected and when? | Checklists, reminders, clear job descriptions |
| Resources, materials, processes | Do they have what they need, and is it easy enough? | Provide materials, reduce effort, fix the process |
| Performance consequences | Is correct performance reinforced and incorrect performance addressed? | Feedback, reinforcement, change competing contingencies |

Training is the answer only for a skill deficit. If staff can do it but don't, it is a performance deficit, so look at the environment and consequences.

### Evaluating supervision (I.7)

Measure whether your supervision works: supervisee skill data, procedural integrity scores, client outcomes, and supervisee feedback. If these are not improving, change your supervision approach.

**Self-check:** An RBT runs a protocol correctly during role-play but rarely does it in sessions. What is the first step? Answer: performance diagnostics; since the skill is there, look at prompts, resources, and consequences rather than retraining.
` },

On exam day, read each scenario the way a behavior analyst would: identify the behavior, its function, and what the question actually asks.

### How to attack a question

1. **Read the last sentence first.** Know whether it asks for a name, the best next step, or what the data show.
2. **Translate the scenario into ABC terms.** What came before, what was the behavior, what happened after, and did future behavior go up or down?

5. **Pick the function-based, data-driven, ethical, least restrictive answer** when two seem right.
6. **Do not overthink.** Answer what is in the scenario, not what might be true in a real case.

### Exam traps

- **Technological vs conceptually systematic.** "The write-up lists every step so another clinic could run it" is technological. "The procedure is described as differential reinforcement" is conceptually systematic. Replicable description is one thing; naming the principle is the other.
- **Analytic vs effective.** "Behavior changed only when the intervention was in place" is analytic (control was shown). "The change was big enough that the teacher noticed a real difference" is effective. A reliable but tiny change is analytic without being effective.
- **Applied vs behavioral.** "Chosen because it matters in the client's life" is applied. "Measured what the client did rather than what parents reported" is behavioral. Watch for stems that use the word "measure" when the point is social importance, and the reverse.
- **Prediction dressed up as control.** "Self-injury reliably occurs after poor sleep" sounds strong, but nothing was manipulated. Correlation is prediction. Control needs a variable that was changed.
- **Radical vs methodological behaviorism.** An option saying behavior analysts "ignore thoughts and feelings" or "cannot study private events" describes methodological behaviorism. Radical behaviorism includes private events as behavior.
- **Parsimony vs philosophic doubt.** Choosing the simplest explanation first is parsimony. Questioning your own findings, even good ones, is philosophic doubt.

### How to eliminate answers

1. Cross out any option that explains behavior with an inner state, trait, or diagnosis ("because he is anxious," "because of ADHD"). Those are explanatory fictions.
2. Find the key verb in the stem and match it: *described clearly* → technological, *linked to principles* → conceptually systematic, *showed control* → analytic, *lasted or spread* → generality, *mattered* → applied or effective.
3. For goals-of-science questions, ask what the person actually did: watched (description), noticed co-occurrence (prediction), or changed something (control).

B: `
### Exam traps

- **Reading "negative" as "bad."** A parent stops nagging once the teen cleans her room, and room-cleaning increases. That is negative reinforcement of cleaning, not punishment. Negative only means a stimulus was removed.
- **Labeling by intent instead of effect.** "The teacher scolded him to stop calling out, but calling out increased." The scolding functioned as positive reinforcement. Always classify by what happened to future behavior, never by what someone hoped would happen.
- **Whose behavior is the question about?** A child tantrums, the mother hands over candy, and the tantrum stops. The child's tantrum is positively reinforced; the mother's candy-giving is negatively reinforced. Reread which person's behavior the stem names.
- **MO vs SD.** "A sign says free coffee" signals availability, so it is an SD. "She slept 4 hours and coffee is suddenly worth a lot" changes value, so it is an MO. If the reinforcer would be available either way, it is an MO.
- **Ignoring is not automatically extinction.** Ignoring escape-maintained screaming while still letting the child leave the task is not extinction. Extinction has to withhold the actual maintaining reinforcer.
- **Mand vs tact with the item present.** A child sees a cookie and says "cookie." If she wants it and gets it, it is a mand; if she gets praise for naming it, it is a tact. Decide from the MO and the consequence, not from the word.
- **Echoic vs intraverbal.** Hearing "What's your name?" and saying "What's your name?" is echoic (same words). Saying "Maya" is intraverbal.
- **Burst vs spontaneous recovery.** A burst happens right when extinction starts. Spontaneous recovery is a brief return later, after the behavior had already dropped.
- **Compound schedules.** If a distinct signal accompanies each component, it is multiple (alternating) or chained (sequence). No signal means mixed or tandem. Reinforcement only at the end means chained or tandem.

### How to eliminate answers

1. Before reading the options, answer two questions yourself: was a stimulus added or removed, and did future behavior go up or down? Then cross out every option that does not match both.
2. Cross out any option that names a reinforcer or punisher when the stem gives no evidence that future behavior changed.
3. For verbal operants, write the antecedent and consequence on your scratch paper, then eliminate options whose antecedent does not fit (only the mand starts with an MO; only echoic and textual have point-to-point correspondence).
4. For MO questions, eliminate SD options whenever the stem says the item was available regardless.

C: `
### Exam traps

- **Bias directions flipped.** Whole interval underestimates; partial interval overestimates. A distractor will reverse them, often attached to a correct-sounding rationale.
- **Count when sessions vary.** If observation lengths differ, count is the wrong answer even though it looks simplest. Use rate.
- **Percentage hides opportunities.** 4 of 5 and 40 of 50 are both 80%. A stem that stresses changing numbers of opportunities is pointing you away from percentage.
- **Reliable is not accurate.** A system that always records 2 extra hits is reliable but inaccurate. Validity is a third, separate question: is it the right behavior and dimension at all?
- **IOA arithmetic.** Divide smaller by larger. An answer over 100% comes from dividing the wrong way. Know which formula is asked: total count, mean count-per-interval, exact count-per-interval, and interval-by-interval give different numbers from the same data.
- **Latency vs duration vs IRT.** Instruction to start of response is latency. Start to end of one response is duration. End of one response to start of the next is IRT.
- **Cumulative records.** The line can never go down. A flat segment means no responding during that time, not a decrease in a total.
- **Interval length.** Shorter intervals give more accurate estimates, not less.

### How to eliminate answers

1. Find the dimension the stem cares about: "how long" (duration), "how quickly does he start" (latency), "how often" (rate), "how hard" (magnitude), "time between" (IRT). Cross out measures of other dimensions.
2. In any IOA question, eliminate answers above 100% immediately, then check which formula the stem names.
3. Cross out measurement systems the people in the scenario cannot actually carry out (a teacher with 25 students cannot do continuous duration on one child).
4. For "behavior to decrease," partial interval is usually the conservative pick; for "behavior to increase," whole interval.
