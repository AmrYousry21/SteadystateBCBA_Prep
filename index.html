  const DOMAINS = {
    A: 'Behaviorism & Philosophical Foundations',
    B: 'Concepts & Principles',
    C: 'Measurement, Data Display & Interpretation',
    D: 'Experimental Design',
    E: 'Ethical & Professional Issues',
    F: 'Behavior Assessment',
    G: 'Behavior-Change Procedures',
    H: 'Selecting & Implementing Interventions',
    I: 'Personnel Supervision & Management'
  };
  const DK = Object.keys(DOMAINS);
  const PLAN = window.PLAN || [];
  const GUIDE = window.GUIDE || [];
  const CARDS = window.CARDS || [];

  // ---------- storage ----------
  const KEY = 'steadystate-bcba-v1';
  function defaults() {
    return { examDate: '2026-12-01', done: {}, ans: {}, log: {}, mocks: {}, read: {}, cards: {}, sess: {}, opts: { timer: 240, poolMocks: true } };
  }
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const d = defaults(); const s = JSON.parse(raw);
        const out = Object.assign(d, s); out.opts = Object.assign(defaults().opts, s.opts || {});
        return out;
      }
    } catch (e) { /* storage unavailable */ }
    return defaults();
  }
  let S = load();
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* ignore */ } }

  // ---------- dates ----------
  const pad = (n) => String(n).padStart(2, '0');
  const ymd = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const today = () => ymd(new Date());
  const parse = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
  const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
  const fmt = (s, o) => parse(s).toLocaleDateString(undefined, o || { weekday: 'short', month: 'short', day: 'numeric' });
  const planDate = (i) => addDays(S.examDate, i - (PLAN.length - 1));
  const todayIndex = () => diffDays(planDate(0), today());

  // ---------- questions ----------
  function build(list, prefix) {
    return (list || []).map((q, i) => ({ id: prefix + (i + 1), n: i + 1, d: q[0], stem: q[1], opts: q[2], exp: q[3], tag: q[4] || null, src: prefix.charAt(0) }));
  }
  const PQ = build(window.PRACTICE, 'p');
  const MOCK = { 1: build(window.MOCK1, 'm1-'), 2: build(window.MOCK2, 'm2-') };
  const BQ = build(window.BANK, 'b');
  const QBY = {};
  [].concat(PQ, BQ, MOCK[1], MOCK[2]).forEach((q) => { QBY[q.id] = q; });

  function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function rng(seed) { return function () { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function shuffle(a, r) { r = r || Math.random; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  // The correct option is stored first; display order is a stable shuffle per question.
  function order(q) { if (!q._o) q._o = shuffle(q.opts.map((_, i) => i), rng(hash(q.id))); return q._o; }
  const letterOf = (q, oi) => LET[order(q).indexOf(oi)];

  function record(q, correct, silentLog) {
    const a = S.ans[q.id] || { c: 0, w: 0 };
    if (correct) a.c++; else a.w++;
    a.ok = correct; a.last = Date.now();
    S.ans[q.id] = a;
    if (!silentLog) { const k = today(); const l = S.log[k] || { n: 0, c: 0 }; l.n++; if (correct) l.c++; S.log[k] = l; }
  }
  function pool() {
    let p = PQ.concat(BQ);
    if (S.opts.poolMocks) [1, 2].forEach((m) => { if (S.mocks[m] && S.mocks[m].sub) p = p.concat(MOCK[m]); });
    return p;
  }
  function missedIds() { return Object.keys(S.ans).filter((id) => S.ans[id].ok === false && QBY[id]); }
  function domainStats() {
    const st = {}; DK.forEach((d) => { st[d] = { n: 0, ok: 0 }; });
    Object.keys(S.ans).forEach((id) => { const q = QBY[id]; if (!q) return; st[q.d].n++; if (S.ans[id].ok) st[q.d].ok++; });
    return st;
  }
  function weakDomains() {
    const st = domainStats();
    const fallback = ['G', 'B', 'F', 'E', 'C', 'H', 'I', 'D', 'A'];
    return DK.slice().sort((a, b) => {
      const ra = st[a].n >= 4 ? st[a].ok / st[a].n : 2 + fallback.indexOf(a) / 100;
      const rb = st[b].n >= 4 ? st[b].ok / st[b].n : 2 + fallback.indexOf(b) / 100;
      return ra - rb;
    });
  }

  // ---------- plan helpers ----------
  const tkey = (i, j) => i + '-' + j;
  function autoDone(a) {
    if (!a || a.manual) return false;
    if (a.k === 'guide') return (a.ids || []).every((id) => S.read[id]);
    if (a.k === 'mock') return !!(S.mocks[a.id] && S.mocks[a.id].sub);
    return false;
  }
  function isDone(i, j) {
    const k = tkey(i, j); if (k in S.done) return S.done[k];
    return autoDone(PLAN[i].tasks[j].a);
  }
  function planProgress() {
    let n = 0, d = 0;
    PLAN.forEach((day, i) => day.tasks.forEach((t, j) => { n++; if (isDone(i, j)) d++; }));
    return { n, d };
  }

  // ---------- markdown (small subset) ----------
  function inline(s) {
    return esc(s)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[\s(])\*(?!\s)(.+?)\*(?=[\s).,;:]|$)/g, '$1<em>$2</em>')
      .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  }
  function table(rows) {
    const cells = (r) => r.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map((c) => c.trim());
    const head = cells(rows[0]); const body = rows.slice(2).map(cells);
    return '<div class="tbl"><table><thead><tr>' + head.map((h) => '<th>' + inline(h) + '</th>').join('') + '</tr></thead><tbody>' +
      body.map((r) => '<tr>' + r.map((c) => '<td>' + inline(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
  }
  function md(src) {
    const L = src.trim().split('\n'); const out = []; let i = 0;
    const isBlock = (l) => /^(#{2,4}\s|\||\s*[-*]\s|\d+\.\s)/.test(l);
    while (i < L.length) {
      const l = L[i]; let m;
      if (!l.trim()) { i++; continue; }
      if ((m = l.match(/^(#{2,4})\s+(.*)/))) { const lv = m[1].length; out.push('<h' + lv + '>' + inline(m[2]) + '</h' + lv + '>'); i++; continue; }
      if (l.startsWith('|')) { const rows = []; while (i < L.length && L[i].startsWith('|')) rows.push(L[i++]); out.push(table(rows)); continue; }
      if (/^\s*[-*]\s/.test(l)) { const it = []; while (i < L.length && /^\s*[-*]\s/.test(L[i])) it.push(L[i++].replace(/^\s*[-*]\s/, '')); out.push('<ul>' + it.map((x) => '<li>' + inline(x) + '</li>').join('') + '</ul>'); continue; }
      if (/^\d+\.\s/.test(l)) { const it = []; while (i < L.length && /^\d+\.\s/.test(L[i])) it.push(L[i++].replace(/^\d+\.\s/, '')); out.push('<ol>' + it.map((x) => '<li>' + inline(x) + '</li>').join('') + '</ol>'); continue; }
      const p = []; while (i < L.length && L[i].trim() && !isBlock(L[i])) p.push(L[i++]); out.push('<p>' + inline(p.join(' ')) + '</p>');
    }
    return out.join('\n');
  }

  // ---------- view plumbing ----------
  const view = $('#view');
  function setView(html, keepScroll) { view.innerHTML = html; if (!keepScroll) window.scrollTo(0, 0); }
  function toast(msg) {
    const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
    document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
  }
  function measureHeader() { const h = $('.top'); if (h) document.documentElement.style.setProperty('--hh', h.offsetHeight + 'px'); }
  window.addEventListener('resize', measureHeader);

  const ROUTES = { today: renderToday, plan: renderPlan, guide: renderGuide, practice: renderPractice, bank: renderBank, exams: renderExams, cards: renderCards, options: renderOptions };
  let current = 'today';
  function route() {
    const h = (location.hash || '#today').slice(1);
    current = ROUTES[h] ? h : 'today';
    stopTimer();
    Object.keys(SS).forEach((k) => { if (SS[k] && SS[k].finished) SS[k] = null; });
    sess = (current === 'practice' || current === 'bank') ? (SS[current] || null) : null;
    document.querySelectorAll('#tabs a').forEach((a) => a.classList.toggle('on', a.getAttribute('href') === '#' + current));
    ROUTES[current]();
    updateCount(); measureHeader();
  }
  function go(h) { if (location.hash === '#' + h) route(); else location.hash = h; }
  function rerender(keep) { ROUTES[current](keep); updateCount(); }
  window.addEventListener('hashchange', route);

  function updateCount() {
    const d = diffDays(today(), S.examDate);
    const el = $('#count');
    if (d > 0) el.innerHTML = '<b>' + d + '</b> day' + (d === 1 ? '' : 's') + ' to exam<br>' + esc(fmt(S.examDate, { month: 'short', day: 'numeric', year: 'numeric' }));
    else if (d === 0) el.innerHTML = '<b>Exam day</b><br>You are ready.';
    else el.innerHTML = 'Exam date passed<br>Set a new one in Options';
  }

  // ---------- TODAY ----------
  function actLabel(a, i, j) {
    if (!a) return '';
    const k = tkey(i, j);
    if (['bank', 'practice'].some((h) => SS[h] && !SS[h].finished && SS[h].taskKey === k)) return 'Resume';
    if (a.k === 'guide') return 'Read';
    if (a.k === 'bank' || a.k === 'practice' || a.k === 'weak' || a.k === 'missed' || a.k === 'mockmissed') return 'Start';
    if (a.k === 'mock') { const m = S.mocks[a.id]; return m && m.sub ? 'Results' : m && m.start ? 'Resume' : 'Start'; }
    if (a.k === 'mockreview') return 'Open';
    if (a.k === 'cards') return 'Open';
    if (a.k === 'link') return 'Open';
    return 'Open';
  }
  function taskText(t) {
    let s = t.t;
    if (t.a && (t.a.k === 'weak')) { const d = weakDomains()[(t.a.rank || 1) - 1]; s = s.replace('{weak}', 'Domain ' + d + ' (' + DOMAINS[d] + ')'); }
    return s;
  }
  function taskHtml(i, j) {
    const t = PLAN[i].tasks[j]; const done = isDone(i, j); const k = tkey(i, j);
    const lbl = actLabel(t.a, i, j);
    let btn = '';
    if (t.a && t.a.k === 'link') btn = '<a class="btn sm ghost" href="' + esc(t.a.url) + '" target="_blank" rel="noopener">Open</a>';
    else if (lbl) btn = '<button class="btn sm ' + (done ? 'quiet' : '') + '" data-act="launch" data-k="' + k + '">' + lbl + '</button>';
    return '<li class="task' + (done ? ' done' : '') + '"><button class="tick" data-act="tick" data-k="' + k + '" aria-pressed="' + done + '" aria-label="Mark done">✓</button>' +
      '<span class="ttext">' + esc(taskText(t)) + (t.note ? '<span class="note">' + esc(t.note) + '</span>' : '') + '</span>' + btn + '</li>';
  }
  function dayCard(i) {
    const day = PLAN[i]; const n = day.tasks.length; const d = day.tasks.filter((_, j) => isDone(i, j)).length;
    return '<section class="card stack"><div class="dayhead"><div class="stack" style="gap:6px"><span class="eyebrow">Day ' + (i + 1) + ' of ' + PLAN.length + ' · ' + esc(fmt(planDate(i))) + '</span><h1>' + esc(day.title) + '</h1></div><span class="pill ' + (d === n ? 'ok' : 'acc') + '">' + d + ' / ' + n + ' done</span></div>' +
      (day.focus ? '<p class="lead">' + esc(day.focus) + '</p>' : '') +
      '<div class="progressbar" aria-hidden="true"><span style="width:' + Math.round(100 * d / n) + '%"></span></div>' +
      '<ul class="tasks">' + day.tasks.map((_, j) => taskHtml(i, j)).join('') + '</ul></section>';
  }
  function totals() { let n = 0, c = 0; Object.values(S.log).forEach((l) => { n += l.n; c += l.c; }); return { n, c }; }

  function cumulativeChart() {
    const N = PLAN.length; const ti = Math.min(todayIndex(), N - 1);
    const start = planDate(0); const pts = []; let cum = 0;
    Object.keys(S.log).forEach((k) => { if (k < start) cum += S.log[k].n; });
    for (let i = 0; i <= Math.max(ti, -1) && i < N; i++) { const l = S.log[planDate(i)]; cum += l ? l.n : 0; pts.push(cum); }
    const W = 640, H = 210, L = 44, R = 16, T = 16, B = 30;
    const raw = Math.max(100, cum);
    const step = raw <= 200 ? 50 : raw <= 500 ? 100 : raw <= 1000 ? 250 : 500;
    const ymax = Math.ceil(raw / step) * step;
    const x = (i) => L + (W - L - R) * (i / (N - 1));
    const y = (v) => T + (H - T - B) * (1 - v / ymax);
    let g = '';
    for (let v = 0; v <= ymax; v += step) g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(--rule)" stroke-width="1"/><text x="' + (L - 8) + '" y="' + (y(v) + 3.5) + '" text-anchor="end">' + v + '</text>';
    for (let i = 0; i < N; i += 7) g += '<text x="' + x(i) + '" y="' + (H - 10) + '" text-anchor="middle">' + esc(fmt(planDate(i), { month: 'short', day: 'numeric' })) + '</text>';
    g += '<line x1="' + x(N - 1) + '" x2="' + x(N - 1) + '" y1="' + T + '" y2="' + (H - B) + '" stroke="var(--ink)" stroke-dasharray="4 4" stroke-width="1.2"/><text x="' + (x(N - 1) - 4) + '" y="' + (T + 10) + '" text-anchor="end">Exam</text>';
    [1, 2].forEach((m) => { const s = S.mocks[m]; if (s && s.sub && s.day) { const i = diffDays(start, s.day); if (i >= 0 && i < N) g += '<line x1="' + x(i) + '" x2="' + x(i) + '" y1="' + T + '" y2="' + (H - B) + '" stroke="var(--flag)" stroke-width="1" stroke-dasharray="2 3"/><text x="' + (x(i) + 4) + '" y="' + (T + 22 + m * 12) + '" style="fill:var(--flag)">Mock ' + m + ' ' + s.pct + '%</text>'; } });
    let line = '';
    if (pts.length) {
      line = '<path d="' + pts.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ') + '" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';
      const li = pts.length - 1; line += '<circle cx="' + x(li) + '" cy="' + y(pts[li]) + '" r="4.5" fill="var(--accent)"/><text x="' + (x(li) + 8) + '" y="' + (y(pts[li]) - 8) + '" style="fill:var(--ink)">' + pts[li] + '</text>';
    }
    return '<div class="chartbox"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Cumulative record of questions answered across the plan">' + g + line + '</svg></div>';
  }
  function domainBars() {
    const st = domainStats();
    return '<div class="dbars">' + DK.map((d) => {
      const s = st[d]; const p = s.n ? Math.round(100 * s.ok / s.n) : 0;
      const cls = !s.n ? '' : p < 65 ? 'low' : p < 80 ? 'mid' : '';
      return '<div class="dbar" title="' + esc(DOMAINS[d]) + '"><span class="k">' + d + '</span><div class="track"><div class="fill ' + cls + '" style="width:' + p + '%"></div></div><span class="val">' + (s.n ? p + '% · ' + s.n : '—') + '</span></div>';
    }).join('') + '</div>';
  }

  function renderToday() {
    const ti = todayIndex(); const N = PLAN.length; const tot = totals(); const pp = planProgress(); const miss = missedIds().length;
    let top;
    if (ti < 0) top = '<section class="card stack"><span class="eyebrow">Plan starts ' + esc(fmt(planDate(0))) + '</span><h1>Your plan begins in ' + (-ti) + ' day' + (ti === -1 ? '' : 's') + '</h1><p class="lead">You can get ahead with Day 1 below or practice any domain now.</p></section>' + dayCard(0);
    else if (ti >= N) top = '<section class="card stack"><h1>Exam day has passed</h1><p class="lead">If you are retesting, set your new exam date in Options and the plan will re-date itself.</p><div class="row"><a class="btn" href="#options">Set a new date</a></div></section>';
    else top = dayCard(ti);
    const resume = ['bank', 'practice'].map((h) => SS[h]).filter((s0) => s0 && !s0.finished).map((s0) => '<section class="card row between"><div class="stack" style="gap:4px"><span class="eyebrow">Unfinished set</span><h3>' + esc(s0.title) + '</h3><span class="small muted">' + Object.keys(s0.picks).length + ' of ' + s0.ids.length + ' answered</span></div><a class="btn" href="#' + s0.home + '">Resume</a></section>').join('');
    const next = ti >= 0 && ti < N - 1 ? '<p class="small muted">Tomorrow: <strong>' + esc(PLAN[ti + 1].title) + '</strong>. <a href="#plan">See the full plan</a></p>' : '';
    const late = [];
    for (let i = 0; i < Math.min(ti, N); i++) PLAN[i].tasks.forEach((t, j) => { if (!isDone(i, j)) late.push([i, j]); });
    const lateHtml = late.length ? '<section class="card stack"><div class="sectionhead"><h3>Catch up</h3><span class="pill flag">' + late.length + ' open from earlier days</span></div><ul class="tasks">' + late.slice(0, 6).map(([i, j]) => taskHtml(i, j)).join('') + '</ul>' + (late.length > 6 ? '<a class="small" href="#plan">See all open tasks</a>' : '') + '</section>' : '';
    setView(top + resume + next + lateHtml +
      '<section class="tiles">' +
      '<div class="tile"><span class="eyebrow">Answered</span><div class="v">' + tot.n + '</div><div class="s">questions in the app</div></div>' +
      '<div class="tile"><span class="eyebrow">Accuracy</span><div class="v">' + (tot.n ? Math.round(100 * tot.c / tot.n) + '%' : '—') + '</div><div class="s">all attempts</div></div>' +
      '<div class="tile"><span class="eyebrow">To review</span><div class="v">' + miss + '</div><div class="s">' + (miss ? '<a href="#practice" data-act="startmissed">review missed</a>' : 'missed questions') + '</div></div>' +
      '<div class="tile"><span class="eyebrow">Plan</span><div class="v">' + Math.round(100 * pp.d / (pp.n || 1)) + '%</div><div class="s">' + pp.d + ' of ' + pp.n + ' tasks</div></div>' +
      '</section>' +
      '<section class="twocol"><div class="card stack"><div class="sectionhead"><h3>Cumulative record</h3><span class="small muted">questions answered</span></div>' + cumulativeChart() + '<p class="small muted">Like a cumulative record, the line only rises. A flat stretch means no responding that day.</p></div>' +
      '<div class="card stack"><div class="sectionhead"><h3>Accuracy by domain</h3><span class="small muted">latest attempt</span></div>' + domainBars() + '<p class="small muted">Red under 65%, amber under 80%.</p></div></section>');
  }

  // ---------- PLAN ----------
  function renderPlan() {
    const ti = todayIndex(); const pp = planProgress();
    const weeks = [[0, 7, 'Week 1 · Foundations'], [7, 14, 'Week 2 · Applied domains and Mock 1'], [14, PLAN.length, 'Week 3 · Repair, Mock 2, exam']];
    let html = '<section class="stack"><div class="sectionhead"><h1>Daily plan</h1><span class="pill acc">' + pp.d + ' of ' + pp.n + ' tasks done</span></div><p class="lead">Dates count back from your exam on ' + esc(fmt(S.examDate, { weekday: 'long', month: 'long', day: 'numeric' })) + '. Tasks with a button open the right part of the app and check themselves off when you finish. Change the exam date in Options.</p></section>';
    weeks.forEach(([a, b, name]) => {
      html += '<section class="week"><h3>' + esc(name) + '</h3>';
      for (let i = a; i < b && i < PLAN.length; i++) {
        const day = PLAN[i]; const n = day.tasks.length; const d = day.tasks.filter((_, j) => isDone(i, j)).length;
        const cls = i === ti ? 'today' : i < ti ? 'past' : '';
        const status = d === n ? '<span class="pill ok">Done</span>' : i < ti ? '<span class="pill flag">' + (n - d) + ' open</span>' : i === ti ? '<span class="pill acc">Today</span>' : '<span class="pill">' + n + ' tasks</span>';
        html += '<details class="day ' + cls + '"' + (i === ti || (ti < 0 && i === 0) ? ' open' : '') + '><summary><span class="dd">Day ' + (i + 1) + '<br>' + esc(fmt(planDate(i))) + '</span><span class="dt">' + esc(day.title) + '</span>' + status + '</summary><ul class="tasks">' + day.tasks.map((_, j) => taskHtml(i, j)).join('') + '</ul></details>';
      }
      html += '</section>';
    });
    setView(html);
  }

  function launch(k) {
    const [i, j] = k.split('-').map(Number); const t = PLAN[i].tasks[j]; const a = t.a; if (!a) return;
    for (const h of ['bank', 'practice']) { const s0 = SS[h]; if (s0 && !s0.finished && s0.taskKey === k) { go(h); return; } }
    switch (a.k) {
      case 'bank': startPractice({ ds: a.d === 'ALL' ? DK : a.d.split(''), n: a.n || 50, src: 'smart', tag: a.tag, taskKey: k, title: t.t, home: 'bank' }); break;
      case 'guide': guideSel = a.ids[0]; go('guide'); break;
      case 'practice': startPractice({ ds: a.d === 'ALL' ? DK : a.d.split(''), n: a.n, src: a.src || 'smart', taskKey: k, title: t.t }); break;
      case 'weak': { const d = weakDomains()[(a.rank || 1) - 1]; if (a.read) { guideSel = d; go('guide'); } else startPractice({ ds: [d], n: a.n, src: 'smart', taskKey: k, title: a.bank ? 'Question bank: Domain ' + d + ' (' + DOMAINS[d] + ')' : 'Domain ' + d + ' repair', home: a.bank ? 'bank' : 'practice' }); break; }
      case 'missed': startPractice({ ds: DK, n: a.n || 30, src: 'missed', taskKey: k, title: 'Review missed questions' }); break;
      case 'mockmissed': { const m = S.mocks[a.id]; if (!m || !m.sub) { toast('Finish Mock ' + a.id + ' first.'); return; } const ids = MOCK[a.id].filter((q) => m.ans[q.id] !== 0).map((q) => q.id); startPractice({ ids: shuffle(ids), taskKey: k, title: 'Mock ' + a.id + ' missed questions' }); break; }
      case 'mock': mockId = a.id; mockPanel = null; go('exams'); break;
      case 'mockreview': mockId = a.id; mockPanel = null; if (!(S.mocks[a.id] && S.mocks[a.id].sub)) toast('Take Mock ' + a.id + ' first.'); go('exams'); break;
      case 'cards': cardDeck = a.deck || 'all'; go('cards'); break;
    }
  }

  // ---------- GUIDE ----------
  let guideSel = null;
  function renderGuide(keep) {
    if (!guideSel || !GUIDE.find((g) => g.id === guideSel)) guideSel = GUIDE[0] && GUIDE[0].id;
    const gi = GUIDE.findIndex((g) => g.id === guideSel); const g = GUIDE[gi];
    const nav = GUIDE.map((s) => '<button data-act="gsec" data-id="' + s.id + '" class="' + (s.id === guideSel ? 'on' : '') + '"><span class="k">' + (DOMAINS[s.id] ? s.id : '·') + '</span><span>' + esc(s.short || s.title) + '</span><span class="rd">' + (S.read[s.id] ? '✓' : '') + '</span></button>').join('');
    const sel = '<div class="gselect field"><label for="gsel">Section</label><select id="gsel" data-chg="gsel">' + GUIDE.map((s) => '<option value="' + s.id + '"' + (s.id === guideSel ? ' selected' : '') + '>' + esc((DOMAINS[s.id] ? s.id + '. ' : '') + (s.short || s.title)) + (S.read[s.id] ? ' ✓' : '') + '</option>').join('') + '</select></div>';
    const count = DOMAINS[g.id] ? pool().filter((q) => q.d === g.id).length : 0;
    const prev = GUIDE[gi - 1], next = GUIDE[gi + 1];
    setView('<div class="guide"><nav class="gnav" aria-label="Guide sections">' + nav + '</nav><div class="stack">' + sel +
      '<article class="prose">' + (DOMAINS[g.id] ? '<span class="eyebrow">Domain ' + g.id + (g.q ? ' · ' + g.q + ' exam questions' : '') + '</span>' : '<span class="eyebrow">Study guide</span>') +
      '<h2>' + esc(g.title) + '</h2>' + (g.traps ? '<div class="row"><button class="btn sm ghost" data-act="totraps">Jump to exam traps</button></div>' : '') + md(g.md) +
      '<div class="gfoot"><div class="row"><button class="btn ' + (S.read[g.id] ? 'quiet' : '') + '" data-act="markread" data-id="' + g.id + '">' + (S.read[g.id] ? '✓ Marked as read' : 'Mark as read') + '</button>' +
      (count ? '<button class="btn ghost" data-act="gpractice" data-id="' + g.id + '">Practice Domain ' + g.id + '</button>' : '') + '</div>' +
      '<div class="row">' + (prev ? '<button class="btn sm quiet" data-act="gsec" data-id="' + prev.id + '">← ' + esc(prev.short || prev.title) + '</button>' : '') + (next ? '<button class="btn sm quiet" data-act="gsec" data-id="' + next.id + '">' + esc(next.short || next.title) + ' →</button>' : '') + '</div></div>' +
      '</article></div></div>', keep);
  }

  // ---------- PRACTICE AND QUESTION BANK ----------
  // Two independent sets can be open at once: one on the Practice tab, one on the Question bank tab.
  // Both are saved, so a half-finished 50-question block survives a reload.
  let pset = { ds: DK.slice(), n: 20, src: 'smart' };
  let bset = { ds: DK.slice(), n: 50 };
  if (!S.sess || typeof S.sess !== 'object') S.sess = {};
  let SS = S.sess;
  let sess = null;
  const WEIGHT = { A: 8, B: 24, C: 21, D: 13, E: 22, F: 23, G: 25, H: 20, I: 19 };
  const TAGS = { B1: 'reinforcement, punishment, extinction', B2: 'schedules, stimulus control, MOs', B3: 'verbal behavior and advanced principles', G1: 'reinforcement procedures and prompting', G2: 'shaping, chaining, generalization, punishment' };
  function homeOf() { return current === 'bank' ? 'bank' : 'practice'; }

  // prefer: 'bank' favors bank questions (and the tag, if given); 'practice' favors the practice set.
  function pickQuestions(ds, n, src, tag, prefer) {
    const p = pool().filter((q) => ds.includes(q.d));
    if (src === 'missed') return shuffle(p.filter((q) => S.ans[q.id] && S.ans[q.id].ok === false)).slice(0, n).map((q) => q.id);
    if (src === 'random') return shuffle(p.slice()).slice(0, n).map((q) => q.id);
    const base = (q) => { const a = S.ans[q.id]; if (!a) return 0; if (a.ok === false) return 1; return 2; };
    const pref = (q) => prefer === 'bank' ? (tag && q.tag === tag ? 0 : q.src === 'b' ? 1 : 2) : (q.src === 'p' ? 0 : 1);
    const key = (q) => base(q) * 3 + pref(q);
    const by = {}; ds.forEach((d) => { by[d] = []; });
    shuffle(p.slice()).forEach((q) => by[q.d].push(q));
    ds.forEach((d) => by[d].sort((a, b) => key(a) - key(b) || (base(a) === 2 && base(b) === 2 ? (S.ans[a.id].last - S.ans[b.id].last) : 0)));
    const out = [];
    if (prefer === 'bank' && ds.length > 1) {
      const tot = ds.reduce((s, d) => s + WEIGHT[d], 0);
      ds.forEach((d) => { by[d].splice(0, Math.round(n * WEIGHT[d] / tot)).forEach((q) => out.push(q.id)); });
    }
    let added = true;
    while (out.length < n && added) { added = false; for (const d of ds) { if (out.length >= n) break; const q = by[d].shift(); if (q) { out.push(q.id); added = true; } } }
    return shuffle(out.slice(0, n));
  }
  function startPractice(o) {
    const home = o.home || 'practice';
    const ids = o.ids || pickQuestions(o.ds, o.n, o.src, o.tag, home === 'bank' ? 'bank' : 'practice');
    if (!ids.length) { toast(o.src === 'missed' ? 'No missed questions to review. Nice.' : 'No questions match that choice.'); go(home); return; }
    SS[home] = { ids, i: 0, picks: {}, taskKey: o.taskKey || null, title: o.title || (home === 'bank' ? 'Question bank' : 'Practice'), finished: false, home };
    save();
    go(home);
  }
  function clearSess() { SS[homeOf()] = null; sess = null; save(); }

  function renderPractice(keep) {
    if (sess) return sess.finished ? renderSummary() : renderRunner(keep);
    const p = pool(); const miss = missedIds().length;
    const dcount = (d) => p.filter((q) => q.d === d).length;
    const chips = '<div class="seg" role="group" aria-label="Domains"><button data-act="pdall" class="' + (pset.ds.length === DK.length ? 'on' : '') + '">All domains</button>' +
      DK.map((d) => '<button data-act="pd" data-d="' + d + '" class="' + (pset.ds.includes(d) && pset.ds.length !== DK.length ? 'on' : '') + '" title="' + esc(DOMAINS[d]) + '"><span class="k">' + d + '</span>' + dcount(d) + '</button>').join('') + '</div>';
    const ns = '<div class="seg" role="group" aria-label="Number of questions">' + [10, 20, 36, 50].map((n) => '<button data-act="pn" data-n="' + n + '" class="' + (pset.n === n ? 'on' : '') + '">' + n + '</button>').join('') + '</div>';
    const srcs = '<div class="seg" role="group" aria-label="Question source">' + [['smart', 'New first, then missed'], ['missed', 'Missed only'], ['random', 'Random']].map(([k, l]) => '<button data-act="psrc" data-s="' + k + '" class="' + (pset.src === k ? 'on' : '') + '">' + l + '</button>').join('') + '</div>';
    const mocksIn = [1, 2].filter((m) => S.mocks[m] && S.mocks[m].sub);
    setView('<section class="stack"><h1>Practice</h1><p class="lead">Short, focused sets. Every answer is checked right away. When you miss one, you see the correct answer and why, and the question goes into your review pile until you get it right.</p></section>' +
      '<section class="card stack"><div class="field"><label>Domains</label>' + chips + '</div>' +
      '<div class="field"><label>Questions</label>' + ns + '</div>' +
      '<div class="field"><label>Source</label>' + srcs + '</div>' +
      '<div class="row between"><span class="small muted">' + p.length + ' questions in your pool' + (mocksIn.length ? ', including finished Mock ' + mocksIn.join(' and ') : '. Questions from each mock join after you finish it') + '.</span><button class="btn" data-act="pstart">Start practice</button></div></section>' +
      '<section class="card row between"><div class="stack" style="gap:4px"><h3>Missed questions</h3><span class="small muted">' + (miss ? miss + ' questions you got wrong on your latest attempt.' : 'Nothing to review yet.') + '</span></div><button class="btn ghost" data-act="startmissed"' + (miss ? '' : ' disabled') + '>Review missed</button></section>' +
      '<section class="card row between"><div class="stack" style="gap:4px"><h3>Want volume?</h3><span class="small muted">The Question bank serves 50-question blocks weighted like the real exam.</span></div><a class="btn ghost" href="#bank">Open the Question bank</a></section>');
  }

  function bankStats() {
    const p = pool(); const st = {}; DK.forEach((d) => { st[d] = { n: 0, seen: 0, ok: 0, miss: 0 }; });
    p.forEach((q) => { const s = st[q.d]; s.n++; const a = S.ans[q.id]; if (a) { s.seen++; if (a.ok) s.ok++; else s.miss++; } });
    return st;
  }
  function renderBank(keep) {
    if (sess) return sess.finished ? renderSummary() : renderRunner(keep);
    const st = bankStats(); const tot = { n: 0, seen: 0, ok: 0, miss: 0 };
    DK.forEach((d) => { Object.keys(tot).forEach((k) => { tot[k] += st[d][k]; }); });

      return '<div class="cov"><span class="k">' + d + '</span><span class="nm">' + esc(DOMAINS[d]) + '</span><div class="track" title="' + s.ok + ' correct, ' + s.miss + ' missed, ' + (s.n - s.seen) + ' not seen"><span class="okf" style="width:' + okw.toFixed(1) + '%"></span><span class="missf" style="width:' + mw.toFixed(1) + '%"></span></div><span class="val">' + s.seen + ' / ' + s.n + '</span></div>';
    }).join('');
    const miss = missedIds().length;
    setView('<section class="stack"><h1>Question bank</h1><p class="lead">Work through ' + tot.n + ' questions in blocks. Each block serves questions you have not seen first, then the ones you missed, then the ones you saw longest ago. Every answer is checked right away, with the correct answer and an explanation when you miss. Your place is saved if you stop partway.</p></section>' +
      '<section class="tiles">' +

      '<div class="tile"><span class="eyebrow">Correct</span><div class="v">' + (tot.seen ? Math.round(100 * tot.ok / tot.seen) + '%' : '—') + '</div><div class="s">latest attempts</div></div>' +
      '<div class="tile"><span class="eyebrow">Missed</span><div class="v">' + tot.miss + '</div><div class="s">served next</div></div></section>' +
      '<section class="card stack"><h3>Start a block</h3><div class="field"><label>Domains</label>' + chips + '</div>' +
      '<div class="field"><label>Questions</label>' + ns + '</div>' +
      '<div class="row between"><span class="small muted">' + (all ? 'Mixed blocks follow the exam\'s domain weights, so G and B appear most and A least.' : 'Domains ' + bset.ds.join(', ') + ' only.') + '</span><button class="btn" data-act="bstart">Start ' + bset.n + ' questions</button></div></section>' +
      '<section class="card stack"><div class="sectionhead"><h3>Coverage by domain</h3><span class="small muted"><span class="dot ok"></span>correct <span class="dot bad"></span>missed, out of all questions</span></div><div class="covs">' + rows + '</div></section>' +
      '<section class="card row between"><div class="stack" style="gap:4px"><h3>Missed questions</h3><span class="small muted">' + (miss ? miss + ' questions to get right before they leave the pile.' : 'Nothing to review yet.') + '</span></div><button class="btn ghost" data-act="bmissed"' + (miss ? '' : ' disabled') + '>Review ' + Math.min(miss, 50) + ' missed</button></section>');
  }

  function optsHtml(q, picked, reveal, act) {
    return '<div class="opts">' + order(q).map((oi, pos) => {
      let cls = 'opt', tag = '';
      if (reveal) { if (oi === 0) { cls += ' ok'; tag = 'Correct'; } else if (oi === picked) { cls += ' bad'; tag = 'Your answer'; } else cls += ' dim'; }
      else if (oi === picked) cls += ' sel';
      return '<button class="' + cls + '" data-act="' + act + '" data-o="' + oi + '"' + (reveal ? ' disabled' : '') + '><span class="let">' + LET[pos] + '</span><span>' + esc(q.opts[oi]) + '</span><span class="tag">' + tag + '</span></button>';
    }).join('') + '</div>';
  }
  function feedback(q, picked) {
    const ok = picked === 0;
    return '<div class="fb ' + (ok ? 'ok' : 'bad') + '" role="status"><p class="fbh">' + (ok ? 'Correct.' : 'Incorrect. The correct answer is ' + letterOf(q, 0) + ': ' + esc(q.opts[0])) + '</p><p class="why"><span class="lbl">Why</span>' + esc(q.exp) + '</p></div>';
  }
  function renderRunner(keep) {
    const q = QBY[sess.ids[sess.i]]; const picked = sess.picks[q.id]; const answered = picked !== undefined;
    const right = Object.keys(sess.picks).filter((id) => sess.picks[id] === 0).length; const done = Object.keys(sess.picks).length;
    const last = sess.i === sess.ids.length - 1;
    const topic = q.tag && TAGS[q.tag] ? ' · ' + TAGS[q.tag] : '';
    setView('<section class="row between"><div class="stack" style="gap:4px"><span class="eyebrow">' + esc(sess.title) + '</span><h2>Question ' + (sess.i + 1) + ' of ' + sess.ids.length + '</h2></div><div class="row"><span class="pill ok">' + right + ' / ' + done + ' correct</span><button class="btn sm quiet" data-act="pend">' + (done ? 'Finish early' : 'Cancel') + '</button></div></section>' +
      '<div class="progressbar"><span style="width:' + Math.round(100 * done / sess.ids.length) + '%"></span></div>' +
      '<article class="qcard"><div class="qmeta"><span class="pill acc">' + q.d + ' · ' + esc(DOMAINS[q.d]) + esc(topic) + '</span>' + (S.ans[q.id] && !answered ? '<span class="pill">' + (S.ans[q.id].ok === false ? 'Missed before' : 'Seen before') + '</span>' : '') + '</div>' +
      '<p class="stem">' + esc(q.stem) + '</p>' + optsHtml(q, picked, answered, 'ppick') + (answered ? feedback(q, picked) : '') +
      '<div class="qnav"><span class="kbd">Keys: 1–4 or A–D to answer, Enter for next</span>' + (answered ? '<button class="btn" data-act="pnext" id="nextbtn">' + (last ? 'See results' : 'Next question') + '</button>' : '') + '</div></article>', keep);
    if (answered) { const b = $('#nextbtn'); if (b) b.focus({ preventScroll: true }); }
  }
  function renderSummary() {
    const ids = sess.ids.filter((id) => sess.picks[id] !== undefined); const wrong = ids.filter((id) => sess.picks[id] !== 0);
    const pct = ids.length ? Math.round(100 * (ids.length - wrong.length) / ids.length) : 0;
    const isBank = sess.home === 'bank';
    const per = {}; ids.forEach((id) => { const d = QBY[id].d; per[d] = per[d] || { n: 0, c: 0 }; per[d].n++; if (sess.picks[id] === 0) per[d].c++; });
    const perHtml = Object.keys(per).length > 1 ? '<div class="row small muted" style="gap:6px 14px">' + DK.filter((d) => per[d]).map((d) => '<span><strong class="mono">' + d + '</strong> ' + per[d].c + '/' + per[d].n + '</span>').join('') + '</div>' : '';
    const taskNote = sess.taskKey && !S.done[sess.taskKey] ? '<p class="small muted">The plan task stays open until you answer at least ' + Math.ceil(sess.ids.length * 0.8) + ' questions in a set. You can also tick it off yourself.</p>' : '';
    setView('<section class="card stack"><span class="eyebrow">' + esc(sess.title) + ' · finished</span><div class="row" style="gap:18px;align-items:baseline"><span class="score">' + pct + '%</span><span class="muted">' + (ids.length - wrong.length) + ' of ' + ids.length + ' correct</span></div>' + perHtml + taskNote +
      '<div class="row"><button class="btn" data-act="pnew">' + (isBank ? 'New block' : 'New practice set') + '</button>' + (wrong.length ? '<button class="btn ghost" data-act="pretry">Retry the ' + wrong.length + ' I missed</button>' : '') + '<a class="btn quiet" href="#today" data-act="pclose">Back to today</a></div></section>' +
      (wrong.length ? '<section class="rlist"><h3 style="margin-bottom:14px">What you missed</h3>' + wrong.map((id) => reviewItem(QBY[id], sess.picks[id])).join('') + '</section>' : '<p class="lead">Clean sweep. Mark the idea down as solid and move on.</p>'));
  }
  function reviewItem(q, picked, num) {
    const ok = picked === 0;
    return '<div class="review-item"><div class="qmeta"><span class="pill acc">' + (num ? 'Q' + num + ' · ' : '') + q.d + '</span>' + (picked === undefined ? '<span class="pill flag">Unanswered</span>' : ok ? '<span class="pill ok">Correct</span>' : '<span class="pill bad">Incorrect</span>') + '</div><p class="stem">' + esc(q.stem) + '</p><div class="stack" style="gap:5px">' +
      order(q).map((oi, pos) => { const c = oi === 0 ? 'ok' : oi === picked ? 'bad' : ''; const tag = oi === 0 ? 'Correct answer' : oi === picked ? 'Your answer' : ''; return '<div class="ropt ' + c + '"><span class="let">' + LET[pos] + '</span><span>' + esc(q.opts[oi]) + '</span><span class="tag">' + tag + '</span></div>'; }).join('') +
      '</div><div class="fb ' + (ok ? 'ok' : 'bad') + '"><p class="why"><span class="lbl">Why</span>' + esc(q.exp) + '</p></div></div>';
  }
  function practicePick(oi) {
    const q = QBY[sess.ids[sess.i]]; if (sess.picks[q.id] !== undefined) return;
    sess.picks[q.id] = oi; record(q, oi === 0); save(); renderRunner(true);
  }
  function practiceNext() {

  }

  // ---------- MOCK EXAMS ----------
  let mockId = null; let mockPanel = null; let timerH = null; let reviewFilter = 'wrong';

    }).join('');
    setView('<section class="stack"><h1>Mock exams</h1><p class="lead">Two full-length exams of 185 questions, the same length as the real BCBA exam (175 scored plus 10 pilot). Take each one timed, in one sitting, somewhere quiet. Every question here counts toward your score.</p></section><div class="mocks">' + cards + '</div>' +
      '<section class="card stack"><h3>How scoring and review work</h3><ul class="tasks"><li class="task" style="grid-template-columns:1fr"><span>In <strong>exam mode</strong>, answers stay hidden until you submit, like test day. Then every missed question shows the correct answer and an explanation.</span></li><li class="task" style="grid-template-columns:1fr"><span>In <strong>study mode</strong>, each answer is checked right away, with the explanation shown when you miss.</span></li><li class="task" style="grid-template-columns:1fr"><span>The BACB reports pass or fail from a scaled score, so a raw percentage here is a readiness signal, not a predicted result. Many candidates aim for 80% or higher on mocks.</span></li></ul></section>');
  }
  function renderExamIntro() {
    const id = mockId; const qs = MOCK[id];
    const counts = DK.map((d) => '<tr><td>' + d + '</td><td>' + esc(DOMAINS[d]) + '</td><td class="num">' + qs.filter((q) => q.d === d).length + '</td></tr>').join('');
    setView('<section class="card stack"><span class="eyebrow">Mock exam ' + id + '</span><h1>Before you start</h1><p class="lead">' + qs.length + ' questions with a ' + S.opts.timer + '-minute timer. The timer runs only while this screen is open, so stay on it for a realistic run. You can flag questions and come back. Your answers save as you go.</p>' +
      '<div class="tbl"><table><thead><tr><th>Domain</th><th>Topic</th><th>Questions</th></tr></thead><tbody>' + counts + '</tbody></table></div>' +
      '<div class="field"><label>Mode</label><div class="seg"><button data-act="mmode" data-m="exam" class="' + (mockPanel !== 'study' ? 'on' : '') + '">Exam mode: feedback after submitting</button><button data-act="mmode" data-m="study" class="' + (mockPanel === 'study' ? 'on' : '') + '">Study mode: feedback on every question</button></div></div>' +
      '<div class="row"><button class="btn" data-act="mbegin">Start the clock</button><button class="btn quiet" data-act="mback">Back to mock exams</button></div></section>');

  function renderExam(keep) {
    const id = mockId; const m = mstate(id); const qs = MOCK[id]; const i = m.cur || 0; const q = qs[i];
    const picked = m.ans[q.id]; const study = m.mode === 'study'; const reveal = study && picked !== undefined;
    const answered = Object.keys(m.ans).length; const flagged = !!m.flag[q.id];
    const remain = S.opts.timer * 60 - m.elapsed;
    const map = qs.map((qq, k) => { let c = ''; if (m.ans[qq.id] !== undefined) c = study ? (m.ans[qq.id] === 0 ? 'r-ok' : 'r-bad') : 'ans'; if (m.flag[qq.id]) c += ' fl'; if (k === i) c += ' cur'; return '<button class="' + c + '" data-act="mgo" data-i="' + k + '" aria-label="Question ' + (k + 1) + '">' + (k + 1) + '</button>'; }).join('');
    const confirm = mockPanel === 'submit' ? '<div class="confirm"><p><strong>Submit Mock ' + id + '?</strong> You answered ' + answered + ' of ' + qs.length + (answered < qs.length ? '. Unanswered questions count as wrong.' : '.') + (Object.keys(m.flag).filter((k) => m.flag[k]).length ? ' You still have flagged questions.' : '') + '</p><div class="row"><button class="btn" data-act="msubmit">Yes, submit and score</button><button class="btn quiet" data-act="mcancel">Keep working</button></div></div>' : '';
    setView('<div class="exambar"><div class="row"><strong>Mock ' + id + '</strong><span class="pill">' + (study ? 'Study mode' : 'Exam mode') + '</span><span class="small muted num">' + answered + ' / ' + qs.length + ' answered</span></div><div class="row"><span class="timer' + (remain < 900 ? ' low' : '') + '" id="timer" aria-label="Time remaining">' + fmtTime(remain) + '</span><button class="btn sm quiet" data-act="mpause">Save and exit</button><button class="btn sm" data-act="mask">Submit</button></div></div>' + confirm +
      '<article class="qcard"><div class="qmeta"><span class="pill acc">Question ' + (i + 1) + ' of ' + qs.length + '</span><button class="btn sm ' + (flagged ? '' : 'quiet') + '" data-act="mflag" style="' + (flagged ? 'background:var(--flag);border-color:var(--flag);color:var(--surface)' : '') + '">' + (flagged ? '⚑ Flagged' : '⚐ Flag for review') + '</button></div>' +
      '<p class="stem">' + esc(q.stem) + '</p>' + optsHtml(q, picked, reveal, 'mpick') + (reveal ? feedback(q, picked) : '') +
      '<div class="qnav"><button class="btn quiet" data-act="mprev"' + (i === 0 ? ' disabled' : '') + '>← Previous</button><span class="kbd">1–4 answer · ← → move · F flag</span>' + (i < qs.length - 1 ? '<button class="btn" data-act="mnext" id="mnext">Next →</button>' : '<button class="btn" data-act="mask">Review and submit</button>') + '</div></article>' +
      '<details class="mapbox"' + (m.mapOpen ? ' open' : '') + ' data-tog="map"><summary>Question map · ' + answered + ' answered · ' + Object.keys(m.flag).filter((k) => m.flag[k]).length + ' flagged</summary><div class="qmap">' + map + '</div></details>', keep);
    startTimer();
  }
  function startTimer() {
    if (timerH) return; const m = mstate(mockId);
    let ticks = 0;
    timerH = setInterval(() => {
      m.elapsed++; ticks++;
      const remain = S.opts.timer * 60 - m.elapsed; const t = $('#timer');
      if (t) { t.textContent = fmtTime(remain); t.classList.toggle('low', remain < 900); }
      if (ticks % 15 === 0) save();
      if (remain <= 0) { stopTimer(); submitMock(true); }
    }, 1000);
  }
  function submitMock(timeUp) {
    const id = mockId; const m = mstate(id); const qs = MOCK[id];
    stopTimer();
    let correct = 0; const per = {}; DK.forEach((d) => { per[d] = { n: 0, c: 0 }; });
    qs.forEach((q) => { per[q.d].n++; const a = m.ans[q.id]; if (a === 0) { correct++; per[q.d].c++; } if (a !== undefined) record(q, a === 0, true); });
    const k = today(); const l = S.log[k] || { n: 0, c: 0 }; l.n += Object.keys(m.ans).length; l.c += correct; S.log[k] = l;
    m.sub = true; m.subAt = Date.now(); m.day = k; m.correct = correct; m.pct = Math.round(100 * correct / qs.length); m.per = per;
    mockPanel = null; reviewFilter = 'wrong'; save();
    if (timeUp) toast('Time is up. Mock ' + id + ' was submitted.');
    renderResults();
  }
  function renderResults() {
    const id = mockId; const m = mstate(id); const qs = MOCK[id];
    const rows = DK.map((d) => { const p = m.per[d]; const pc = p.n ? Math.round(100 * p.c / p.n) : 0; return '<div class="dbar" style="grid-template-columns:22px minmax(0,1fr) 90px"><span class="k">' + d + '</span><div class="track" title="' + esc(DOMAINS[d]) + '"><div class="fill ' + (pc < 65 ? 'low' : pc < 80 ? 'mid' : '') + '" style="width:' + pc + '%"></div></div><span class="val">' + p.c + '/' + p.n + ' · ' + pc + '%</span></div>'; }).join('');
    const wrong = qs.filter((q) => m.ans[q.id] !== 0); const flagged = qs.filter((q) => m.flag[q.id]);
    const list = reviewFilter === 'all' ? qs : reviewFilter === 'flag' ? flagged : wrong;
    const filt = '<div class="seg">' + [['wrong', 'Missed (' + wrong.length + ')'], ['flag', 'Flagged (' + flagged.length + ')'], ['all', 'All (' + qs.length + ')']].map(([k, l]) => '<button data-act="rfilter" data-f="' + k + '" class="' + (reviewFilter === k ? 'on' : '') + '">' + l + '</button>').join('') + '</div>';
    const weakest = DK.slice().sort((a, b) => (m.per[a].c / m.per[a].n) - (m.per[b].c / m.per[b].n)).slice(0, 2);
    const confirm = mockPanel === 'retake' ? '<div class="confirm danger"><p><strong>Erase this attempt?</strong> Your Mock ' + id + ' answers and score will be cleared so you can take it again. Your practice history stays.</p><div class="row"><button class="btn danger" data-act="mretakeyes">Yes, erase and retake</button><button class="btn quiet" data-act="mcancel">Cancel</button></div></div>' : '';
    setView('<section class="card stack"><span class="eyebrow">Mock exam ' + id + ' · ' + (m.mode === 'study' ? 'study mode' : 'exam mode') + ' · ' + esc(fmt(m.day)) + '</span><div class="row" style="gap:18px;align-items:baseline"><span class="score">' + m.pct + '%</span><span class="muted">' + m.correct + ' of ' + qs.length + ' correct · ' + fmtTime(m.elapsed) + ' used</span></div>' +
      '<p class="lead">Weakest areas: <strong>' + weakest.map((d) => d + '. ' + esc(DOMAINS[d])).join('</strong> and <strong>') + '</strong>. Your repair days use these.</p>' +
      '<div class="row"><button class="btn" data-act="mpracmissed">Practice the ' + wrong.length + ' I missed</button><button class="btn quiet" data-act="mback">All mock exams</button><button class="btn quiet" data-act="mretake">Retake</button></div>' + confirm + '</section>' +
      '<section class="card stack"><h3>Score by domain</h3><div class="dbars">' + rows + '</div></section>' +
      '<section class="stack"><div class="sectionhead"><h2>Review</h2>' + filt + '</div><div class="rlist">' + (list.length ? list.map((q) => reviewItem(q, m.ans[q.id], q.n)).join('') : '<p class="muted">Nothing here.</p>') + '</div></section>');
  }

  // ---------- FLASHCARDS ----------
  let cardDeck = 'all'; let curCard = null; let flipped = false; let cardsSeen = 0;
  function deckCards() { return CARDS.map((c, i) => Object.assign({ id: 'c' + i }, c)).filter((c) => cardDeck === 'all' || c.g === cardDeck); }
  function nextCard() {
    const d = deckCards(); if (!d.length) { curCard = null; return; }
    const box = (c) => S.cards[c.id] || 1; const min = Math.min.apply(null, d.map(box));
    let cand = d.filter((c) => box(c) <= min + 1 && (!curCard || c.id !== curCard.id)); if (!cand.length) cand = d;
    cand.sort((a, b) => box(a) - box(b)); const low = cand.filter((c) => box(c) === box(cand[0]));
    curCard = low[Math.floor(Math.random() * low.length)]; flipped = false;
  }
  function renderCards() {
    const groups = Array.from(new Set(CARDS.map((c) => c.g)));
    if (!curCard || (cardDeck !== 'all' && curCard.g !== cardDeck)) nextCard();
    const d = deckCards(); const boxes = [1, 2, 3, 4, 5].map((b) => d.filter((c) => (S.cards[c.id] || 1) === b).length);
    const decks = '<div class="seg">' + [['all', 'All cards']].concat(groups.map((g) => [g, g])).map(([k, l]) => '<button data-act="deck" data-g="' + esc(k) + '" class="' + (cardDeck === k ? 'on' : '') + '">' + esc(l) + '</button>').join('') + '</div>';
    const c = curCard;
    setView('<section class="stack"><h1>Flashcards</h1><p class="lead">Say the answer out loud before you flip. Cards you know move up a box and come back less often; cards you miss drop to box 1.</p></section>' +
      '<section class="card stack"><div class="row between">' + decks + '<span class="small muted">' + cardsSeen + ' reviewed this session</span></div>' +
      '<div class="boxes">' + boxes.map((n, k) => '<div><b>' + n + '</b>Box ' + (k + 1) + '</div>').join('') + '</div></section>' +
      (c ? '<div class="flash"><button class="fcard' + (flipped ? ' flipped' : '') + '" data-act="flip" aria-live="polite"><span class="eyebrow">' + esc(c.g) + (flipped ? ' · answer' : ' · tap to flip') + '</span>' + (flipped ? '<span class="back">' + inline(c.b) + '</span>' : '<span class="front">' + inline(c.f) + '</span>') + '</button></div>' +
        '<div class="row" style="justify-content:center">' + (flipped ? '<button class="btn quiet" data-act="cagain">Again</button><button class="btn" data-act="cgot">Got it</button>' : '<button class="btn" data-act="flip">Show answer</button>') + '</div><p class="kbd" style="text-align:center">Space flips · 1 again · 2 got it</p>' : '<p>No cards in this deck.</p>'));
  }
  function grade(ok) { if (!curCard) return; const b = S.cards[curCard.id] || 1; S.cards[curCard.id] = ok ? Math.min(5, b + 1) : 1; cardsSeen++; save(); nextCard(); renderCards(); }

  // ---------- OPTIONS ----------
  let optPanel = null;
  function renderOptions() {
    const backup = JSON.stringify(S);
    setView('<section class="stack"><h1>Options</h1></section>' +
      '<section class="card stack"><h3>Exam and plan</h3><div class="row" style="align-items:flex-end;gap:16px"><div class="field"><label for="examdate">Exam date</label><input type="date" id="examdate" value="' + esc(S.examDate) + '"></div><div class="field"><label for="timer">Mock timer (minutes)</label><input type="number" id="timer" min="30" max="400" step="5" value="' + S.opts.timer + '"></div><button class="btn" data-act="saveopts">Save</button></div>' +
      '<p class="small muted">The ' + PLAN.length + '-day plan counts back from the exam date. Confirm your appointment length, check-in rules, and ID requirements in the BCBA Handbook.</p>' +
      '<label class="row small"><input type="checkbox" id="poolmocks"' + (S.opts.poolMocks ? ' checked' : '') + ' data-chg="pool"> Add questions from finished mock exams to practice</label></section>' +
      '<section class="card stack"><h3>Back up or move your progress</h3><p class="small muted">Progress is stored in this browser only. Copy the backup code and paste it on another device or browser to continue there.</p>' +
      '<div class="row"><button class="btn" data-act="copybackup">Copy backup code</button><button class="btn quiet" data-act="dlbackup">Download backup file</button></div>' +
      '<div class="field"><label for="restore">Restore from a backup code</label><textarea id="restore" placeholder="Paste a backup code here"></textarea></div><div class="row"><button class="btn quiet" data-act="restore">Restore</button><label class="small muted">or choose a file <input type="file" id="restorefile" accept="application/json,.json" data-chg="file"></label></div>' +
      '<textarea id="backuptext" readonly hidden>' + esc(backup) + '</textarea></section>' +
      '<section class="card stack"><h3>Start over</h3><p class="small muted">Erase all answers, plan check-offs, mock attempts, and flashcard boxes on this device.</p>' +
      (optPanel === 'reset' ? '<div class="confirm danger"><p><strong>Erase everything?</strong> This cannot be undone unless you have a backup.</p><div class="row"><button class="btn danger" data-act="resetyes">Yes, erase all progress</button><button class="btn quiet" data-act="resetno">Cancel</button></div></div>' : '<div class="row"><button class="btn quiet" data-act="reset">Erase all progress</button></div>') + '</section>');
  }
  function restoreFrom(txt) {
    try { const o = JSON.parse(txt); if (!o || typeof o !== 'object' || !('ans' in o)) throw new Error('bad'); S = Object.assign(defaults(), o); S.opts = Object.assign(defaults().opts, o.opts || {}); if (!S.sess || typeof S.sess !== 'object') S.sess = {}; SS = S.sess; save(); toast('Progress restored.'); route(); }
    catch (e) { toast('That backup code is not valid. Copy the whole code and try again.'); }
  }

  // ---------- events ----------
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const act = el.dataset.act; const ds = el.dataset;
    if (el.tagName === 'A' && act !== 'pclose' && act !== 'startmissed') return;
    switch (act) {
      case 'tick': { const [i, j] = ds.k.split('-').map(Number); S.done[ds.k] = !isDone(i, j); save(); rerender(true); break; }
      case 'launch': launch(ds.k); break;
      case 'startmissed': e.preventDefault(); startPractice({ ds: DK, n: 50, src: 'missed', title: 'Review missed questions' }); break;
      case 'gsec': guideSel = ds.id; renderGuide(); break;
      case 'totraps': { const h = Array.from(document.querySelectorAll('.prose h3')).find((x) => x.textContent.trim() === 'Exam traps'); if (h) h.scrollIntoView({ behavior: 'smooth', block: 'start' }); break; }
      case 'markread': S.read[ds.id] = !S.read[ds.id]; save(); renderGuide(true); if (S.read[ds.id]) toast('Marked as read.'); break;
      case 'gpractice': startPractice({ ds: [ds.id], n: 12, src: 'smart', title: 'Domain ' + ds.id + ' practice' }); break;
      case 'pdall': pset.ds = DK.slice(); renderPractice(true); break;
      case 'pd': { if (pset.ds.length === DK.length) pset.ds = [ds.d]; else if (pset.ds.includes(ds.d)) pset.ds = pset.ds.filter((x) => x !== ds.d); else pset.ds.push(ds.d); if (!pset.ds.length) pset.ds = DK.slice(); renderPractice(true); break; }
      case 'pn': pset.n = +ds.n; renderPractice(true); break;
      case 'psrc': pset.src = ds.s; renderPractice(true); break;
      case 'pstart': startPractice({ ds: pset.ds, n: pset.n, src: pset.src, title: pset.ds.length === DK.length ? 'Mixed practice' : 'Practice: Domain ' + pset.ds.join(', ') }); break;
      case 'ppick': practicePick(+ds.o); break;
      case 'pnext': practiceNext(); break;
      case 'pend': if (Object.keys(sess.picks).length) finishPractice(); else { clearSess(); rerender(); } break;
      case 'pnew': clearSess(); rerender(); break;
      case 'pclose': clearSess(); break;
      case 'pretry': { const w = sess.ids.filter((id) => sess.picks[id] !== undefined && sess.picks[id] !== 0); startPractice({ ids: shuffle(w), title: 'Retry missed', home: sess.home || homeOf() }); break; }
      case 'bdall': bset.ds = DK.slice(); renderBank(true); break;
      case 'bd': { if (bset.ds.length === DK.length) bset.ds = [ds.d]; else if (bset.ds.includes(ds.d)) bset.ds = bset.ds.filter((x) => x !== ds.d); else bset.ds.push(ds.d); if (!bset.ds.length) bset.ds = DK.slice(); bset.ds.sort(); renderBank(true); break; }
      case 'bn': bset.n = +ds.n; renderBank(true); break;
      case 'bstart': startPractice({ ds: bset.ds, n: bset.n, src: 'smart', title: bset.ds.length === DK.length ? 'Question bank: mixed, exam-weighted' : 'Question bank: Domain ' + bset.ds.join(', '), home: 'bank' }); break;
      case 'bmissed': startPractice({ ds: DK, n: 50, src: 'missed', title: 'Question bank: missed questions', home: 'bank' }); break;
      case 'mopen': mockId = +ds.id; mockPanel = null; renderExams(); break;
      case 'mback': stopTimer(); mockId = null; mockPanel = null; renderExams(); break;
      case 'mmode': mockPanel = ds.m === 'study' ? 'study' : null; renderExamIntro(); break;
      case 'mbegin': S.mocks[mockId] = { ans: {}, flag: {}, start: Date.now(), elapsed: 0, cur: 0, mode: mockPanel === 'study' ? 'study' : 'exam' }; mockPanel = null; save(); renderExam(); break;
      case 'mpick': { const m = mstate(mockId); const q = MOCK[mockId][m.cur]; if (m.mode === 'study' && m.ans[q.id] !== undefined) return; m.ans[q.id] = +ds.o; save(); renderExam(true); break; }
      case 'mnext': { const m = mstate(mockId); if (m.cur < MOCK[mockId].length - 1) { m.cur++; save(); renderExam(); } break; }
      case 'mprev': { const m = mstate(mockId); if (m.cur > 0) { m.cur--; save(); renderExam(); } break; }
      case 'mgo': { const m = mstate(mockId); m.cur = +ds.i; save(); renderExam(); break; }
      case 'mflag': { const m = mstate(mockId); const q = MOCK[mockId][m.cur]; m.flag[q.id] = !m.flag[q.id]; save(); renderExam(true); break; }
      case 'mask': mockPanel = 'submit'; renderExam(); break;
      case 'mcancel': mockPanel = null; rerender(true); break;
      case 'msubmit': submitMock(false); break;
      case 'mpause': stopTimer(); mockId = null; save(); renderExams(); toast('Saved. Resume any time.'); break;
      case 'rfilter': reviewFilter = ds.f; renderResults(); break;
      case 'mretake': mockPanel = 'retake'; renderResults(); break;
      case 'mretakeyes': delete S.mocks[mockId]; mockPanel = null; save(); renderExams(); break;
      case 'mpracmissed': { const m = mstate(mockId); const ids = MOCK[mockId].filter((q) => m.ans[q.id] !== 0).map((q) => q.id); if (!ids.length) { toast('You missed nothing on this mock.'); return; } startPractice({ ids: shuffle(ids), title: 'Mock ' + mockId + ' missed questions' }); break; }
      case 'deck': cardDeck = ds.g; curCard = null; renderCards(); break;
      case 'flip': flipped = !flipped; renderCards(); break;
      case 'cagain': grade(false); break;
      case 'cgot': grade(true); break;
      case 'saveopts': {
        const d = $('#examdate').value; const t = parseInt($('#timer').value, 10);
        if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) { toast('Pick a valid exam date.'); return; }
        S.examDate = d; if (t >= 30 && t <= 400) S.opts.timer = t; save(); updateCount(); toast('Saved. The plan now counts back from ' + fmt(d) + '.'); break;
      }
      case 'copybackup': { const txt = JSON.stringify(S); const ta = $('#backuptext'); ta.value = txt;
        const fallback = () => { ta.hidden = false; ta.focus(); ta.select(); toast('Select all and copy the code shown.'); };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => toast('Backup code copied.'), fallback); else fallback(); break; }
      case 'dlbackup': { try { const b = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'bcba-progress-' + today() + '.json'; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); } catch (er) { toast('Download is blocked here. Use Copy backup code instead.'); } break; }
      case 'restore': restoreFrom($('#restore').value.trim()); break;
      case 'reset': optPanel = 'reset'; renderOptions(); break;
      case 'resetno': optPanel = null; renderOptions(); break;
      case 'resetyes': S = defaults(); SS = S.sess; save(); optPanel = null; sess = null; mockId = null; toast('All progress erased.'); route(); break;
    }
  });
  document.addEventListener('change', (e) => {
    const el = e.target; const c = el.dataset && el.dataset.chg; if (!c) return;
    if (c === 'gsel') { guideSel = el.value; renderGuide(); }
    if (c === 'pool') { S.opts.poolMocks = el.checked; save(); }
    if (c === 'file') { const f = el.files && el.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => restoreFrom(String(r.result)); r.readAsText(f); }
  });
  document.addEventListener('toggle', (e) => { if (e.target.dataset && e.target.dataset.tog === 'map' && mockId && mstate(mockId)) { mstate(mockId).mapOpen = e.target.open; } }, true);
  document.addEventListener('keydown', (e) => {
    if (e.target.closest('input, textarea, select') || e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toLowerCase(); const idx = '1234'.indexOf(k) >= 0 ? '1234'.indexOf(k) : 'abcd'.indexOf(k);
    if ((current === 'practice' || current === 'bank') && sess && !sess.finished) {
      const q = QBY[sess.ids[sess.i]]; const answered = sess.picks[q.id] !== undefined;
      if (!answered && idx >= 0 && idx < q.opts.length) { e.preventDefault(); practicePick(order(q)[idx]); }
      else if (answered && (k === 'enter' || k === 'arrowright')) { e.preventDefault(); practiceNext(); }
    } else if (current === 'exams' && mockId && mstate(mockId) && mstate(mockId).start && !mstate(mockId).sub) {
      const m = mstate(mockId); const q = MOCK[mockId][m.cur];
      if (idx >= 0 && idx < q.opts.length && !(m.mode === 'study' && m.ans[q.id] !== undefined)) { e.preventDefault(); m.ans[q.id] = order(q)[idx]; save(); renderExam(true); }
      else if (k === 'arrowright' || k === 'enter') { if (m.cur < MOCK[mockId].length - 1) { e.preventDefault(); m.cur++; save(); renderExam(); } }
      else if (k === 'arrowleft') { if (m.cur > 0) { e.preventDefault(); m.cur--; save(); renderExam(); } }
      else if (k === 'f') { e.preventDefault(); m.flag[q.id] = !m.flag[q.id]; save(); renderExam(true); }
    } else if (current === 'cards' && curCard) {
      if (k === ' ') { e.preventDefault(); flipped = !flipped; renderCards(); }
      else if (flipped && k === '1') grade(false);
      else if (flipped && k === '2') grade(true);
    }
  });
  window.addEventListener('beforeunload', save);

  route();
})();

</script>
</body>
</html>
