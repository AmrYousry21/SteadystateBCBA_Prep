D: `
### Exam traps

- **Reversal for irreversible or dangerous behavior.** A reading skill will not reverse, and withdrawing treatment for self-injury is unethical. A-B-A-B is the distractor in both cases.
- **A-B called a functional relation.** An A-B design shows change but has no verification or replication. Any option claiming it "demonstrates experimental control" is wrong.
- **Tiers changing together in a multiple baseline.** If untreated tiers improve at the same time as the treated tier, experimental control is weakened. The trap answer calls this "generalization that proves the effect."
- **Multielement vs changing criterion.** Rapid alternation of conditions to compare them is multielement. Step-by-step changes in a performance requirement is changing criterion.
- **Parametric vs component vs comparative.** Different amounts of one IV is parametric. Which parts of a package matter is component. Two different treatments against each other is comparative.
- **History vs maturation.** An outside event during the study (a new tutor, a schedule change) is history. Change within the person over time (development, fatigue) is maturation.
- **Starting on a therapeutic trend.** If baseline is already improving, the right answer is usually to wait for stability, not to start the intervention.

### How to eliminate answers

1. Ask two questions about the behavior: will it reverse, and is it ethical to withdraw treatment? If either answer is no, cross out reversal designs.
2. Match the stem's purpose to the design: compare quickly → multielement; gradual stepwise change → changing criterion; cannot withdraw → multiple baseline.
3. Eliminate any answer that claims control without verification or replication.
4. For graph questions, cover the options, judge level, trend, and variability yourself, then pick the option that matches your read.

E: `
### Exam traps

- **The dramatic first step.** When no client is at immediate risk, the expected first step for a colleague's misconduct is often to address it directly and document, not to report to the BACB at once. But when a client is in danger or abuse is suspected, protecting the client and mandated reporting come first. Read for risk before choosing.
- **"Read up and start."** Learning on the job is not competence. The right answer is training, supervision, consultation, or referral.
- **"Blur the face and it's fine."** Identifiable details (age, school, event) can still identify a client. Public use of client information needs informed consent.
- **Absolute bans where the Code allows mitigation.** In a small town, a multiple relationship may be unavoidable. The Code asks you to disclose, set boundaries, document, and consult, not to pretend it can always be avoided.
- **Third party over client.** When a school, funder, or employer wants something that conflicts with the client's welfare, the client's welfare wins.

### How to eliminate answers

1. Rank the options by priority: client safety first, then legal requirements, then the Ethics Code, then everyone's convenience.

F: `
### Exam traps

- **Skipping the medical rule-out.** Sudden-onset self-injury or aggression points to records review and a medical referral first. An FA is the distractor.
- **Treating descriptive data as proof.** ABC data and scatterplots show correlation. Only an FA shows that a variable causes behavior.
- **Preference equals reinforcer.** The top item in a preference assessment still needs a reinforcer assessment to show it increases behavior.
- **Reading the tallest bar.** In an FA, compare each test condition with the play (control) condition. High in every condition, including alone, suggests automatic reinforcement. High in play too suggests a problem with the control or an automatic function.
- **Condition mix-ups.** Demand condition: problem behavior produces a break. Attention condition: it produces attention. Tangible: the item comes back. Alone: nothing happens.
- **MSW vs MSWO vs paired stimulus.** With replacement keeps the item in the array; without replacement removes it; paired stimulus presents every pair.
- **Norm vs criterion referenced.** Compared with same-age peers is norm-referenced (Vineland). Compared with a skill sequence is criterion-referenced (VB-MAPP, ABLLS-R).

### How to eliminate answers

1. For "first step" questions, eliminate anything more intrusive than needed: records and medical rule-outs, then indirect, then descriptive, then FA.
2. In FA graphs, compare every condition with play before choosing a function.
3. Cross out interventions that do not match the identified function (time-out for escape, planned ignoring for escape, sensory toys for attention).
4. For dangerous behavior, eliminate a standard FA with long sessions in favor of precursor or latency-based formats.

G: `
### Exam traps

- **DRO vs NCR.** DRO requires the behavior to be absent before reinforcement. NCR delivers the reinforcer on a clock no matter what the person does. "Every 2 minutes regardless of behavior" is NCR.
- **DRA vs DRI.** DRI needs a behavior that physically cannot happen at the same time (hands folded vs hand-flapping). A merely appropriate alternative is DRA.
- **DRL vs DRO.** DRL keeps a behavior but lowers its rate (fewer questions per class). DRO aims for absence.
- **Time-out for escape behavior.** If the child wants to leave the task, time-out delivers what they want and strengthens the behavior.
- **Shaping vs chaining vs fading.** Shaping changes one response through approximations. Chaining links several responses in a sequence. Fading changes the prompt or the stimulus while the response stays the same.
- **Response vs stimulus prompts.** Verbal, gestural, model, and physical prompts act on the response. Making the correct card bigger or adding an arrow changes the stimulus.
- **Dependent vs interdependent group contingencies.** One student's performance decides the group reward → dependent. Everyone must meet criterion → interdependent.
- **Restitutional vs positive practice.** Repairing and improving the environment is restitutional. Practicing the correct behavior repeatedly is positive practice.
- **Response cost vs time-out.** Losing tokens already earned is response cost. Losing access to reinforcement for a period is time-out.

### How to eliminate answers

1. Ask what is being reinforced and when: a specific alternative (DRA), an incompatible response (DRI), absence (DRO), a lower rate (DRL), a higher rate (DRH), or the passage of time (NCR). Cross out the rest.
2. Check the function. Eliminate any procedure that delivers the maintaining reinforcer for the problem behavior.
3. For prompting questions, ask whether the response or the stimulus is being changed, then whether help starts high (most-to-least) or low (least-to-most).
4. For chaining, eliminate backward chaining when the learner already knows the early steps, and forward chaining when the stem emphasizes contacting the terminal reinforcer on the first trial.
`,

H: `
### Exam traps

- **Changing the plan before checking integrity.** When an intervention seems not to work, the first move is to check whether it is being implemented as written.
- **Replacement behavior with the wrong function.** If screaming gets escape, "raising a hand for attention" is the wrong replacement even though it sounds appropriate.
- **Dead-man goals.** "Will not hit" or "will sit quietly" fail the dead-man test. Look for an active, measurable behavior.
- **Evidence without contextual fit.** The strongest procedure in the literature is the wrong answer if the family or teacher cannot carry it out.
- **Relapse terms.** Resurgence: old behavior returns when the replacement stops paying off. Renewal: it returns with a change in context. Reinstatement: it returns after the reinforcer is delivered again. Spontaneous recovery: it returns after time passes during extinction.
- **Punishment as a first option.** Punishment is considered only after less restrictive, reinforcement-based options, with consent and a reinforcement component.
- **Acting on one bad week.** A sudden change calls for checking integrity and new variables (illness, changes at home) before overhauling the plan.

### How to eliminate answers

1. For "first" or "next" questions, prefer checking integrity or collecting data over changing the intervention.
2. Cross out any replacement behavior that does not meet the same function as the problem behavior.
3. Of the remaining options, choose the least restrictive one that fits the setting and involves the people who will implement it.
4. Eliminate goals that use words like "understand," "appreciate," or "be appropriate."

I: `
### Exam traps

- **Training a performance deficit.** If staff do the procedure correctly in role-play but not in sessions, more training is the distractor. Look at prompts, resources, and consequences.
- **Blaming the person.** Options about staff being lazy, unmotivated, or having a bad attitude are almost always wrong. Look for environmental variables.
- **BST order and missing parts.** The order is instructions, modeling, rehearsal, feedback. When modeling alone did not work, the missing piece is usually rehearsal with feedback.
- **Delayed, vague feedback.** Annual reviews and general praise are weaker than immediate, specific feedback.
- **PDC-HS area mix-ups.** Does not know how → training. Does not know what or when → task clarification and prompting. Lacks materials or the process is too hard → resources. Nothing happens either way → performance consequences.
- **Judging supervision by satisfaction.** Supervision is evaluated with data on supervisee performance and client outcomes, not by how much supervisees like it.

### How to eliminate answers

1. Ask "can they do it?" If yes, cross out every training option.
2. Choose the option that assesses the cause (performance diagnostics) before the option that intervenes.
3. Eliminate punitive first steps such as warnings, pay cuts, or termination when assessment and support have not happened yet.
4. When evaluating supervision, pick the answer that compares data before and after a change.

<script>
/* data/practice.js */
// Practice bank. Each item: [domain, stem, [correct answer, distractor, distractor, distractor], explanation].
// The correct answer is always listed first here; the app shuffles the display order.
window.PRACTICE = [
// ---------- A ----------
["A","A researcher shows that a child's hand-raising increases every time praise is introduced and decreases every time it is removed. Which goal of science has been reached?",["Control","Description","Prediction","Replication"],"Manipulating a variable and producing reliable changes in behavior demonstrates a functional relation, which is control, the highest level of scientific understanding."],
["A","A BCBA says, 'Before assuming the tantrums are caused by a neurological condition, let's check whether they produce escape from chores.' Which assumption is she applying?",["Parsimony","Pragmatism","Mentalism","Selectionism"],"Parsimony means ruling out simple, logical explanations (such as environmental contingencies) before turning to more complex or abstract ones."],
["A","Which statement best reflects radical behaviorism?",["Thoughts and feelings are behaviors subject to the same principles as public behavior","Private events exist but cannot be part of a science of behavior","Behavior is caused by the mind, which must be studied by introspection","Only behavior that can be measured in a laboratory is real"],"Radical behaviorism includes private events as behavior. Excluding them from science is methodological behaviorism; explaining behavior with the mind is mentalism."],
["A","'He hits because he is aggressive. We know he is aggressive because he hits.' This is an example of:",["Circular reasoning using an explanatory fiction","Philosophic doubt","An operational definition","Determinism"],"The 'cause' is inferred only from the behavior it claims to explain, which makes it circular. Such constructs are called explanatory fictions."],
["A","A published study describes its procedures so precisely that another clinic replicates them exactly. Which dimension of ABA does this reflect?",["Technological","Conceptually systematic","Analytic","Generality"],"Technological means the procedures are described in enough detail to be replicated. Conceptually systematic refers to linking procedures to basic principles."],
["A","A lab study examines how pigeons' key-pecking changes under different reinforcement schedules. This is best described as:",["The experimental analysis of behavior","Applied behavior analysis","Professional practice guided by behavior analysis","Radical behaviorism"],"Basic research discovering principles, often with nonhuman subjects in controlled settings, is the experimental analysis of behavior (EAB)."],
["A","A BCBA keeps using a procedure only because it consistently helps her clients reach their goals, and drops procedures that do not. Which assumption does this most reflect?",["Pragmatism","Empiricism","Determinism","Selectionism"],"Pragmatism judges the value of knowledge and practices by their usefulness and results."],
["A","An intervention reduced a student's call-outs from 40 to 36 per day. The change was reliable but the teacher saw no practical difference. Which dimension is weak?",["Effective","Analytic","Behavioral","Technological"],"Effective means the change is large enough to matter practically to the client and stakeholders, not just statistically detectable."],
["A","Skinner described behavior as selected by its consequences across three levels. Which list names them?",["Phylogenic, ontogenic, cultural","Respondent, operant, verbal","Description, prediction, control","Biological, social, environmental"],"Selectionism operates at the level of the species (phylogenic), the individual's lifetime (ontogenic), and group practices (cultural)."],
["A","A target behavior was chosen because it would let a young adult keep a job. Which dimension is most directly addressed?",["Applied","Conceptually systematic","Technological","Analytic"],"Applied means the behavior is socially significant to the person and their life."],
["A","A BCBA reviews her own successful findings and still asks whether some other variable might explain them. This is:",["Philosophic doubt","Parsimony","Empiricism","Replication"],"Philosophic doubt is the continuing questioning of what is regarded as fact, including your own results."],
["A","A study measures what parents say about their child's sleep rather than measuring the child's sleep. Which dimension is most at risk?",["Behavioral","Applied","Effective","Generality"],"Behavioral requires measuring the actual behavior of interest, not what people say about it."],

// ---------- B ----------
["B","Each time a teen complains about a headache, his mother lets him skip the dishes. Complaining increases. This is:",["Negative reinforcement","Positive reinforcement","Negative punishment","Positive punishment"],"An aversive stimulus (the dishes) is removed after the behavior, and the behavior increases. Removing a stimulus that increases behavior is negative reinforcement."],
["B","A driver gets a speeding ticket and then drives within the limit in that area. Assuming the change is due to the ticket, this is:",["Positive punishment","Negative reinforcement","Negative punishment","Extinction"],"A stimulus (the ticket) was added after speeding and future speeding decreased, which is positive punishment."],
["B","A child's crying in the night had been maintained by parental attention. The parents now stop going in, and crying increases sharply on the first night before declining. The increase is called:",["An extinction burst","Spontaneous recovery","Resurgence","Behavioral contrast"],"A temporary increase in rate or intensity when reinforcement is first withheld is an extinction burst."],
["B","A worker is paid after every 10 widgets assembled. Which schedule and typical pattern apply?",["Fixed ratio; high rate with a pause after reinforcement","Fixed interval; a scalloped pattern","Variable ratio; steady high rate without pauses","Variable interval; moderate steady rate"],"A fixed number of responses for each reinforcer is a fixed-ratio schedule, which produces high rates with post-reinforcement pauses."],
["B","After eating a large lunch, a child stops requesting snacks for several hours. The large lunch functioned as:",["An abolishing operation","An establishing operation","An SD","A conditioned reinforcer"],"Satiation reduces the value of food as a reinforcer and decreases behavior that has produced it, which is an abolishing operation."],
["B","You need a screwdriver to finish building a shelf, and asking for a screwdriver becomes more likely. The unfinished shelf is best described as a:",["CMO-T (transitive)","CMO-R (reflexive)","CMO-S (surrogate)","UMO"],"A CMO-T makes another stimulus (the screwdriver) valuable as a reinforcer, like the locked door making the key valuable."],
["B","A child says 'juice' when thirsty and receives juice. This verbal operant is a:",["Mand","Tact","Intraverbal","Echoic"],"A mand is controlled by an MO (thirst) and is reinforced by the specific thing named (juice)."],
["B","A teacher asks, 'What do cows say?' and the student says 'moo.' This is a(n):",["Intraverbal","Echoic","Tact","Textual"],"The response is controlled by a verbal stimulus and has no point-to-point correspondence with it, which makes it an intraverbal."],
["B","A child learns to say 'dog' to a golden retriever and then says 'dog' to a poodle she has never seen. This is:",["Stimulus generalization","Response generalization","Stimulus discrimination","Response maintenance"],"The same response occurring in the presence of a new but similar stimulus is stimulus generalization."],
["B","A learner is taught 'spoken word to picture' and 'picture to printed word.' Without training, she matches the printed word to the spoken word. Which relation emerged?",["Equivalence (combined symmetry and transitivity)","Reflexivity","Symmetry only","Stimulus generalization"],"After A-B and B-C training, C-A emerging requires both reversing and chaining the trained relations, the combined equivalence test."],
["B","A student gets teacher attention for problem behavior about 70% of the time and for raising her hand about 30% of the time. The matching law predicts:",["She will allocate most of her responding to problem behavior","She will stop raising her hand entirely","Both behaviors will occur at equal rates","She will raise her hand more because it is appropriate"],"The matching law says the relative rate of responding matches the relative rate of reinforcement, so most responding will go to the richer option."],
["B","Saying 'I'm sure the store is closed' instead of 'the store is closed' adds which verbal operant?",["An autoclitic","A tact","A mand","An intraverbal"],"'I'm sure' modifies the listener's reaction to the rest of the speaker's own verbal behavior, which defines an autoclitic."],

// ---------- C ----------
["C","Observer 1 records 18 hits and observer 2 records 20 hits in the same session. What is total count IOA?",["90%","95%","88%","111%"],"Total count IOA = smaller count ÷ larger count × 100 = 18 ÷ 20 × 100 = 90%."],
["C","A BCBA wants to measure how long it takes a client to begin brushing his teeth after being asked. Which measure fits?",["Latency","Duration","Interresponse time","Rate"],"Latency is the time from the onset of a stimulus (the request) to the start of the response."],
["C","A BCBA wants to decrease spitting and needs a discontinuous measure. Which method is most conservative for a behavior to decrease, and why?",["Partial interval, because it tends to overestimate the behavior","Whole interval, because it tends to underestimate the behavior","Momentary time sampling, because it never errs","Whole interval, because it tends to overestimate the behavior"],"Partial interval overestimates occurrence, so any decrease it shows is unlikely to be inflated. That makes it a sensible choice for behaviors you want to reduce."],
["C","Over several weeks, a trained observer gradually begins counting brief touches as 'aggression,' which the definition does not include. This is:",["Observer drift","Observer reactivity","Regression to the mean","Measurement bias by design"],"Observer drift is an unintended change over time in how an observer applies the definition."],
["C","Counting completed math worksheets at the end of the day is an example of:",["Permanent product measurement","Indirect measurement","Momentary time sampling","Interval recording"],"Measuring the outcome a behavior leaves behind, after it occurs, is permanent product recording."],
["C","Sessions vary from 15 to 40 minutes. Which measure best allows comparison of hitting across sessions?",["Rate (count per unit of time)","Count","Percentage of intervals","Trials to criterion"],"When observation periods differ, rate standardizes the count so sessions can be compared."],
["C","Which definition of 'out of seat' is the most complete?",["Any time the student's bottom is not in contact with the seat for 3 or more seconds, excluding approved trips to the pencil sharpener","Wandering around the classroom","Being restless and unable to stay seated","Leaving the seat too often"],"A complete definition is objective, clear, and states boundaries, including what counts and what does not."],
["C","A graph shows each response added to a running total, so the line never goes down. A flat segment means:",["No responses occurred during that period","Responding was at its highest rate","Responding decreased to zero permanently","Data were missing"],"In a cumulative record, slope reflects rate. A flat line means no responses during that time."],
["C","Two observers use 10-second partial-interval recording for a low-rate behavior. Which IOA method is most stringent and appropriate here?",["Scored-interval IOA","Unscored-interval IOA","Total count IOA","Total duration IOA"],"For low-rate behavior, scored-interval IOA ignores the many intervals both observers left empty, which would otherwise inflate agreement."],
["C","The phase 2 data path overlaps almost completely with baseline, with no change in level or trend. The most accurate conclusion is:",["There is little evidence the intervention changed behavior","The intervention was highly effective","The baseline was too short to interpret","The data should be graphed on a bar graph instead"],"High overlap with no change in level or trend means the intervention phase does not differ meaningfully from baseline."],
["C","An observer records whether each of 6 students is working at the end of every 2-minute interval. This procedure is:",["PLACHECK","Whole-interval recording","Partial-interval recording","Duration recording"],"Planned activity check (PLACHECK) counts how many members of a group are engaged in the behavior at the moment the interval ends."],
["C","A technician collects data on whether each step of a token system was implemented correctly. This is measurement of:",["Procedural integrity","Social validity","Interobserver agreement","Treatment generality"],"Procedural (treatment) integrity is the extent to which the intervention is implemented as designed."],

// ---------- D ----------
["D","In a study testing whether a token system increases homework completion, homework completion is the:",["Dependent variable","Independent variable","Confounding variable","Control variable"],"The dependent variable is what is measured to see whether it changes: here, homework completion."],
["D","A child's vocabulary grows during a study of a new language program, but the growth could be due to normal development over months. This threat is:",["Maturation","History","Testing","Instrumentation"],"Maturation refers to changes within the participant over time, such as development, that could explain results."],
["D","Which design is most appropriate when the target behavior is a reading skill that will not reverse once learned?",["Multiple baseline","Reversal (A-B-A-B)","A-B-A","Withdrawal design"],"Skills that are not reversible make withdrawal designs uninformative. A multiple baseline shows control without removing the intervention."],
["D","A BCBA alternates two prompting methods across sessions in a random order and compares the data paths. Which design is this?",["Multielement (alternating treatments)","Changing criterion","Multiple baseline across behaviors","Reversal"],"Rapid alternation of two or more conditions to compare their effects is a multielement or alternating treatments design."],
["D","Reinforcement is provided when a client reduces cigarettes to 15 per day, then 12, then 9, and smoking tracks each new limit. Which design?",["Changing criterion","Multiple baseline","Multielement","Reversal"],"In a changing-criterion design, the performance criterion changes in steps, and behavior matching each step shows experimental control."],
["D","In a multiple baseline across three participants, all three improve on the same day, even though the intervention started for only the first. This suggests:",["An outside variable may be responsible, weakening experimental control","Strong experimental control","The intervention generalized as planned","The design should switch to a changing criterion"],"Untreated tiers should stay stable until the IV reaches them. Simultaneous change suggests history or another confound."],
["D","Why is an A-B design alone insufficient to demonstrate a functional relation?",["It has no verification or replication of the effect","It has no baseline","It cannot be graphed","It uses too many participants"],"An A-B design shows change after the IV, but nothing verifies that baseline would have continued or replicates the effect."],
["D","A researcher compares 5-, 10-, and 20-minute breaks to see which duration best maintains work. This is a:",["Parametric analysis","Component analysis","Comparative analysis","Reversal analysis"],"Testing different values of the same independent variable is a parametric analysis."],
["D","A strength of single-case designs compared with group designs is that they:",["Show effects for individuals through repeated measurement","Require large samples for statistics","Remove the need for a baseline","Guarantee external validity"],"Single-case designs use each person as their own control and track change over time, so individual effects are not hidden in averages."],
["D","A behavior analyst wants to know which part of a package (prompts, praise, tokens) is responsible for the effect. She should conduct a:",["Component analysis","Parametric analysis","Reversal design","Descriptive assessment"],"A component analysis examines the contribution of individual parts of a treatment package."],
["D","High external validity means:",["The findings generalize to other people, settings, or behaviors","The IV caused the change in the DV","Observers agreed on the data","The baseline was stable"],"External validity concerns how far results generalize beyond the study's conditions."],
["D","Baseline data for disruptive behavior are steadily decreasing. What should the BCBA generally do before introducing the intervention?",["Wait for stable data, since the behavior is already improving","Introduce the intervention immediately","End the study","Switch to a reversal design"],"When baseline already trends in the therapeutic direction, any later improvement cannot be clearly attributed to the IV."],

// ---------- E ----------
["E","A BCBA is asked to treat a client's severe feeding disorder. She has no training in feeding. What should she do?",["Decline or refer, or get training and supervision from a qualified professional before providing that service","Accept the case and read articles as she goes","Accept because she is board certified","Ask the RBT to handle feeding sessions"],"Behavior analysts practice only within their competence. Expanding into a new area requires training, supervision, or consultation; otherwise refer."],
["E","A BCBA wants to post a short video of a client's progress on the clinic's social media page. What is required first?",["Informed consent from the client or legal guardian for that specific use","Nothing, if the client's face is blurred","Approval from the RBT who worked with the client","Permission from the funding source"],"Using client information or images publicly requires informed consent for that use. Identifying details can remain even when a face is blurred."],
["E","A BCBA's neighbor asks her to provide services to his son. What is the main concern?",["A multiple relationship that could impair objectivity or harm the client","The neighbor may not pay on time","The son may live too close for home sessions","The BACB forbids services to anyone you know"],"Multiple relationships risk conflicts of interest and harm. They should be avoided where possible, with referral as the usual answer."],
["E","A family's funding ends and services must stop in two weeks. What is the most appropriate action?",["Notify the family, provide referrals, and create a transition plan","Stop services immediately to avoid unpaid sessions","Continue services without payment indefinitely","Tell the family to contact the funder"],"Discontinuation should be planned: notice, referrals, and a transition plan that protects client welfare."],
["E","A supervisee who is an RBT lists herself as 'behavior analyst' on her professional profile. This is a concern because:",["It misrepresents her credentials","RBTs are not allowed to use social media","It reveals client information","It violates the supervisor's privacy"],"Public statements must accurately represent credentials. An RBT is not a behavior analyst."],
["E","A BCBA learns a colleague is billing for sessions that never happened. No client is in immediate danger. What is generally the first step, if safe and appropriate?",["Address it with the colleague directly and document it","Post about it online to warn others","Ignore it because it does not involve her clients","Report it to the client's family first"],"When appropriate, address the concern informally first and document. If it is not resolved, report to the relevant authority."],
["E","For how long should client records generally be retained under the BACB Ethics Code?",["At least 7 years, or longer if required by law","At least 2 years","At least 1 year after the last session","Only while services are active"],"The Code requires keeping documentation for at least 7 years and as otherwise required by law."],
["E","A BCBA notices she tends to set lower goals for clients from certain backgrounds. The best response is to:",["Identify the bias and seek training or supervision to reduce its effect on services","Ignore it, since good intentions are enough","Transfer all such clients to colleagues without explanation","Ask families to set all goals themselves"],"Behavior analysts identify personal biases and take steps, such as training or consultation, so biases do not interfere with services."],
["E","A family's cultural practice is to make decisions collectively with grandparents. A culturally humble BCBA would:",["Ask the family how they want decisions made and include those members","Insist that only the legal guardian attend meetings","Explain that ABA requires one decision-maker","Assume all families from that culture make decisions the same way"],"Cultural humility involves learning from each family and adapting service delivery, not assuming or imposing."],
["E","A state licensure law requires something that differs from the BACB Ethics Code. The BCBA should:",["Comply with the law and take steps to resolve the conflict consistent with the Code","Follow the Code and ignore the law","Stop practicing in that state","Choose whichever is less work"],"When laws and the Code conflict, behavior analysts follow the law and work to resolve the conflict in line with the Code."],
["E","A BCBA learns that her state licensing board has opened an investigation into her practice. Under the Code she should:",["Self-report to the BACB within 30 days of learning about it","Wait until the investigation concludes","Report only if she is fired","Never report employer investigations"],"Behavior analysts self-report within 30 days of becoming aware of an investigation; they do not wait for its outcome."],
["E","A BCBA's supervisee repeatedly forgets to collect data. Before reporting her or ending supervision, the BCBA should first:",["Give clear expectations, feedback, and support, and document the plan","Terminate the supervision contract","Report the supervisee to the BACB","Complete the data sheets herself"],"Supervisors are responsible for effective supervision: clarify expectations, give feedback, and support improvement before escalating."],

// ---------- F ----------
["F","During an FA, a client's problem behavior is high in the attention condition and low in all others. The most likely function is:",["Socially mediated positive reinforcement (attention)","Escape from demands","Automatic reinforcement","Access to tangibles"],"Elevated responding only in the attention condition, compared with the play control, indicates attention as the maintaining reinforcer."],
["F","Problem behavior occurs at high, similar rates in every FA condition, including alone. This most suggests:",["Automatic reinforcement","Attention","Escape","The FA was run correctly but there is no function"],"Responding that persists across all conditions, even without social consequences, suggests the behavior produces its own reinforcement."],
["F","Which assessment shows a functional relation rather than a correlation?",["Functional analysis","ABC narrative recording","Scatterplot","A caregiver interview"],"Only a functional analysis manipulates variables, so only it demonstrates causation. Descriptive methods show correlations."],
["F","A BCBA needs a quick ranked list of 6 preferred items and the learner can scan an array and choose. Which assessment is most efficient?",["Multiple stimulus without replacement (MSWO)","Single-stimulus assessment","Paired-stimulus assessment","Free-operant observation"],"MSWO produces a full ranking quickly by removing each chosen item and representing the rest."],
["F","Before beginning an FBA for new head-hitting, the BCBA should first:",["Review medical records and recommend a medical evaluation to rule out pain or illness","Run a full functional analysis","Start extinction","Begin a token economy"],"New self-injury can signal a medical problem such as ear infections or pain. Medical causes should be ruled out before behavioral explanations."],
["F","Which is an indirect assessment?",["A rating scale completed by a parent, such as the QABF","ABC continuous recording","A functional analysis","A scatterplot completed by direct observation"],"Indirect assessments gather information from informants rather than direct observation."],
["F","In the demand condition of a standard FA, what happens after problem behavior?",["The task is briefly removed","The therapist gives attention","A preferred item is returned","Nothing changes"],"The demand condition tests for escape: problem behavior produces a brief break from the task."],
["F","A client's aggression is dangerous, but it reliably follows loud vocalizations. Which FA variation reduces risk?",["A precursor FA targeting the vocalizations","A standard FA with longer sessions","An alone condition only","Skipping the FA and using punishment"],"A precursor FA measures a safer behavior that reliably comes before the dangerous one, reducing exposure to risk."],
["F","An item ranked highest in a preference assessment does not increase task completion when delivered contingently. This shows:",["Preference does not guarantee reinforcing effectiveness, so a reinforcer assessment matters","The preference assessment was invalid and should be discarded","Task completion cannot be reinforced","The learner is satiated on all items forever"],"Preference assessments predict, but only a reinforcer assessment confirms that an item increases behavior."],
["F","A scatterplot shows problem behavior clusters between 10:00 and 11:00 every day. This information is most useful for:",["Identifying when to look more closely at what is happening during that time","Proving the function of the behavior","Calculating IOA","Selecting a punishment procedure"],"Scatterplots reveal temporal patterns that guide further assessment, but they do not show function on their own."],
["F","Which tool is criterion-referenced and commonly used to assess language and learning skills in early learners?",["VB-MAPP","Vineland","IQ test","QABF"],"The VB-MAPP compares the learner to a sequence of skill milestones (criterion-referenced). The Vineland is norm-referenced."],
["F","When prioritizing goals, which should generally come first?",["Behavior that poses a danger to the client or others","The skill the BCBA finds most interesting","The skill that is fastest to teach","The goal funding pays the most for"],"Danger to self or others is the highest priority, followed by social significance, client and family priorities, and access to new reinforcers."],

// ---------- G ----------
["G","A teacher reinforces a student for raising his hand and ignores calling out. This is:",["DRA with extinction","DRO","DRL","Noncontingent reinforcement"],"Reinforcing a specific alternative behavior while withholding reinforcement for the problem behavior is DRA with extinction."],
["G","A child receives a sticker for every 10 minutes without hitting. This is:",["DRO","DRA","DRI","DRH"],"DRO delivers reinforcement for the absence of the target behavior during an interval."],
["G","A student asks many relevant questions but too often. The goal is to keep the behavior but reduce it to 3 per class. Which procedure fits?",["DRL","DRO","DRA","Extinction"],"DRL reinforces responding at or below a criterion. It keeps the behavior while lowering its rate."],
["G","An attention-maintained behavior is reduced by giving the child attention every 2 minutes regardless of behavior. This is:",["Noncontingent reinforcement on a fixed-time schedule","DRO","Extinction","A fixed-interval schedule"],"Delivering the maintaining reinforcer on a time schedule regardless of behavior is NCR. It abolishes the motivation for the problem behavior."],
["G","A therapist first reinforces any vocal sound, then only 'b' sounds, then 'ba,' then 'ball.' This is:",["Shaping","Chaining","Stimulus fading","Prompt fading"],"Reinforcing successive approximations while withholding reinforcement for earlier ones is shaping."],
["G","The therapist completes every step of handwashing except drying, which the learner does and then gets praise. Which procedure is this?",["Backward chaining","Forward chaining","Total task chaining","Shaping"],"In backward chaining the learner completes the last step first and contacts the terminal reinforcer right away."],
["G","A therapist starts with full physical guidance, then partial physical, then a gestural prompt. This is:",["Most-to-least prompting","Least-to-most prompting","Graduated guidance","Constant time delay"],"Beginning with the most intrusive prompt and fading to less intrusive prompts is most-to-least prompting."],
["G","The correct answer card is printed larger than the others, and over trials it is shrunk to match. This is:",["Stimulus fading of a within-stimulus prompt","Response prompting","Shaping","Extra-stimulus prompting"],"Changing a feature of the correct stimulus itself is a within-stimulus prompt. Gradually removing the exaggeration is stimulus fading."],
["G","The whole class earns extra recess only if every student completes homework. This is:",["An interdependent group contingency","A dependent group contingency","An independent group contingency","Response cost"],"When all members must meet the criterion for anyone to earn, the contingency is interdependent."],
["G","A child loses 2 tokens each time he swears, and swearing decreases. This is:",["Response cost (negative punishment)","Positive punishment","Extinction","Time-out"],"Removing a reinforcer the person already has, contingent on behavior, is response cost, a form of negative punishment."],
["G","A child's tantrums are maintained by escape from work, and the teacher uses time-out in the hallway. Tantrums increase. The most likely reason is:",["Time-out provides escape from work, so it is negatively reinforcing the tantrums","Time-out is always ineffective","The time-out was too short","The child is in an extinction burst"],"For escape-maintained behavior, removing the child from the task delivers the reinforcer. Time-out works only when time-in is reinforcing."],
["G","To promote generalization, a BCBA teaches greetings with several different people in several settings. This strategy is:",["Teaching sufficient (multiple) exemplars","Programming indiscriminable contingencies","Teaching a behavior trap","Response maintenance"],"Training across many examples of people and settings is teaching sufficient exemplars, a Stokes and Baer strategy."],

// ---------- H ----------
["H","Which goal is written in observable, measurable terms?",["Sam will independently write his name with all letters legible on 4 of 5 opportunities across 3 sessions","Sam will understand how to write his name","Sam will appreciate the importance of writing","Sam will improve his writing"],"A measurable goal states the learner, the observable behavior, the conditions, and the criterion."],
["H","A child screams to escape difficult work. Which replacement behavior is most appropriate?",["Asking for a break with a card or words","Sitting quietly for the full session","Raising a hand to get attention","Saying 'please' to get a toy"],"A replacement should serve the same function (escape) and be easier than the problem behavior."],
["H","A plan is not producing results. Before changing the plan, the BCBA should first:",["Check procedural integrity","Add a punishment component","Discontinue services","Increase session length"],"Low treatment integrity is a common reason interventions fail, so it is checked before concluding the plan does not work."],
["H","A child's tantrums stopped after FCT, but returned when caregivers stopped honoring break requests. This is:",["Resurgence","Spontaneous recovery","Stimulus generalization","Reinstatement"],"Resurgence is the return of a previously reduced behavior when the alternative behavior's reinforcement is reduced or removed."],
["H","A parent says the recommended procedure is too time-consuming to use at home. What should the BCBA prioritize?",["Contextual fit: adapting the plan so caregivers can implement it","Insisting on the original plan","Ending services","Implementing only in clinic"],"Interventions should fit the implementers' skills, resources, and routines, or they are unlikely to be carried out."],
["H","Before using extinction for a behavior that may burst, the BCBA should:",["Ensure caregivers can stay consistent through a burst and plan for safety","Start without telling caregivers","Use extinction only on weekends","Avoid teaching a replacement behavior"],"Planning for extinction bursts and safety is part of mitigating the unwanted effects of extinction."],
["H","Data show steady progress toward a goal. The most appropriate decision is to:",["Continue the current intervention","Change the intervention immediately","Add new goals and stop measuring","End services"],"When data show consistent improvement toward the goal, continuing is the data-based decision."],
["H","Which reflects a socially valid goal for a teenager?",["Learning to buy lunch at the school cafeteria, which the teen and family say is important","Learning to stack blocks because it is easy to measure","Sitting silently for 2 hours","Memorizing the names of dinosaurs the teen has no interest in"],"Social validity includes whether goals are important and acceptable to the client and stakeholders."],
["H","After a behavior that was reduced by extinction returns when the old reinforcer is delivered noncontingently, the effect is called:",["Reinstatement","Renewal","Resurgence","Behavioral momentum"],"Reinstatement is the return of a behavior after the reinforcer is presented again, independent of the behavior."],
["H","A BCBA wants to reduce the chance of relapse after successful treatment. Which is most helpful?",["Thin reinforcement gradually and train across settings and people","Stop treatment abruptly once the goal is met","Only treat in one setting","Switch to a new reinforcer each day"],"Gradual thinning and training across contexts support maintenance and reduce relapse such as renewal."],
["H","A student's SLP and teacher use different prompts for the same skill. The BCBA should:",["Collaborate with them to agree on consistent procedures","Tell them to stop working on the skill","Ignore it because only ABA procedures matter","Ask the parents to choose one professional"],"Collaborating with other professionals supports consistent, effective client services."],
["H","Which statement best describes why a punishment procedure should include a reinforcement component?",["Punishment alone does not teach what to do instead","Punishment is more effective without reinforcement","Reinforcement prevents all side effects","Funders require it"],"Punishment can reduce a behavior, but a replacement behavior must be taught and reinforced to meet the person's needs."],

// ---------- I ----------
["I","Which order matches behavioral skills training?",["Instructions, modeling, rehearsal, feedback","Modeling, feedback, instructions, rehearsal","Rehearsal, instructions, modeling, feedback","Feedback, modeling, rehearsal, instructions"],"BST follows instructions, modeling, rehearsal, and feedback, repeated until mastery."],
["I","A technician performs a procedure correctly in role-play but rarely in sessions. This is most likely a:",["Performance deficit","Skill deficit","Training deficit","Knowledge deficit"],"If the person can perform the skill but does not, the problem lies in antecedents or consequences, not in a lack of skill."],
["I","Which tool helps identify why staff are not performing a task, across training, task clarification, resources, and consequences?",["Performance Diagnostic Checklist-Human Services (PDC-HS)","VB-MAPP","Functional Analysis Screening Tool","QABF"],"The PDC-HS assesses variables affecting staff performance in human service settings."],
["I","At the start of supervision, a BCBA and supervisee sign a document outlining expectations, meeting frequency, and how feedback will be given. This is a:",["Supervision contract","Service agreement","Release of information","Treatment plan"],"A written supervision contract clarifies roles, expectations, and procedures for the supervisory relationship."],
["I","A PDC-HS shows staff lack the data sheets they need. The best intervention is to:",["Provide the materials and simplify access to them","Retrain staff with BST","Reprimand staff","Increase supervision hours"],"When the issue is resources, the solution addresses resources, not training."],
["I","Which feedback is most likely to improve staff performance?",["Specific feedback delivered soon after observation","General praise at the annual review","Vague feedback delivered in writing a month later","Feedback only when errors occur"],"Feedback works best when it is specific and immediate, describing what was done well and what to change."],
["I","A supervisor gives her most interesting cases to the supervisee she gets along with best. This raises concerns about:",["Equity in supervision practices","Procedural integrity","Social validity","Response generalization"],"Equitable supervision means fair access to opportunities, regardless of personal preference or bias."],
["I","To decide whether her supervision is working, a BCBA should look primarily at:",["Data on supervisee skills and client outcomes","How much the supervisee likes her","The number of meetings held","Her years of experience"],"Supervision effectiveness is evaluated through data on supervisee performance and the outcomes of their clients."],
["I","A clinic reduces the number of steps needed to enter session notes, and note completion increases. This performance management strategy is:",["Reducing response effort","Task clarification","Behavioral skills training","Goal setting"],"Making the correct behavior easier to perform is a manipulation of response effort."],
["I","A supervisor posts a checklist of the steps for setting up a session. This antecedent strategy is:",["Task clarification","Performance feedback","Response cost","Shaping"],"Checklists and job aids that specify what to do are forms of task clarification."],
["I","Which is a benefit of behavior-analytic supervision?",["Improved staff performance and client outcomes","Fewer data collected","Reduced need for training","Elimination of the need for consent"],"Effective supervision improves staff skills, client outcomes, and staff retention."],
["I","Before setting supervision goals, a BCBA should first:",["Assess the supervisee's current skills, cultural variables, and work environment","Assign the same goals to every supervisee","Wait for the supervisee to make mistakes","Set goals based only on the supervisor's preferences"],"Supervision goals should be based on an assessment of the individual supervisee's skills and context."]
];

</script>
<script>
/* data/mock1a.js */
// Mock exam 1, part 1 (Domains A to E). Format: [domain, stem, [correct, distractors...], explanation]. Correct is listed first; the app shuffles.
window.MOCK1 = (window.MOCK1 || []).concat([
// A (8)
["A","A BCBA records that a client's self-injury tends to occur more often on days after poor sleep. Which level of scientific understanding has been reached?",["Prediction","Control","Description","Experimentation"],"Observing that two events reliably co-vary allows prediction. Control requires manipulating a variable and producing change."],
["A","Which assumption holds that the world is lawful and orderly, so behavior has identifiable causes?",["Determinism","Empiricism","Pragmatism","Parsimony"],"Determinism is the assumption that events, including behavior, are caused and lawful."],
["A","A clinic insists that treatment decisions be based on directly observed and measured data, not on staff opinions. This reflects:",["Empiricism","Philosophic doubt","Mentalism","Selectionism"],"Empiricism is the practice of objective observation and measurement as the basis for knowledge."],
["A","Which explanation would a radical behaviorist reject as mentalistic?",["She avoids social events because of her low self-esteem","She avoids social events because past events produced ridicule","Avoidance has been negatively reinforced by escaping aversive situations","Her verbal statements about worry are behavior that can be analyzed"],"Explaining behavior with an inferred inner state (self-esteem) is mentalism. The others point to environmental history or treat private events as behavior."],
["A","An intervention study shows that problem behavior decreased only when, and every time, the intervention was in place. Which dimension of ABA does this demonstrate?",["Analytic","Effective","Technological","Generality"],"Analytic means the study demonstrates a believable functional relation between the intervention and the behavior."],
["A","A treatment manual explains that its error-correction procedure works through differential reinforcement and extinction. This reflects which dimension?",["Conceptually systematic","Technological","Applied","Behavioral"],"Conceptually systematic means procedures are described in terms of the basic principles from which they derive."],
["A","A BCBA providing in-home services to families, guided by research findings, is best described as engaging in:",["Professional practice guided by the science of behavior analysis","The experimental analysis of behavior","Behaviorism as philosophy","Basic research"],"Delivering services based on behavior-analytic science is professional practice. EAB and behaviorism refer to basic research and philosophy."],
["A","A client's new social skills continue at school and home months after treatment ends. Which dimension does this show?",["Generality","Analytic","Conceptually systematic","Technological"],"Generality means behavior change lasts over time, appears in other settings, or spreads to related behaviors."],

// B (26)
["B","A puppy's owner opens the treat bag, and the puppy salivates. Before training, the sound of the bag produced no salivation. The sound of the bag is now a(n):",["Conditioned stimulus","Unconditioned stimulus","Discriminative stimulus","Motivating operation"],"A previously neutral stimulus that elicits a response after pairing with an unconditioned stimulus is a conditioned stimulus."],
["B","Pressing a lever, pushing a button, and saying 'more' all produce access to the same snack for a child. Together these responses form:",["A response class","A stimulus class","A behavioral chain","A verbal operant"],"Responses with different forms that produce the same effect are members of one functional response class."],
["B","A child stops whining after his father begins taking away his tablet each time he whines. This is:",["Negative punishment","Negative reinforcement","Positive punishment","Extinction"],"A preferred stimulus is removed after the behavior and the behavior decreases, which is negative punishment."],
["B","A man buckles his seatbelt to stop the car's chime. The chime stops and he buckles up sooner in the future. This is:",["Negative reinforcement through escape","Negative reinforcement through avoidance","Positive reinforcement","Negative punishment"],"The chime is already sounding and buckling ends it. Ending an aversive stimulus already present is escape, a form of negative reinforcement."],
["B","A student completes her assignment early every day so the teacher will not keep her in at recess. The behavior is maintained by:",["Avoidance (negative reinforcement)","Escape (negative reinforcement)","Positive reinforcement","Negative punishment"],"Responding that prevents an aversive event from occurring is avoidance, a type of negative reinforcement."],
["B","A child rocks back and forth for long periods while alone, and the behavior persists without anyone responding. The most likely source of reinforcement is:",["Automatic reinforcement","Social positive reinforcement","Social negative reinforcement","Respondent conditioning"],"Behavior that persists without social consequences is likely maintained by stimulation it produces itself."],
["B","Which is an unconditioned reinforcer?",["Warmth when cold","A good grade","Money","Praise"],"Unconditioned reinforcers function without a learning history, often because of biological needs. The others are conditioned."],
["B","Money is a powerful reinforcer for most adults even when they are not hungry or thirsty. This is because money is a(n):",["Generalized conditioned reinforcer","Unconditioned reinforcer","Establishing operation","Automatic reinforcer"],"Money is paired with many backup reinforcers, so it is less dependent on any single motivating operation."],
["B","A parent's frown has been paired repeatedly with loss of privileges and now decreases behavior on its own. The frown is a(n):",["Conditioned punisher","Unconditioned punisher","Generalized reinforcer","S-delta"],"A stimulus that acquires its punishing effect through pairing with other punishers is a conditioned punisher."],
["B","A salesperson receives a bonus after an unpredictable number of sales, averaging 5. Which schedule is this, and what pattern is expected?",["Variable ratio; high, steady responding","Fixed ratio; high rate with pauses","Variable interval; moderate steady rate","Fixed interval; scalloped responding"],"Reinforcement after a varying number of responses is a VR schedule, which produces high, steady rates and strong resistance to extinction."],
["B","A student studies little right after an exam and studies more and more as the next scheduled exam approaches. This pattern resembles:",["A fixed-interval scallop","A variable-ratio pattern","Ratio strain","Spontaneous recovery"],"Low responding after reinforcement that accelerates near the end of a fixed period is the scallop typical of fixed-interval schedules."],
["B","A BCBA quickly moves a learner from FR 2 to FR 20 for completing math problems, and the learner stops working. This is:",["Ratio strain","An extinction burst","Behavioral contrast","Satiation"],"Increasing a ratio requirement too quickly can cause responding to break down, called ratio strain."],
["B","A child can choose between working on puzzles for tokens on one schedule or coloring for tokens on a different schedule, both available at the same time. This is a:",["Concurrent schedule","Multiple schedule","Chained schedule","Tandem schedule"],"Two or more schedules available simultaneously for different responses make up a concurrent schedule."],
["B","When a green card is displayed, requests for attention are reinforced; when a red card is displayed, they are not. The schedules alternate. This is a:",["Multiple schedule","Mixed schedule","Concurrent schedule","Conjunctive schedule"],"Alternating components that are each signaled by a distinct stimulus and each produce reinforcement form a multiple schedule."],
["B","A child must complete 5 math problems and then 3 spelling words, in that order, with no signal change between them, before receiving a reward. This is a:",["Tandem schedule","Chained schedule","Mixed schedule","Alternative schedule"],"Components that must be completed in sequence, with reinforcement at the end and no stimulus marking each component, form a tandem schedule."],
["B","A teacher who used to laugh at a student's jokes during lessons stops laughing. The jokes decrease. The decrease in behavior is best described as:",["Extinction as a process","Extinction as an operation","Negative punishment","Response cost"],"Withholding reinforcement is the operation; the resulting decrease in responding is the process."],
["B","After a week of no crying at bedtime, a child cries briefly one night even though crying is still not reinforced. This is:",["Spontaneous recovery","Resurgence","Reinstatement","An extinction burst"],"The reappearance of an extinguished behavior after time passes, without reinforcement, is spontaneous recovery."],
["B","A child reliably asks for help when his mother is in the room but not when his father is, because only his mother helps. The mother's presence functions as:",["An SD","An establishing operation","A conditioned reinforcer","An unconditioned stimulus"],"A stimulus in whose presence a response has been reinforced, and in whose absence it has not, is an SD."],
["B","A student raises her hand when the teacher is watching but calls out when the substitute is present, because the substitute answers call-outs. This shows:",["Stimulus discrimination","Response generalization","Stimulus generalization","Respondent extinction"],"Responding differently in the presence of different stimuli, based on different reinforcement histories, is discrimination."],
["B","After learning to wash his face with a cloth, a child begins washing his face with his hands, which was never taught. This is:",["Response generalization","Stimulus generalization","Response maintenance","Shaping"],"New, untrained responses that are functionally equivalent to the trained one show response generalization."],
["B","A child who has been without attention all morning engages in more attention-seeking behavior when his teacher enters. The morning without attention is best described as:",["An establishing operation","An SD","An abolishing operation","A conditioned punisher"],"Deprivation of attention increases its value as a reinforcer and increases behavior that has produced it."],
["B","Ice cream is available at the shop whether or not it is hot outside. On hot days, people buy more ice cream. The heat functions as:",["A motivating operation","An SD","A conditioned reinforcer","An S-delta"],"The heat does not signal availability; ice cream is available either way. It changes the value of ice cream, so it is an MO."],
["B","A child sees a toy car and says 'car,' and the therapist says 'Yes, that's a car!' This is a:",["Tact","Mand","Echoic","Intraverbal"],"A tact is evoked by a nonverbal stimulus and maintained by generalized reinforcement such as praise."],
["B","A therapist says 'apple' and the child says 'apple.' This is a(n):",["Echoic","Tact","Intraverbal","Textual"],"An echoic is controlled by a vocal verbal stimulus and has point-to-point correspondence and formal similarity."],
["B","A child is shown a picture of a dog and hears 'What animal says woof?' and responds 'dog.' The response is under the control of both a nonverbal and a verbal stimulus. This illustrates:",["Convergent multiple control","Divergent multiple control","An autoclitic","Echoic control"],"When a single response is controlled by more than one variable, it shows convergent multiple control."],
["B","Before a difficult request, a teacher asks a student to give a high five, touch her nose, and say his name, all of which he does readily. He then complies with the difficult request. This uses:",["Behavioral momentum","The matching law","Stimulus fading","A conjunctive schedule"],"A high-probability request sequence builds momentum, increasing compliance with a following low-probability request."],

// C (22)
["C","Which is the best operational definition of 'tantrum'?",["Crying or screaming above conversational volume while dropping to the floor, lasting 5 seconds or more, ending after 10 seconds without these behaviors","Getting very upset when told no","Acting out and being defiant","Expressing frustration in an unacceptable way"],"Good definitions are observable, measurable, and specify onset and offset, so different observers can agree."],
["C","A BCBA asks a teacher to complete a rating scale about how often a student is off task. This is:",["Indirect measurement","Direct measurement","Permanent product measurement","Momentary time sampling"],"Information gathered from informants rather than observation of the behavior itself is indirect measurement."],
["C","A tantrum lasts 4 minutes on Monday and 9 minutes on Tuesday. Which dimension is being recorded?",["Duration (temporal extent)","Latency (temporal locus)","Count (repeatability)","Interresponse time"],"Duration measures how long each instance of behavior lasts."],
["C","A child takes a bite every 3 seconds, and the goal is to slow eating to at least 15 seconds between bites. Which measure is most relevant?",["Interresponse time","Latency","Duration","Percentage correct"],"IRT measures the time between consecutive responses, which defines how fast the child eats."],
["C","Over a 30-minute session, a client engaged in 12 instances of hand-biting. What is the rate?",["0.4 per minute","2.5 per minute","12 per minute","0.25 per minute"],"Rate = count ÷ time = 12 ÷ 30 minutes = 0.4 responses per minute."],
["C","A student completed 8 of 10 math problems correctly yesterday and 16 of 20 today. A BCBA graphing only percentage correct would:",["Miss the change in the number of opportunities","Show an increase in accuracy","Show a decrease in accuracy","Overestimate responding"],"Both days show 80%, so percentage hides that the opportunities and correct responses doubled."],
["C","In whole-interval recording, an interval is scored when the behavior:",["Occurs throughout the entire interval","Occurs at any point in the interval","Is occurring at the end of the interval","Occurs at least twice in the interval"],"Whole interval requires the behavior throughout the interval, which tends to underestimate its occurrence."],
["C","Which method is a form of continuous measurement?",["Event recording of every instance","Partial-interval recording","Momentary time sampling","Whole-interval recording"],"Continuous measurement captures every instance of the behavior during the observation. Interval and time-sampling methods are discontinuous."],
["C","A teacher has 25 students and can only glance up every 5 minutes to see if a target student is reading. Which method is most practical?",["Momentary time sampling","Whole-interval recording","Continuous duration recording","Event recording"],"Momentary time sampling only requires observation at the end of each interval, which fits a busy teacher."],
["C","A BCBA reports how many trials it took a learner to reach mastery with two different teaching methods. This measure assesses:",["Efficiency of instruction (trials to criterion)","Social validity","Procedural integrity","Interobserver agreement"],"Trials to criterion is a measure of how efficiently a skill is learned."],
["C","A data collection system consistently records 2 more instances than actually occur in every session. The measurement is:",["Reliable but not accurate","Accurate but not reliable","Both accurate and reliable","Valid and accurate"],"Consistent error means the measurement is repeatable (reliable) but does not match the true value (not accurate)."],
["C","A BCBA measures a student's reading by counting words read in class, but the concern is reading comprehension. The problem is mainly one of:",["Validity","Reliability","Accuracy","IOA"],"Validity concerns whether the measure captures the behavior or dimension of interest."],
["C","Two observers record a 10-interval session. They agree on 8 intervals and disagree on 2. What is interval-by-interval IOA?",["80%","90%","75%","20%"],"Interval-by-interval IOA = agreements ÷ (agreements + disagreements) × 100 = 8 ÷ 10 × 100 = 80%."],
["C","Two observers record the duration of a tantrum as 120 seconds and 150 seconds. What is total duration IOA?",["80%","90%","120%","75%"],"Total duration IOA = shorter ÷ longer × 100 = 120 ÷ 150 × 100 = 80%."],
["C","Observers record data more carefully when they know their supervisor will check their data. This is:",["Observer reactivity","Observer drift","Measurement artifact","Regression"],"Observer reactivity is a change in observer behavior because the observer knows they are being monitored."],
["C","A BCBA wants to show how many tantrums have occurred in total across the school year. Which graph best displays this?",["Cumulative record","Bar graph","Scatterplot","Standard celeration chart"],"A cumulative record shows the running total of responses over time."],
["C","Which graph is best for identifying the times of day when problem behavior is most likely?",["Scatterplot","Cumulative record","Bar graph of total weekly counts","Equal-interval line graph by week"],"A scatterplot shows behavior across time periods and days, revealing temporal patterns."],
["C","On a line graph, the data path in intervention shows a large immediate change in level from baseline with no overlap. This indicates:",["A strong, clear intervention effect","High variability","An ascending baseline","No effect"],"An immediate change in level with no overlapping data points provides strong visual evidence of an effect."],
["C","Data in baseline bounce widely from 2 to 25 responses per session. Before introducing the intervention, the BCBA should generally:",["Continue baseline until the data are more stable, or look for sources of variability","Introduce the intervention immediately","Average the data and start","Switch to a bar graph"],"High variability makes effects hard to detect, so more baseline data or identifying sources of variability is needed."],
["C","Which aspect of visual analysis refers to the overall direction of a data path?",["Trend","Level","Variability","Immediacy"],"Trend is the direction of the data path: increasing, decreasing, or flat."],
["C","A BCBA collects data on whether staff deliver the correct number of reinforcers per session as written in the plan. This captures which dimension of procedural integrity?",["Dosage","Accuracy of topography","Social validity","Generality"],"Dosage refers to how much of the intervention is delivered, such as number of reinforcers or sessions."],
["C","A behavior occurs at a very high rate and has no clear start and end, such as hand-flapping. Which measurement is most practical?",["Momentary time sampling or interval recording","Latency recording","Trials to criterion","Permanent product"],"When instances are hard to count separately and occur at high rates, interval or time-sampling methods are practical."],

// D (14)
["D","In a study of video modeling on hand-washing, video modeling is the:",["Independent variable","Dependent variable","Extraneous variable","Baseline"],"The independent variable is the intervention that is manipulated."],
["D","Internal validity refers to:",["The degree to which changes in the DV can be attributed to the IV","The extent to which results generalize","The agreement between observers","The social importance of the goals"],"Internal validity is confidence that the IV caused the observed change in the DV."],
["D","During a study on a new reading program, the school also hires a reading tutor for the same child. This threat to internal validity is:",["History","Maturation","Testing","Attrition"],"An outside event happening during the study that could explain results is a history threat."],
["D","A participant improves simply because he has taken the same probe test many times. This threat is:",["Testing","Instrumentation","Maturation","History"],"Repeated measurement itself can change performance, which is the testing threat."],
["D","Which is a defining feature of single-case experimental designs?",["Each participant serves as his or her own control","Participants are randomly assigned to groups","Data are collected only before and after treatment","Results are always analyzed with inferential statistics"],"Single-case designs compare a participant's behavior across conditions using repeated measurement."],
["D","In an A-B-A-B design, behavior returns toward baseline levels when the intervention is withdrawn. This return provides:",["Verification","Prediction","Replication only","External validity"],"Showing that behavior would have stayed at baseline levels without the intervention is verification."],
["D","Which is a limitation of reversal designs?",["Withdrawing an effective treatment may be unethical, and some behaviors will not reverse","They cannot show experimental control","They require multiple participants","They cannot be used with a baseline"],"Reversal designs require withdrawing treatment, which can be unethical for dangerous behavior and uninformative for irreversible skills."],
["D","A BCBA introduces an intervention for one student on week 2, a second student on week 4, and a third student on week 6, while continuing baseline for the others. This is:",["A multiple baseline across participants","A reversal design","A multielement design","A changing-criterion design"],"Staggering the introduction of the IV across participants is a multiple baseline across participants."],
["D","For a multiple baseline across behaviors to show experimental control, the behaviors should be:",["Functionally independent but similar enough to be affected by the same IV","Identical in topography","Dependent on one another","Measured with different dimensions"],"Tiers must not change together, yet each must be likely to respond to the IV when it is applied."],
["D","A multiple probe design differs from a standard multiple baseline in that:",["Baseline data are collected intermittently rather than continuously","No baseline is collected","Treatment is withdrawn","Conditions alternate rapidly"],"Multiple probe designs use intermittent probes, useful when continuous baseline is impractical or reactive."],
["D","A major threat in a multielement design is:",["Multiple-treatment interference","Lack of a reversal","Long baselines","Inability to compare treatments"],"Because conditions alternate rapidly, the effects of one condition may carry over to another."],
["D","Which design is best suited to a behavior that should change gradually in steps, such as increasing minutes on a treadmill?",["Changing criterion","Reversal","Multielement","Multiple baseline across settings"],"Changing-criterion designs evaluate stepwise changes in performance criteria."],
["D","A researcher compares a token economy with a response cost procedure to determine which reduces disruption more. This is a:",["Comparative analysis","Parametric analysis","Component analysis","Descriptive analysis"],"Comparing two different treatments to see which is more effective is a comparative analysis."],
["D","In a multiple baseline graph, the second tier changes before the intervention is applied to it, at the same time the first tier changes. The BCBA should conclude:",["Experimental control is weakened for that tier","Experimental control is strengthened","The intervention generalized as planned, proving control","The design is a changing criterion"],"Untreated tiers should remain stable. Simultaneous change undermines the claim that the IV caused the change."],

// E (23)
["E","Which is one of the four core principles of the BACB Ethics Code for Behavior Analysts?",["Behave with integrity","Maximize billable hours","Defer to funding sources","Always use the most intensive treatment"],"The core principles are benefit others; treat others with compassion, dignity, and respect; behave with integrity; and ensure competence."],
["E","Engaging in unethical behavior can affect which of the following?",["The client, the behavior analyst, and the profession's reputation","Only the behavior analyst","Only the client","Only the employer"],"Unethical conduct risks harm to clients and stakeholders, sanctions for the professional, and damage to public trust in the field."],
["E","A newly certified BCBA wants to maintain competence. Which activity best fits?",["Reading current research and seeking consultation from experienced colleagues","Avoiding feedback to build confidence","Relying only on what was learned in coursework","Taking on new populations without guidance"],"Maintaining competence involves ongoing professional development, reading literature, and seeking consultation or mentorship."],
["E","A teacher asks a BCBA for a student's diagnosis and assessment results. The parents have not given consent. The BCBA should:",["Decline to share until written consent is obtained","Share the information because the teacher works with the student","Share only the diagnosis","Share if the teacher promises to keep it confidential"],"Confidential information is disclosed only with consent, except as required or permitted by law."],
["E","During an intake, when should a BCBA explain the limits of confidentiality?",["At the start of services","Only if a disclosure becomes necessary","Only when asked","At the end of services"],"Clients and stakeholders should be informed about confidentiality and its limits at the outset."],
["E","A BCBA's clinic website states 'We cure autism in 6 months.' This violates standards on:",["Public statements, because it misrepresents outcomes","Confidentiality","Supervision","Research"],"Public statements must not be false, deceptive, or exaggerated about services or outcomes."],
["E","A BCBA wants to ask a current client's mother for a testimonial for marketing. Under the Code, the BCBA should:",["Not solicit testimonials from current clients or stakeholders","Ask only if the mother is happy","Offer a discount in exchange","Ask the RBT to collect it instead"],"Behavior analysts do not solicit or use testimonials from current clients or stakeholders for advertising."],

["B","A child's heart races at the sight of a needle after a painful shot. The heart racing to the needle is a(n):",["Conditioned response","Unconditioned response","Operant response","Mand"],"A response elicited by a conditioned stimulus as the result of pairing is a conditioned response."],

["B","Reinforcement is delivered if a child completes 10 problems OR 5 minutes pass and she then completes one problem, whichever comes first. This is a(n):",["Alternative schedule","Conjunctive schedule","Tandem schedule","Mixed schedule"],"An alternative schedule delivers reinforcement when either requirement is met first."],

["B","A teacher ignores a student's escape-maintained screaming during math but lets the student leave math each time. The teacher's ignoring is:",["Not extinction, because the escape reinforcer is still delivered","Extinction","Negative punishment","Response cost"],"Extinction requires withholding the reinforcer that maintains the behavior. Here escape still occurs."],

// ---------- A ----------
["A","Which branch of behavior analysis is concerned with the philosophy of the science?",["Behaviorism","The experimental analysis of behavior","Applied behavior analysis","Professional practice"],"Behaviorism is the philosophy of the science of behavior. EAB is basic research, ABA is applied research, and professional practice is service delivery."],
["A","A teacher explains a student's refusal by saying he 'has a need for control.' What is the best behavior-analytic critique?",["It names an inferred inner cause that points to no variable you can change","It describes the refusal too narrowly to guide any intervention","It ignores the student's genetic and medical history","It is a sound way to operationally define the refusal"],"A 'need for control' is inferred from the refusal itself, so it is an explanatory fiction. It does not identify environmental variables that could be changed."],

["A","Mentalism is best described as:",["Explaining behavior with an inner dimension or hypothetical construct","Including thoughts and feelings in a natural science of behavior","Studying behavior only through direct, public observation","Explaining behavior through its history of consequences"],"Mentalism attributes the causes of behavior to an inner dimension such as the mind or personality traits. Radical behaviorism includes private events but treats them as behavior."],

["A","As an attitude of science, experimentation involves:",["Systematically changing a variable and measuring its effect on behavior","Observing behavior over time without changing anything","Choosing the simplest explanation available","Judging ideas by their practical outcomes"],"Experimentation means manipulating an independent variable while measuring behavior, which allows functional relations to be shown."],
