["B","Resistance to extinction refers to:",["How long responding continues after reinforcement stops","How quickly responding returns after reinforcement resumes","How strongly a conditioned stimulus elicits a response","How many responses are needed before reinforcement occurs"],"Resistance to extinction is the persistence of responding after reinforcement is discontinued.","B1"],
["B","A therapist keeps presenting tasks when a child screams and never gives breaks after screaming. This is:",["Escape extinction","Sensory extinction","Exclusionary time-out","Response cost"],"For escape-maintained behavior, extinction means the demand stays in place, so the behavior no longer produces escape.","B1"],
["B","Padded gloves are put on a child so that hand-mouthing no longer produces the same sensation. This is best described as:",["Sensory extinction","Escape extinction","Positive punishment","Response cost"],"Removing the sensory consequence of automatically reinforced behavior is sensory extinction.","B1"],
["B","Which statement about punishment is accurate?",["A stimulus is a punisher only if it decreases the behavior it follows","Any stimulus that the person finds unpleasant counts as a punisher","Punishment requires a stimulus to be added after the behavior","Punishment works by teaching the person a better alternative"],"Punishers are defined by their effect. Something unpleasant that does not decrease behavior is not a punisher for that behavior.","B1"],
["B","Topography refers to:",["The physical form or shape of a behavior","How often a behavior occurs","How long a behavior lasts","The effect a behavior has on the environment"],"Topography is the form of a response. Function is the effect it has.","B1"],
["B","Why is reinforcement usually most effective when delivered immediately?",["A delay lets other behavior occur and be reinforced instead","Delayed reinforcers lose all value after 30 seconds","Immediate reinforcement prevents generalization","Delays turn reinforcers into punishers"],"When reinforcement is delayed, other responses may occur and contact the reinforcer, weakening the link to the target behavior.","B1"],
["B","Unconditioned reinforcers are also called:",["Primary reinforcers","Secondary reinforcers","Generalized reinforcers","Token reinforcers"],"Unconditioned (primary) reinforcers function without learning. Conditioned reinforcers are also called secondary reinforcers.","B1"],
["B","A baby cries, his mother picks him up, and the crying stops. Picking him up becomes more likely next time. What maintains the mother's behavior?",["Negative reinforcement","Positive reinforcement","Positive punishment","Automatic reinforcement"],"The crying, an aversive stimulus, stops after the mother acts, which negatively reinforces picking the baby up.","B1"],
["B","After several weeks in a new apartment, a resident no longer startles when trains pass. This is:",["Habituation","Operant extinction","Negative punishment","Stimulus discrimination"],"Habituation is a decrease in a reflexive response after repeated presentation of the eliciting stimulus.","B1"],

// ---------- B2: schedules, stimulus control, MOs, rules ----------
["B","Which describes a VI 5-minute schedule?",["The first response after an average of 5 minutes is reinforced","Every response in a 5-minute period is reinforced","Reinforcement is delivered every 5 minutes regardless of behavior","An average of 5 responses is required for reinforcement"],"On a variable-interval schedule, the first response after a varying amount of time, averaging the stated value, is reinforced.","B2"],
["B","A child gets praise after 3 responses, then 7, then 2, then 8. Which schedule is this?",["VR 5","FR 5","VI 5","FI 5"],"Reinforcement after a varying number of responses averaging 5 is a VR 5 schedule.","B2"],
["B","A post-reinforcement pause is most characteristic of which schedule?",["Fixed ratio","Variable ratio","Variable interval","Continuous reinforcement"],"Fixed schedules, especially FR, produce a pause after each reinforcer. Variable schedules produce steadier responding.","B2"],
["B","Behavior maintained on which schedule would be most resistant to extinction?",["A thin variable-ratio schedule","Continuous reinforcement","FR 1","A fixed-time schedule"],"Thin intermittent schedules, especially variable ones, produce the greatest resistance to extinction.","B2"],
["B","A bus comes every 15 minutes and waits only 1 minute. Catching the bus works most like:",["A fixed-interval schedule with a limited hold","A variable-ratio schedule","A fixed-ratio schedule","A differential reinforcement of low rates schedule"],"Reinforcement is available after a fixed time but only for a short window, which is an interval schedule with a limited hold.","B2"],
["B","On a progressive-ratio schedule:",["The response requirement increases after each reinforcer","The requirement decreases after each reinforcer","Reinforcement is delivered on a time schedule","Two schedules alternate with signals"],"Progressive-ratio schedules raise the requirement systematically. The point where responding stops (breaking point) shows the reinforcer's strength.","B2"],
["B","Concurrent schedules are most often used to study:",["Choice","Respondent conditioning","Stimulus generalization","Imitation"],"Concurrent schedules make two or more options available at once, so they show how responding is allocated between them.","B2"],
["B","A pigeon pecks a green key on FR 5, which turns the key red; it then pecks the red key on FI 30 seconds for food. This is a:",["Chained schedule","Tandem schedule","Multiple schedule","Mixed schedule"],"Components run in a fixed order, each signaled by its own stimulus, with the primary reinforcer only at the end.","B2"],
["B","A teen curses only when her grandmother is absent, because her grandmother has scolded cursing. The grandmother's presence functions as a(n):",["An SDp","An S-delta","An SD for reinforcement","An establishing operation"],"A stimulus that signals punishment is likely suppresses responding in its presence. That is an SDp.","B2"],
["B","A learner points to the 'cat' card correctly only when it is on the left side of the table. This shows:",["Faulty stimulus control","Response generalization","Behavioral momentum","Stimulus equivalence"],"The response is controlled by position rather than by the picture, an irrelevant feature that teaching must correct.","B2"],
["B","A child recognizes her teacher only when the teacher is wearing glasses. This is an example of:",["Stimulus overselectivity","Response generalization","Higher-order conditioning","Spontaneous recovery"],"Responding controlled by one narrow feature of a complex stimulus is stimulus overselectivity, or restricted stimulus control.","B2"],
["B","A pigeon reinforced for pecking under a 550 nm light pecks less and less as test lights move further from 550 nm. A graph of this is called a:",["Generalization gradient","Cumulative record","Scatterplot","Celeration chart"],"A generalization gradient shows how responding changes as test stimuli differ more from the trained stimulus.","B2"],
["B","Water deprivation makes water more effective as a reinforcer. This describes the MO's:",["Value-altering effect","Behavior-altering effect","Discriminative effect","Respondent effect"],"The value-altering (reinforcer-establishing) effect changes how effective a consequence is as a reinforcer.","B2"],
["B","When thirsty, a person immediately goes to the fridge more often than usual. This describes the MO's:",["Behavior-altering effect","Value-altering effect","Abolishing effect","Discriminative effect"],"The behavior-altering effect is a change in the current frequency of behavior that has been reinforced by that consequence.","B2"],
["B","A room where a child once felt very cold now evokes requests for a sweater even on warm days. The room functions as a:",["CMO-S","CMO-T","CMO-R","UMO"],"A stimulus that has been paired with a UMO (cold) and now has a similar motivating effect is a surrogate CMO.","B2"],
["B","Which is an unconditioned motivating operation?",["Sleep deprivation","A teacher's instruction","A locked door","A token board"],"UMOs alter value without a learning history, as with deprivation of sleep, food, or water.","B2"],
["B","Rules are especially useful for controlling behavior when the natural consequences are:",["Delayed, small, or improbable","Immediate and large","Unconditioned reinforcers","Delivered on a CRF schedule"],"Rules can bridge delays and make weak or rare consequences effective, as with saving for retirement.","B2"],
["B","Which is the best example of an S-delta?",["A 'closed' sign on a store door","The smell of food when hungry","A locked car when you need your keys","A loud noise that elicits a startle"],"In the presence of a 'closed' sign, entering has not been reinforced, so the sign is an S-delta.","B2"],

// ---------- B3: verbal behavior and advanced principles ----------
["B","Which verbal operant is maintained by a specific reinforcer?",["Mand","Tact","Intraverbal","Echoic"],"Only the mand is reinforced by the specific item or action named. The others are typically maintained by generalized reinforcement.","B3"],
["B","A child sees the printed word 'dog' and writes 'dog.' This is:",["Copying a text","Textual behavior","Transcription","Echoic behavior"],"Writing what is seen in writing has point-to-point correspondence and formal similarity, which is copying a text.","B3"],
["B","A child points to the dog when asked 'Where's the dog?' This is:",["Listener responding","A tact","A mand","An intraverbal"],"Responding to someone else's verbal behavior by pointing or doing is listener behavior, not a speaker operant.","B3"],
["B","Which two verbal operants have both point-to-point correspondence and formal similarity?",["Echoic and copying a text","Textual and transcription","Tact and mand","Intraverbal and autoclitic"],"Echoic (spoken to spoken) and copying a text (written to written) match in form. Textual and transcription change modality.","B3"],
["B","Hearing 'Ready, set,' a child says 'go.' This is:",["An intraverbal","An echoic","A tact","A mand"],"A verbal response to a verbal stimulus without point-to-point correspondence is an intraverbal.","B3"],
["B","In the sentence 'I want juice,' the words 'I want' function as:",["An autoclitic","A tact","An echoic","A textual response"],"Autoclitics modify or clarify the speaker's own verbal behavior, here specifying that the rest is a request.","B3"],
["B","Hearing the word 'fruit' leads a child to say 'apple,' 'banana,' and 'orange.' This illustrates:",["Divergent multiple control","Convergent multiple control","Stimulus overselectivity","Echoic control"],"One stimulus evoking several different responses is divergent multiple control.","B3"],
["B","A learner is taught to select the printed word CAT given a picture of a cat. Without training, she selects the picture given the printed word. This is:",["Symmetry","Reflexivity","Transitivity","Stimulus generalization"],"Reversing a trained relation (A to B becomes B to A) without training shows symmetry.","B3"],
["B","Without training, a learner matches a picture of a shoe to an identical picture of a shoe. This is:",["Reflexivity","Symmetry","Transitivity","Recombinative generalization"],"Matching a stimulus to itself, also called generalized identity matching, is reflexivity.","B3"],
["B","A learner is taught A to B and B to C, and then selects C when shown A without training. This is:",["Transitivity","Symmetry","Reflexivity","Response generalization"],"Linking A to C through the shared B, without training, is transitivity.","B3"],
["B","A child learns that a nickel is 'bigger than' a dime in value, even though it is smaller in size. This kind of arbitrarily applicable relating is the focus of:",["Relational frame theory","The matching law","Behavioral momentum","Respondent conditioning"],"Relational frame theory describes learned relations such as comparison and opposition that do not depend on physical features.","B3"],
["B","After learning 'red ball' and 'blue car,' a child says 'blue ball' without being taught. This is:",["Recombinative generalization","Stimulus overselectivity","Echoic behavior","Spontaneous recovery"],"Recombining learned units into new, untrained combinations is recombinative generalization, the basis of matrix training.","B3"],
["B","According to behavioral momentum theory, behavior reinforced at a higher rate is:",["More resistant to disruption","Less resistant to disruption","Unaffected by reinforcement rate","More likely to extinguish quickly"],"Higher reinforcement rates produce greater resistance to change, which momentum theory compares to mass in physics.","B3"],
["B","In a high-probability request sequence, the low-probability request is best delivered:",["Right after reinforcement for the last high-probability response","At the start of the session before any easy requests","After a 5-minute break","Only after the learner refuses an easy request"],"The momentum built by quickly reinforced compliance carries over when the difficult request follows immediately.","B3"],
["B","Option A produces 30 reinforcers per hour and option B produces 10. According to the matching law, about what share of responding will go to option A?",["75%","50%","30%","100%"],"Relative responding matches relative reinforcement: 30 ÷ (30 + 10) = 75%.","B3"],
["B","After imitating many models whose imitation was reinforced, a child imitates new models that have never been reinforced. This is:",["Generalized imitation","Observational learning","An echoic","Stimulus overselectivity"],"Imitating new, never-reinforced models after a history of reinforced imitation is generalized imitation.","B3"],
["B","For a response to count as imitation, it must:",["Follow the model soon, match its form, and be controlled by it","Be reinforced every time it occurs, with the model still present","Occur at least a day later and resemble the model's outcome","Match the model's form, whatever controls the response"],"Imitation requires temporal proximity, formal similarity, and control by the model.","B3"],
["B","A child who is not hungry sees a cookie on the table and says 'cookie.' The teacher says 'Yes, a cookie,' and the child does not try to take it. This is most likely a:",["Tact","Mand","Intraverbal","Echoic"],"The response is evoked by a nonverbal stimulus and reinforced by praise, not by getting the cookie.","B3"]
]);

<script>
/* data/bank2.js */
// Question bank, part 2 (Domains C, D, E).
window.BANK = (window.BANK || []).concat([
// ---------- C ----------
["C","A BCBA records how long each tantrum lasts. Which measure is this?",["Duration per occurrence","Total duration","Latency","Interresponse time"],"Recording the length of each separate episode is duration per occurrence. Total duration sums all episodes in a session."],
["C","A teacher wants to know how many minutes a student spends reading across the whole class period. Which measure fits?",["Total duration","Duration per occurrence","Latency","Rate"],"Total duration captures the cumulative time spent in the behavior during the observation."],
["C","Event recording works best for behaviors that:",["Have clear starts and ends and do not occur at very high rates","Last a long time and vary a lot in how long each episode lasts","Happen at very high rates without a clear beginning or end","Occur continuously so that each instance blends into the next"],"Counting each instance requires discrete responses that observers can separate and count accurately."],
["C","Every 10 seconds, an observer marks whether a student left his seat at any point during the interval. Which method is this?",["Partial-interval recording","Whole-interval recording","Momentary time sampling","Event recording"],"Scoring an interval if the behavior happened at any time during it is partial-interval recording."],
["C","Which method is the better fit for measuring a behavior that must continue over time, such as staying on task?",["Whole-interval recording","Partial-interval recording","Event recording","Permanent product recording"],"Whole-interval recording requires the behavior throughout the interval, which suits behaviors you want to increase in duration."],
["C","A measurement artifact is:",["An apparent result produced by the measurement method rather than by the behavior","A real change in behavior caused by observers watching the client","A permanent product that the behavior leaves in the environment","A data point recorded during a phase different from the one graphed"],"Artifacts arise from how data are collected, such as interval length or observation timing, and can misrepresent behavior."],
["C","Observations are always scheduled during lunch, when a student's call-outs rarely happen, although the concern is during math. This mainly threatens:",["Validity","Accuracy of the counter","Interobserver agreement","Celeration"],"Measuring at times when the behavior is not relevant fails to capture the behavior of interest, a validity problem."],
["C","To check the accuracy of data, a BCBA compares them with:",["A true value obtained with a more exact method","A second trained observer's data from the same session","The client's own report of what happened","The average of data from the previous month"],"Accuracy is assessed against a true value, sometimes called calibration. A second observer's data assess agreement, not accuracy."],
["C","High interobserver agreement shows that:",["Two observers recorded the behavior consistently","The recorded data match the true values","The measurement system is socially valid","The intervention caused the behavior change"],"IOA indicates consistency between observers. Two observers can agree and both be wrong."],
["C","Two observers agree on 18 of 20 trials. What is trial-by-trial IOA?",["90%","80%","95%","18%"],"Trial-by-trial IOA = trials with agreement ÷ total trials × 100 = 18 ÷ 20 × 100 = 90%."],
["C","Two observers time two occurrences: 30 and 40 seconds for the first, 50 and 50 seconds for the second. What is mean duration-per-occurrence IOA?",["87.5%","75%","80%","100%"],"Each occurrence gives shorter ÷ longer: 30 ÷ 40 = 75% and 50 ÷ 50 = 100%. The mean is 87.5%."],
["C","Over 20 intervals, observer 1 scores intervals 3 and 7, and observer 2 scores intervals 3 and 9. What is scored-interval IOA?",["33%","90%","50%","67%"],"Only intervals scored by either observer count: 3, 7, and 9. They agree on 1 of those 3, so IOA is 33%."],
["C","A student reads 45 words correctly in 3 minutes. What is the rate?",["15 words per minute","45 words per minute","135 words per minute","3 words per minute"],"Rate = count ÷ time = 45 ÷ 3 = 15 words per minute."],
["C","A learner answers 12 of 16 trials correctly. What percentage is correct?",["75%","12%","80%","67%"],"12 ÷ 16 = 0.75, or 75%."],
["C","On a standard line graph of behavior, the horizontal axis usually shows:",["Time, such as sessions or days","The measure of behavior","The condition labels only","The number of observers"],"The x-axis shows the passage of time, and the y-axis shows the dimension of behavior measured."],
["C","A vertical dashed line on a line graph usually marks:",["A change in conditions","The goal criterion","The mean of baseline","A trend line"],"Phase change lines show where one condition ends and another begins."],
["C","How should data points on either side of a phase change line be drawn?",["They are not connected across the line","They are connected with a dashed line","They are averaged into one point","They are moved onto the line itself"],"Data paths are broken at phase changes so the separate conditions can be compared."],
["C","On a standard celeration chart, equal proportional changes in rate appear as:",["Equal vertical distances","Larger distances at higher rates","Smaller distances at higher rates","Changes in bar height"],"The chart's logarithmic y-axis shows doubling the same way whether it is 2 to 4 or 50 to 100."],
["C","Which method draws a trend line by dividing the data in half and using the median of each half?",["The split-middle method","Percentage of non-overlapping data","Interval-by-interval IOA","Visual scan of level"],"The split-middle method plots a line through the intersections of mid-dates and median values for each half of the data."],
["C","Data that vary little around their mean are described as:",["Stable","Ascending","Overlapping","Discontinuous"],"Stable data show low variability, which allows prediction of future responding."],
["C","After intervention begins, data jump immediately, then drift back toward baseline over the next sessions. The best description is:",["An immediate effect that was not sustained","A delayed effect that lasted throughout","A gradual trend with no change in level","High variability with no effect at all"],"An immediate change in level followed by a return toward baseline suggests the effect did not maintain."],
["C","Percentage of non-overlapping data (PND) is the percentage of intervention points that:",["Exceed the most extreme baseline point","Fall within the baseline range","Are higher than the goal","Were recorded by two observers"],"PND summarizes overlap. A higher PND indicates less overlap between baseline and intervention."],
["C","Which definition of 'hitting' is topography-based?",["Contact between the client's open or closed hand and another person's body","Any behavior that results in staff removing a task or demand","Any behavior that reliably produces attention from peers","Any act that the teacher considers aggressive or unsafe"],"A topography-based definition describes the form of the response. The middle two are function-based."],
["C","Observer training should continue until observers:",["Meet a set level of agreement with a standard on practice samples","Have observed at least one full session with an experienced observer","Can state the definition from memory without looking at it","Have read and signed the data collection instructions"],"Observers are trained to a performance criterion, often using video samples scored against a standard."],
["C","Using observers who do not know the study's purpose or phase helps reduce:",["Observer expectation bias","Observer drift","Measurement by permanent product","Regression to the mean"],"Naive or blind observers are less likely to record data in ways that confirm what they expect."],
["C","When using permanent product measurement, a key concern is:",["Confirming that the target person actually produced the product","Recording the products at the same time every single day","Measuring the latency to start the task as well","Counting products only after a second observer checks them"],"Products can be completed by someone else, as when a sibling does homework, which makes the data invalid."],
["C","Measuring the decibel level of a child's screaming captures which dimension?",["Magnitude","Latency","Rate","Trials to criterion"],"Magnitude is the force or intensity of a response, such as volume."],
["C","Celeration is expressed as:",["A change in rate over time, such as count per minute per week","A count of responses divided by minutes observed","The time between the end of one response and the next","The percentage of trials answered correctly per session"],"Celeration describes how rate changes across time, plotted on standard celeration charts."],
["C","A BCBA video-records sessions and compares staff data with the video scored by an expert. She is assessing:",["Accuracy","Social validity","Treatment acceptability","Generality"],"Comparing data with a criterion record of what actually happened evaluates accuracy."],
["C","Discontinuous measurement methods:",["Sample behavior and produce estimates","Record every instance of behavior","Measure only permanent products","Cannot be graphed"],"Interval recording and time sampling capture only part of the behavior, so they estimate it."],
["C","Momentary time sampling with 5-minute intervals is used for a behavior that lasts about 10 seconds. The most likely result is that the method will:",["Miss many instances and misrepresent the behavior","Overestimate duration by design","Produce perfect interobserver agreement","Measure latency instead"],"Brief behaviors are unlikely to be occurring at the exact moment each long interval ends."],
["C","Latency and interresponse time both describe which property of behavior?",["Temporal locus","Repeatability","Temporal extent","Magnitude"],"Temporal locus is when behavior occurs relative to other events. Duration is temporal extent; count is repeatability."],
["C","A graph's y-axis starts at 50 instead of 0, which makes a small change look large. The main problem is that it:",["Distorts how big the change looks","Hides the phase changes","Prevents calculating IOA","Turns it into a cumulative record"],"Truncated axes without a clear break exaggerate visual differences and mislead readers."],
["C","A drawback of summarizing session data in a bar graph is that it:",["Hides session-to-session variability and trends","Cannot show differences between conditions","Requires a logarithmic scale on the y-axis","Shows more detail than most readers need"],"Bar graphs summarize data, so changes within a condition are not visible."],
["C","Before IOA can be calculated, observers must:",["Record data independently, without seeing each other's records","Discuss each instance as it happens so they agree on it","Use slightly different definitions to test the definition","Observe on different days so the samples are independent"],"Independent recording is required for IOA to mean anything."],
["C","A data sheet asks the observer to record the time between the end of one bite and the start of the next. What is measured?",["Interresponse time","Latency","Duration","Rate"],"The time between successive responses is interresponse time."],
["C","Which question should guide the choice of a measurement system first?",["Which dimension of the behavior matters for this client's goal?","Which method do other clinicians in the clinic use most?","Which method requires the fewest data sheets per session?","Which method will show the largest change after treatment?"],"Measurement should capture the socially relevant dimension, then fit practical constraints."],
["C","A ratio such as 'correct responses per minute' is especially useful because it:",["Combines accuracy and speed","Ignores errors entirely","Removes the need for timing","Measures latency"],"Rate of correct responding reflects both accuracy and fluency."],
["C","A data path rises steeply in baseline, then levels off in intervention. If the goal is to increase behavior, this most likely shows:",["The increase was already happening, so the intervention's effect is unclear","A strong intervention effect, since behavior increased before it leveled off","Excellent baseline stability, which makes the comparison easy to interpret","A ceiling effect that proves the intervention reached its maximum"],"An ascending baseline in the desired direction makes it hard to credit the intervention with improvement."],
["C","Which recording method lets one observer monitor several students at once most easily?",["Momentary time sampling","Continuous duration recording","Event recording of every response","Whole-interval recording"],"Momentary time sampling only requires a glance at the end of each interval, so one observer can rotate among students."],

// ---------- D ----------
["D","Steady-state responding means that responding:",["Shows little variation over a period of time","Increases steadily across sessions","Decreases to zero","Changes every time conditions change"],"Steady-state responding is stable enough to predict, which is the basis for comparing conditions."],
["D","In an A-B-A-B design, the second B phase provides:",["Replication of the treatment effect","The first prediction of baseline","A test of generalization","A component analysis"],"Reintroducing the intervention and seeing the effect again replicates the finding."],
["D","A key weakness of a B-A-B design is that:",["There is no initial baseline to show what behavior was like before treatment","It cannot show any change in level between its conditions","It requires several participants who start treatment at different times","It requires rapid alternation of conditions within each session"],"Starting with treatment means the initial level of behavior without treatment is never measured."],
["D","In a nonconcurrent multiple baseline across participants, baselines are:",["Not run at the same time, which weakens control over history","Run at the same time, which strengthens control over history","Collected only once for each participant before treatment","Replaced by brief probes instead of continuous measurement"],"Without simultaneous baselines, outside events affecting one participant are not ruled out for the others."],
["D","A BCBA adds a fourth tier to a multiple baseline after the study begins, starting its baseline later. This is a:",["Delayed multiple baseline","Reversal design","Changing-criterion design","Multielement design"],"A delayed multiple baseline starts a later tier's baseline after the study is under way."],
["D","A token system is introduced in math, then reading, then science, with baseline continuing in the untreated classes. This is:",["A multiple baseline across settings","A multiple baseline across behaviors","A reversal design","An alternating treatments design"],"Staggering the same intervention across different settings is a multiple baseline across settings."],
["D","How many tiers do most researchers recommend for a multiple baseline design?",["At least three","Exactly one","Exactly two","At least ten"],"Three or more tiers provide enough replication to show a convincing functional relation."],
["D","A behavior that does not return to baseline levels when the IV is withdrawn is described as:",["Irreversible","Unstable","Ascending","Overlapping"],"Irreversibility makes reversal designs uninformative because withdrawal does not show verification."],
["D","In a multielement design, condition order is usually randomized or counterbalanced to reduce:",["Sequence effects","Observer drift","Regression to the mean","Attrition"],"Changing the order prevents one condition from always following another, which could cause carryover effects."],
["D","An adapted alternating treatments design compares two teaching methods by applying each to:",["Different but equally difficult sets of targets","The same target on alternate days","The same target in one long session","Two different learners only"],"Because skills cannot be unlearned, each method is applied to its own equivalent set of targets."],
["D","Experimental control in a changing-criterion design is shown when:",["Behavior closely follows each new criterion","Behavior exceeds every criterion immediately","The criterion never changes","Baseline and treatment overlap completely"],"When behavior changes to match each criterion, the criterion change is the likely cause."],
["D","An intervention is carried out differently from the written protocol. This mainly threatens:",["Both internal and external validity","Only social validity","Only interobserver agreement","Nothing, if the results are good"],"If the IV is not what was described, you cannot say what caused the change or how to replicate it."],
["D","In a drug evaluation, a placebo condition mainly controls for:",["Expectancy effects","Maturation","Instrumentation","Regression"],"A placebo shows whether change comes from expecting treatment rather than from the active drug."],
["D","In a double-blind study:",["Neither participants nor observers know which condition is in effect","Only the participants know which condition is in effect","Only the observers know which condition is in effect","Two observers independently record each session"],"Double-blind procedures protect against bias from both participants and observers."],
["D","Participants dropping out of a study before it ends is called:",["Attrition","Maturation","History","Testing"],"Attrition can bias results if the participants who leave differ from those who stay."],
["D","A researcher repeats a study but changes the setting and the population. This is:",["Systematic replication","Direct replication","A reversal","A component analysis"],"Systematic replication varies features of the original study to test the generality of the findings."],
["D","A researcher repeats a study with new participants using the exact same procedures. This is:",["Direct replication","Systematic replication","A parametric analysis","A multiple probe"],"Direct replication duplicates the original procedures to test reliability."],
["D","When two independent variables combined produce an effect that differs from either one alone, this is called:",["An interaction effect","A sequence effect","Regression to the mean","Maturation"],"Interaction effects occur when the effect of one variable depends on the presence of another."],
["D","Single-case researchers primarily evaluate their data with:",["Visual analysis","Inferential statistics only","Group averages","Self-report surveys"],"Visual analysis of level, trend, and variability is the primary method in single-case research."],
["D","Compared with statistical tests, visual analysis is more likely to:",["Miss small effects (Type II errors)","Report effects that do not exist (Type I errors)","Require large samples","Produce identical conclusions in every case"],"Visual analysis is conservative and tends to detect only clear effects, so small real effects may be missed."],
["D","An experimental question is best described as:",["A brief statement of what the researcher wants to learn","A prediction of the exact result the study will produce","A list of the procedures and materials to be used","A summary of the findings written after the study"],"Experimental questions guide design choices and often ask what effect an IV will have on a DV."],
["D","A multiple baseline in which each tier also includes a brief withdrawal phase is an example of:",["A combined design that strengthens experimental control","A design that cannot demonstrate experimental control","A changing-criterion design with several steps","A multielement design with an initial baseline"],"Combining elements of different designs can add verification and replication."],
["D","In a multiple baseline graph, a vertical analysis checks whether:",["Untreated tiers stay stable when the IV is applied to an earlier tier","Every tier has the same number of baseline data points","All tiers change at the same time when the IV starts","Each tier uses a different measure of the behavior"],"Stable untreated tiers show that change occurs only when the IV is applied, supporting control."],
["D","Baseline aggression is increasing, and the intervention aims to decrease it. What should the BCBA generally do?",["Start the intervention, since the trend runs opposite to the goal","Wait until aggression stops increasing on its own","End the study","Switch to a changing-criterion design"],"A baseline trending away from the goal does not make an improvement hard to interpret, and waiting prolongs dangerous behavior."],
["D","Baseline data are highly variable. Before intervening, a BCBA would ideally:",["Extend baseline or look for sources of the variability","Average the baseline data and start the intervention","Remove the most extreme points and then intervene","Switch to a bar graph to make the data easier to read"],"Variability makes it hard to detect effects, so more data or controlling extraneous variables helps."],
["D","An A-B design in clinical practice is useful for:",["Monitoring progress, though it cannot show a functional relation","Proving that the intervention caused the behavior change","Comparing two treatments quickly within the same sessions","Testing whether behavior generalizes across settings"],"A-B designs show whether behavior changed, but without verification or replication they cannot show causation."],
["D","In group designs, random assignment mainly controls for:",["Pre-existing differences between groups","Observer drift during data collection","Expectancy effects in participants","Sequence effects across conditions"],"Randomly assigning participants makes groups comparable before the IV is introduced."],
["D","Within-subject designs compare:",["The same participant's behavior across conditions","Two different groups of participants over time","The average of many participants in each condition","A participant's scores against national age norms"],"Within-subject (single-case) designs use each participant as his or her own control."],
["D","A researcher starts with prompts alone, then adds praise, then adds tokens, measuring the effect of each addition. This is an:",["Add-in component analysis","Drop-out component analysis","Parametric analysis","Reversal design"],"Adding components one at a time to see each one's contribution is an add-in component analysis."],

["G","In errorless discrimination training with stimulus fading, the S-delta often:",["Starts faint or absent and becomes more noticeable gradually","Starts at full intensity and fades out gradually","Is presented only after the learner makes an error","Is reinforced at first, then placed on extinction"],"Gradually increasing the S-delta's intensity helps the learner respond correctly without errors.","G1"],

["G","A therapist points to the correct picture. This is a:",["Gestural prompt","Physical prompt","Within-stimulus prompt","Model prompt"],"Pointing is a gestural response prompt.","G1"],
["G","Placing the correct card closer to the learner is a:",["Positional (stimulus) prompt","Physical prompt","Verbal prompt","Model prompt"],"Changing where the correct stimulus is placed is a stimulus prompt.","G1"],
["G","In simultaneous prompting, the therapist:",["Prompts at once on every teaching trial and checks learning on separate probe trials","Waits a fixed number of seconds before prompting on every teaching trial","Increases the delay before the prompt by 1 second after each correct trial","Starts with the least intrusive prompt and adds more help as needed"],"Simultaneous prompting gives a 0-second prompt during instruction and tests independence in probes.","G1"],
["G","Transfer of stimulus control means:",["Moving control of a response from the prompt to the natural SD","Moving control of a response from the natural SD to the prompt","Changing the reinforcer once the response is learned","Teaching a new response form through approximations"],"Prompt fading transfers control so the learner responds to the natural cue.","G1"],
["G","After an error, a therapist models the correct answer, has the learner repeat it, and then presents the trial again. This is:",["An error-correction procedure","Extinction","Shaping","Response cost"],"Error correction gives the correct response, practice, and another opportunity.","G1"],
["G","A favorite toy is placed in a clear container the child cannot open, so she must ask for help. This creates:",["A transitive MO that sets up a mand opportunity","A reflexive MO that sets up an escape response","An S-delta that signals help is unavailable","An abolishing operation for the toy"],"Blocking access makes help valuable (a CMO-T), creating a chance to teach a mand for help.","G1"],
["G","Why is reinforcement usually delivered immediately when teaching a new skill?",["Delays can let other responses be reinforced instead","Immediate reinforcement causes satiation","Delays always improve learning","Immediate delivery prevents generalization"],"Immediate reinforcement strengthens the target response specifically.","G1"],
["G","Matching the size of the reinforcer to the effort required:",["Helps keep responding strong when tasks are harder","Is unnecessary once a reinforcer has been identified","Causes satiation and should be avoided","Turns reinforcers into punishers over time"],"Harder tasks may need larger or higher-quality reinforcers to maintain responding.","G1"],
["G","Using a learner's own interests in teaching materials is mainly a way to:",["Increase motivation for the task","Punish off-task behavior","Remove the need for reinforcement","Create an S-delta"],"Embedding preferred items or topics can function as an establishing operation for engaging in the task.","G1"],

// ---------- G2 ----------
["G","In shaping, once the next approximation occurs reliably, earlier approximations are:",["No longer reinforced","Reinforced more often","Punished","Prompted"],"Shaping uses differential reinforcement: new approximations are reinforced and earlier ones are put on extinction.","G2"],
["G","During shaping, the learner fails to make the new approximation. The therapist should usually:",["Return briefly to the previous step, then try again","Skip ahead to the final target behavior","Stop reinforcing all responses until it occurs","Add a punisher for incorrect approximations"],"Moving too fast can cause responding to break down. Going back a step rebuilds success.","G2"],
["G","Using a clicker to mark the exact moment of a correct approximation works because the click is a:",["Conditioned reinforcer","Unconditioned reinforcer","Prompt","Punisher"],"The click is paired with backup reinforcers, so it can mark the response immediately.","G2"],
["G","A chain must be completed within a set time to earn reinforcement. This is a:",["A chain with a limited hold","A tandem schedule","A fixed-time schedule","A DRL schedule"],"A limited hold requires the chain to be finished within a time limit, promoting fluent performance.","G2"],
["G","To reduce an unwanted behavior chain, such as eating a whole bag of chips, it is often effective to:",["Break an early link or add a step that interrupts the chain","Reinforce the final link more heavily","Speed up each step so the chain ends sooner","Add more links at the end of the chain"],"Interrupting the chain early prevents the later links from occurring.","G2"],
["G","A learner keeps failing a step in a task analysis. The BCBA should consider:",["Breaking that step into smaller steps","Removing the step from the task","Teaching the whole chain faster","Ending the program"],"Steps that are too large for the learner can be divided into smaller units.","G2"],
["G","In incidental teaching, the teaching episode starts when:",["The learner initiates interest in an item or activity","The therapist presents a scripted SD at the table","The session timer starts","The learner engages in problem behavior"],"Incidental teaching uses the learner's initiation to set up a natural learning opportunity.","G2"],
["G","Which area is a pivotal response in pivotal response training?",["Motivation","Writing","Dressing","Counting"],"PRT targets pivotal areas such as motivation, responding to multiple cues, self-management, and self-initiation.","G2"],
["G","Mixing mastered tasks with new tasks during teaching mainly helps to:",["Keep reinforcement rates high and maintain motivation","Remove the need for prompts on new targets","Prevent mastered skills from generalizing","Increase errors so correction can occur"],"Interspersal of easy tasks keeps the learner contacting reinforcement.","G2"],
["G","In a 'mystery motivator' group contingency, the reward:",["Is chosen at random and kept hidden until earned","Is the same item every day so students know it","Is announced weeks ahead to build anticipation","Is given only to the student with the best score"],"Unknown, varied rewards reduce satiation and keep the contingency effective.","G2"],
["G","A risk of a dependent (hero) group contingency is that:",["The target student may face pressure from peers","No one can earn the reward","It always increases problem behavior","It requires tokens"],"When the group's reward depends on one student, peers may pressure or blame that student.","G2"],
["G","Teaching a learner to monitor and reinforce her own behavior in new settings promotes generalization by:",["Mediating generalization","Training loosely","Indiscriminable contingencies","Programming common stimuli"],"Self-management carries the contingencies into settings where no trainer is present.","G2"],
["G","Varying noncritical aspects of teaching, such as the therapist's wording and the room, is called:",["Training loosely","Programming common stimuli","General case analysis","Response cost"],"Training loosely prevents responding from depending on any one irrelevant feature.","G2"],
["G","A child learns to name dinosaurs, which earns attention from peers and leads to more play and more learning. This is a:",["Behavior trap","Behavior chain","Conditioned punisher","Extinction burst"],"Behavior traps draw the learner into natural contingencies that maintain and extend the behavior.","G2"],
["G","Teaching a learner several ways to greet, such as 'hi,' 'hello,' and a wave, promotes:",["Response generalization","Stimulus overselectivity","Extinction","Response cost"],"Teaching multiple response exemplars helps the learner use varied, functional responses.","G2"],
["G","A toddler calls every man 'Daddy.' This is best addressed by:",["Discrimination training","More generalization training","Response cost","Extinction of all speech"],"Overgeneralization calls for differential reinforcement so the response occurs only in the right stimulus conditions.","G2"],
["G","To support maintenance, a BCBA gradually lengthens the time between a correct response and reinforcement. This is:",["Delaying reinforcement","Extinction","Shaping","Prompting"],"Gradually introducing delays makes behavior more like natural conditions and more durable.","G2"],
["G","Which makes punishment more effective?",["Delivering it immediately and consistently","Starting with very mild intensity and raising it slowly","Allowing the behavior to be reinforced at the same time","Delivering it after long delays"],"Punishment works best when immediate, consistent, and not competing with reinforcement for the same behavior.","G2"],
["G","A possible side effect of response blocking is that:",["Blocking may function as attention or provoke aggression","Blocking always produces a burst that cannot be managed","Blocking teaches the client a replacement behavior","Blocking produces automatic reinforcement for the client"],"Physical blocking can deliver attention or evoke aggression, so it must be monitored.","G2"],
["G","A child must sit and watch peers play without participating after hitting. This is:",["Contingent observation","Exclusionary time-out","Response cost","Overcorrection"],"The child stays in the setting but loses access to reinforcement for a short time.","G2"],
["G","Why should release from time-out depend on the absence of problem behavior?",["Releasing during problem behavior could reinforce it","Releasing early always makes time-out more effective","Time-out should continue until the end of the day","Time-out works best when its length is unpredictable"],"Ending time-out while problem behavior occurs can negatively reinforce that behavior.","G2"],
["G","When a punishment procedure is stopped, the behavior often returns to earlier levels. This is called:",["Recovery from punishment","Resurgence","Stimulus generalization","Response maintenance"],"Behavior suppressed by punishment tends to recover when the punishment contingency ends.","G2"],
["G","A practical drawback of overcorrection is that it:",["Takes time and may require physical guidance","Reinforces the behavior it is meant to reduce","Has no effect unless paired with response cost","Can be carried out without any staff present"],"Overcorrection is labor-intensive and can lead to resistance or the need for guidance.","G2"],
["G","A teacher teaches 'push car' and 'roll ball,' then tests 'push ball' and 'roll car' without training. This is:",["Matrix training","Backward chaining","Shaping","Response cost"],"Matrix training teaches some combinations and tests others for recombinative generalization.","G2"],
["G","In equivalence-based instruction, a learner is taught A to B and A to C for one class. How many untrained relations can emerge?",["Four","Two","Three","Six"],"Symmetry gives B to A and C to A; combined equivalence relations give B to C and C to B.","G2"]
]);

// Question bank, part 4 (Domains H and I). Add any new questions at the end of this file.
window.BANK = (window.BANK || []).concat([
// ---------- H ----------
["H","Why include a generalization component in a skill objective?",["It makes sure the skill is used in the settings where it matters","It makes data collection faster and easier for staff","It removes the need for a separate mastery criterion","It lowers the goal so the client succeeds more quickly"],"Objectives that specify use across people and settings target socially meaningful outcomes."],
["H","Why is baseline data collected before an intervention begins?",["To show the current level of behavior so the effect can be evaluated","To delay treatment until the funding source approves services","To identify the client's diagnosis before treatment begins","To train staff on the plan before it is put in place"],"Baseline provides a comparison for judging change and helps set realistic goals."],
["H","Which belongs in a behavior intervention plan?",["Operational definitions, the function, replacement behaviors, and data collection","The client's diagnosis, IQ score, and a list of possible punishers","Only the target behaviors and the consequences for each one","The family's contact information and the session schedule"],"A complete plan includes definitions, a hypothesis of function, antecedent and consequence strategies, replacement behaviors, crisis steps, and data procedures."],
["H","The crisis section of a behavior plan describes:",["Steps to keep everyone safe if dangerous behavior occurs","Rewards the client earns for days without problem behavior","How sessions will be billed if a crisis occurs","The client's preferred items to offer after an episode"],"Crisis procedures specify how to respond safely to dangerous behavior."],
["H","Asking teachers to rate how acceptable and reasonable a planned procedure is measures:",["Treatment acceptability","Interobserver agreement","Procedural integrity","Treatment generality"],"Acceptability ratings assess the social validity of procedures."],
["H","The least restrictive alternative is the procedure that:",["Is effective while limiting the client's freedom as little as possible","Is the least expensive procedure available to the agency","Uses the fewest reinforcers and the least staff time","Has been used longest in the field of behavior analysis"],"Behavior analysts choose effective procedures that place the fewest restrictions on the client."],
["H","Two interventions have similar research support. One requires much less staff training. Other factors being equal, the BCBA should:",["Choose the one more likely to be carried out well","Choose the more complex one, since it is more thorough","Use both at once to increase the chance of success","Choose the one that is newer in the literature"],"Feasibility and contextual fit affect integrity and outcomes."],
["H","A functionally equivalent replacement behavior is one that:",["Produces the same reinforcer as the problem behavior","Looks the same as the problem behavior","Is chosen because it is easy to measure","Is never reinforced"],"Replacement behaviors must meet the same need as the problem behavior to compete with it."],
["H","To make a new FCR more efficient than aggression, the BCBA should at first:",["Reinforce the FCR immediately and every time","Reinforce the FCR only occasionally","Require a long sentence for the FCR","Delay reinforcement for the FCR"],"Dense, immediate reinforcement of the replacement helps it compete with the problem behavior."],
["H","After self-injury is treated, a client's play skills also improve without direct teaching. This is:",["A positive collateral effect","Behavioral contrast","An extinction burst","Resurgence"],"Interventions can produce unplanned changes in other behaviors, which should be monitored."],
["H","For automatically maintained hand-mouthing, sensory extinction is not practical. A good alternative is:",["Providing matched stimulation and reinforcing an alternative","Using time-out from attention after each instance","Ignoring the behavior so it extinguishes on its own","Providing escape from tasks when the behavior starts"],"When the sensory consequence cannot be blocked, competing stimulation and alternative behaviors are useful."],
["H","Booster sessions after treatment ends are used mainly to:",["Support maintenance of skills","Start a new baseline","Teach unrelated goals","Collect IOA"],"Periodic boosters help keep behavior change in place over time."],
["H","Procedural integrity can be measured with:",["A checklist of plan steps scored during observation","The client's progress data on the target behavior","A preference assessment completed each week","A survey of staff opinions about the plan"],"Integrity checklists show which steps were done correctly."],
["H","To prepare parents to carry out a new plan, the most effective approach is:",["Behavioral skills training","Handing them the written plan","A single phone call","A video they watch alone without practice"],"Instruction, modeling, rehearsal, and feedback produce accurate implementation."],
["H","Data are improving but stay below the aim line for several sessions in a row. A common decision rule is to:",["Consider modifying the intervention","Stop collecting data until progress resumes","Wait a full year before deciding anything","Lower the goal right away"],"Several consecutive points below the aim line often signal that a change is needed."],
["H","An aim line is:",["A line drawn from the current level to the goal by the target date","A line drawn through the average of the baseline data","A vertical line that marks a change in conditions","A trend line fitted to the intervention data"],"Aim lines show the expected rate of progress and help guide data-based decisions."],
["H","A client's progress plateaus after weeks of gains. The BCBA should check:",["Motivation, reinforcer value, prompt levels, and step size","Only the client's diagnosis and medical history","Only the color and layout of the data sheet","Nothing, since plateaus are a normal endpoint"],"Plateaus often reflect satiation, prompt dependence, or targets that are too large."],
["H","During extinction, aggression rises above the safety limits set in the plan. The BCBA should:",["Modify the plan to protect safety and add supports","Continue unchanged because bursts are expected","Remove all data collection","Add a harsher punisher"],"Safety comes first. The plan should be adjusted when side effects exceed acceptable limits."],
["H","Generalization probes are conducted by:",["Testing the skill in untrained settings or with new people","Repeating the training trials with the same therapist","Asking the client whether he uses the skill elsewhere","Graphing the baseline data again for comparison"],"Probes show whether a skill occurs outside the training conditions."],
["H","Maintenance probes are best scheduled:",["At intervals after the intervention has been withdrawn","During the first session of the intervention","Before baseline data are collected","Every minute during each training session"],"Maintenance is measured by checking behavior after treatment ends."],
["H","A client often tries to leave sessions and cries during a procedure. The BCBA should:",["Reconsider the procedure and increase reinforcement, since assent may be withdrawn","Continue the procedure as written, since crying is a normal extinction burst","Add physical guidance to keep the client in the session","End all services, since the client does not want treatment"],"Signs that assent is withdrawn call for reviewing and adjusting procedures."],
["H","A family speaks Spanish at home. The behavior plan should be:",["Written and explained in the family's preferred language","Written in English, since that is the clinic's language","Explained only to the child, who speaks English","Shared only with the school, which has interpreters"],"Plans that caregivers can understand improve contextual fit and integrity."],
["H","Teachers and the BCBA define 'aggression' differently. The best step is to:",["Agree on one shared operational definition","Let each person keep their own definition","Use the BCBA's data only","Stop measuring aggression"],"Consistent definitions improve data quality and consistent intervention."],
["H","A teacher wants a punishment-based plan for a student whose behavior is escape-maintained. The BCBA should:",["Explain the function and propose a function-based plan","Agree to use punishment, since the teacher requested it","Refuse to work with the teacher on this student","Use punishment at school and reinforcement at home"],"Educating stakeholders about function supports selecting effective, less restrictive interventions."],
["H","To evaluate the social validity of outcomes, a BCBA can:",["Ask stakeholders whether the changes made a meaningful difference","Calculate interobserver agreement on the outcome data","Graph the outcome data on a bar chart","Measure the latency of the target behavior"],"Social validity of outcomes concerns whether results matter to the client and stakeholders."],
["H","When using a punishment procedure, the BCBA should also:",["Monitor for emotional responding and avoidance","Stop collecting data on the target behavior","Remove all reinforcement during the procedure","Use the procedure without written consent"],"Punishment can have side effects that need to be measured and managed."],
["H","A mastery criterion of 80% for a skill the client must perform quickly at work may be too low because:",["The natural environment may require higher accuracy and fluency","80% is always too high for skills used at work","Mastery criteria do not affect how skills are used","Speed never matters once a skill is accurate"],"Criteria should reflect the level the skill must reach to be useful in real settings."],
["H","Building fluency, meaning accurate and quick responding, helps skills:",["Be retained, endure, and apply to new situations","Become dependent on prompts and reinforcement","Extinguish more quickly after training ends","Require more prompting in natural settings"],"Fluent skills tend to last longer, hold up under distraction, and combine with other skills."],
["H","A learner cannot sit and attend for 1 minute, and the BCBA wants to teach a 20-step task. The best first step is to:",["Build the prerequisite attending skills or start with a short task","Teach all 20 steps at once using total task chaining","Use time-out each time the learner leaves the table","Skip to the final step so the learner gets reinforced"],"Teaching prerequisite skills makes complex skills easier to learn."],
["H","A medication change happens during an intervention. The BCBA should:",["Note the change on the graph and consider it when interpreting data","Ignore it, since medication is outside behavior analysis","Ask the family to stop the medication until the study ends","Restart baseline automatically for all target behaviors"],"Marking events on graphs helps identify variables that may affect behavior."],
["H","A plan works in the clinic, but parents report no change at home. The BCBA should add:",["Generalization programming and caregiver training","More clinic hours with the same therapist","A new target behavior at the clinic","A punishment component for home use"],"Behavior change must be programmed to transfer to home settings."],
["H","A plan calls for planned ignoring of head-banging. What is the problem?",["Dangerous behavior cannot be safely ignored, so safety steps are needed","Planned ignoring always works best for self-injury","Planned ignoring requires too many staff to carry out","Planned ignoring is a form of positive punishment"],"Self-injury requires protective steps even when extinction is part of the plan."],
["H","A BCBA chooses a reinforcer for a replacement behavior. For escape-maintained behavior, the most logical reinforcer is:",["A brief break","A sticker","Praise only","Edible items only"],"Reinforcers that match the function, such as breaks for escape, make replacement behaviors effective."],
["H","Toward the end of services, the BCBA gradually reduces her direct involvement. The goal is to:",["Transfer implementation to caregivers and natural supports","Reduce costs by cutting the number of sessions","Increase the family's reliance on the BCBA","End data collection before discharge"],"Fading the analyst's role supports long-term maintenance."],
["H","Problem behavior has decreased, but the client still lacks a way to request help. The BCBA should:",["Teach a replacement skill so the client's needs are met","Stop services, since the behavior has decreased","Add punishment to keep the behavior low","Ignore requests for help to avoid reinforcing them"],"Reduction without a replacement may not last and does not meet the client's needs."],
["H","Integrity is high, but the client's data are still flat. The BCBA should next:",["Review the hypothesis of function and the reinforcers","Retrain staff again, even though integrity is high","Collect fewer data points to save time","Increase session length without other changes"],"When a plan is implemented correctly but not working, the plan itself needs review."],

// ---------- I ----------

["I","Individual supervision is especially important for:",["Specific feedback on the supervisee's own performance","Discussing research articles with other supervisees","Watching other supervisees present their cases","Learning the clinic's policies and procedures"],"Group supervision has value, but individual feedback targets each supervisee's skills."],

["I","Staff record their own implementation of each step after sessions, and integrity improves. This is:",["Self-monitoring","Public posting","Response cost","Goal setting only"],"Self-monitoring can improve staff performance by prompting attention to each step."],

["I","To teach supervisees how to give feedback to parents, a supervisor should:",["Model it and have them practice with feedback","Give them an article to read about feedback","Have them watch a parent meeting once","Skip it, since feedback skills come naturally"],"BST teaches feedback skills as it does any other skill."],

["I","Supervisees often copy their supervisor's professional behavior. This means the supervisor should:",["Model the conduct she expects","Keep her behavior private","Focus only on giving instructions","Avoid working near supervisees"],"Supervisors teach by modeling as well as by instruction."],

["I","Correct performance takes a lot of effort, and nobody notices when staff do it. The best intervention addresses:",["Both the response effort and the lack of reinforcement","Only the lack of training on the procedure","Only the hiring process for new staff","Only the client's treatment goals"],"When consequences and effort both work against performance, both need changing."],
["I","A supervisor praises all staff equally whether or not they complete the steps. The problem is that the praise is:",["Noncontingent","Too specific","Too immediate","A conditioned punisher"],"Praise must be contingent on correct performance to strengthen it."],
["I","Showing staff a short video of a procedure done correctly before they practice is an efficient form of:",["Video modeling","Response cost","Public posting","Shaping"],"Video modeling can replace or add to live modeling in staff training."],

["I","Posting each team's integrity scores on a board can improve performance, but the supervisor should also consider:",["Staff privacy and cultural preferences","Making scores secret from the supervisor","Removing all feedback","Posting client names"],"Public posting can work, but it should be used respectfully."],

["I","Supervision should teach supervisees to make decisions based on:",["Data","Personal opinion","Funding source preference only","What other clinics do"],"Data-based decision making is a core behavior-analytic skill."],

["I","Collecting anonymous feedback about supervision from supervisees helps because:",["Supervisees may share concerns more openly","It replaces performance data","It eliminates the need for meetings","It is required for every session"],"Anonymous feedback can reveal problems supervisees hesitate to raise directly."],
["I","A structured agenda for supervision meetings mainly helps to:",["Make sure key topics, feedback, and goals are covered","Keep every meeting under 5 minutes","Prevent supervisees from raising new questions","Replace the need for direct observation"],"Structure keeps supervision focused and efficient."],
